function reset() {
  const spawn = getPlayerSpawn();
  Object.assign(player, {
    x: spawn.x, y: spawn.y, vx: 0, vy: 0, w: HITBOX.stand.w, h: HITBOX.stand.h, facing: 1, grounded: false, onWall: 0, wallSlide: false,
    isDash: false, dashT: 0, dashDir: 0, dashReady: false, dashAir: false,
    dashEndLock: 0,
    chgT: 0, isChg: false, shootHold: 0, wjLock: 0, wjDir: 0, kCon: false, lCon: false, invT: 0, hp: P.MAX_HP, landing: false,
    crouch: false, forcedCrouch: false,
    animF: 0, animT: 0, animKey: '',
    melee: 0, meleeCd: 0, meleeCombo: 0, meleeReset: 0, meleeFinalLock: 0, meleeCurStage: 1,
  });
  // 重置两个角色的独立状态快照
  charStates.X = null; charStates.Zero = null;
  charStates[curChar] = snapshotPlayer();
  bullets = []; eBullets = []; particles = []; afterimages = []; muzzleEffects = []; hitEffects = []; meleeHitEffects = []; hitstop = 0;
  camera.x = 0;
  spawnAll();
}

function wallCheck(rect) {
  let l = false, r = false;
  const m = 3;
  const cl = { x: rect.x - 1, y: rect.y + m, w: 2, h: rect.h - m * 2 };
  const cr = { x: rect.x + rect.w - 1, y: rect.y + m, w: 2, h: rect.h - m * 2 };
  for (let rr = 0; rr < LH; rr++) for (let cc = 0; cc < LW; cc++) {
    if (map[rr * LW + cc] === 0) continue;
    const t = { x: cc * TILE, y: rr * TILE, w: TILE, h: TILE };
    if (overlap(cl, t)) l = true;
    if (overlap(cr, t)) r = true;
  }
  return { l, r };
}

// ==================== 下蹲 / 冲刺碰撞盒 ====================
// 把玩家碰撞盒宽度/高度切换到指定值，保持脚底(y+h)不变、水平中心(cx)不变
function setPlayerBox(w, h) {
  const cx = player.x + player.w / 2;
  const bottom = player.y + player.h;
  player.w = w;
  player.h = h;
  player.x = cx - w / 2;
  player.y = bottom - h;
}

// 检测将碰撞盒切换到指定宽高（保持脚底 bottom 与水平中心 cx，与 setPlayerBox 一致）后，
// 新碰撞盒是否与地形重叠。返回 true 表示无冲突（可切换），false 表示冲突（禁止切换）。
function boxFitsTerrain(w, h) {
  const cx = player.x + player.w / 2;
  const bottom = player.y + player.h;
  const rect = { x: cx - w / 2, y: bottom - h, w, h };
  for (let r = 0; r < LH; r++) for (let c = 0; c < LW; c++) {
    if (map[r * LW + c] === 0) continue;
    if (overlap(rect, { x: c * TILE, y: r * TILE, w: TILE, h: TILE })) return false;
  }
  return true;
}

// 检测角色碰撞盒正下方是否有实体地形支撑（true 表示脚下有地面）
function hasGroundBelow() {
  const probe = { x: player.x, y: player.y + player.h, w: player.w, h: 1 };
  for (let r = 0; r < LH; r++) for (let c = 0; c < LW; c++) {
    if (map[r * LW + c] === 0) continue;
    if (overlap(probe, { x: c * TILE, y: r * TILE, w: TILE, h: TILE })) return true;
  }
  return false;
}

// 检测当前位置站起(站立碰撞盒)是否会被头顶实体卡住，true 表示能站起
function canStandUp() {
  const bottom = player.y + player.h;
  const standRect = { x: player.x, y: bottom - HITBOX.stand.h, w: HITBOX.stand.w, h: HITBOX.stand.h };
  for (let r = 0; r < LH; r++) for (let c = 0; c < LW; c++) {
    if (map[r * LW + c] === 0) continue;
    if (overlap(standRect, { x: c * TILE, y: r * TILE, w: TILE, h: TILE })) return false;
  }
  return true;
}

// 统一的下蹲/站起状态切换。forced=true 表示强制蹲下(锁移动)
function setCrouch(on, forced) {
  if (on) {
    if (!player.crouch) {
      // 站起→下蹲切换碰撞盒 B 前检测冲突，冲突则拒绝下蹲
      if (!boxFitsTerrain(HITBOX.crouch.w, HITBOX.crouch.h)) return;
      setPlayerBox(HITBOX.crouch.w, HITBOX.crouch.h);
    }
    player.crouch = true;
    player.forcedCrouch = forced;
  } else {
    if (player.forcedCrouch) return;  // 强制蹲下时不能手动站起
    if (!canStandUp()) return;        // 顶头则继续蹲着
    if (player.crouch) setPlayerBox(HITBOX.stand.w, HITBOX.stand.h);
    player.crouch = false;
  }
}

// dash 结束：恢复高度或转为强制蹲下
function endDash() {
  player.isDash = false;
  player.vx = 0;
  player.dashEndLock = 2;   // 冲刺结束锁：2 帧内强制地面动画，避免碰撞盒切换临界帧误入 airborne 闪 jump
  if (!player.crouch && !player.forcedCrouch) {
    if (canStandUp()) setPlayerBox(HITBOX.stand.w, HITBOX.stand.h);
    else setCrouch(true, true);
  }
}

// ==================== 近战挥砍（Zero） ====================
// 攻击范围 = blade.png 逆时针旋转 90° 后的矩形（见 meleeRect）。
// blade 缩放规则：旋转 90° 后高度 = 角色高度（P.PH）。
// stageMult：三段连击的范围放大倍率（第 1 段为基准 1.0）。
function meleeStageMult(stage) {
  const idx = Math.max(0, Math.min(stage - 1, MELEE_STAGES.length - 1));
  return MELEE_STAGES[idx].range / MELEE_STAGES[0].range;
}

function meleeRect(stage) {
  const p = player;
  // blade 原始宽高（未加载时用近似正方形 1:1 兜底）
  const bw = (BLADE.loaded && BLADE.img.naturalWidth) ? BLADE.img.naturalWidth : 1;
  const bh = (BLADE.loaded && BLADE.img.naturalHeight) ? BLADE.img.naturalHeight : 1;
  // 逆时针旋转 90° 后：渲染宽 = 原高(bh)，渲染高 = 原宽(bw)
  // 缩放：旋转后高度（=bw）→ P.PH，再乘段数放大倍率
  const targetH = P.PH;
  const s = targetH / bw * meleeStageMult(stage);
  const dispW = bh * s;         // 旋转后宽度（含段数放大，刀光长度方向）
  const dispH = targetH * meleeStageMult(stage);  // 旋转后高度（含段数放大）
  const cx = p.x + p.w / 2;
  const cy = p.y + p.h / 2;
  // 矩形：从角色前方开始（刀光中心向前偏移 dispW/2，与视觉一致），垂直方向居中 dispH
  let rx, ry;
  if (p.facing > 0) {
    rx = cx;
    ry = cy - dispH / 2;
  } else {
    rx = cx - dispW;
    ry = cy - dispH / 2;
  }
  return { x: rx, y: ry, w: dispW, h: dispH };
}

// 挥砍触发帧：仅播放特效（伤害判定交给动画期间每帧的 doMeleeHit）
function doMelee(stage) {
  const p = player;
  const cx = p.x + p.w / 2, cy = p.y + p.h / 2;
  spawnPart(cx + p.facing * 10, cy - 4, 6, '#8cf');
}

// 挥砍动画期间逐帧判定（仅 Zero）。命中冷却 meleeLock>0 的怪物跳过；
// 命中帧 + 5 帧无伤害 = 6 帧一次，12 帧动画内最多命中 2 次（第 1/7 帧）。
// 命中触发 hitstop 全冻结；同帧多目标合并为一次停顿。
function doMeleeHit(stage) {
  const p = player;
  const idx = stage - 1;
  if (idx < 0 || idx >= MELEE_STAGES.length) return;
  const { dmg } = MELEE_STAGES[idx];
  const rect = meleeRect(stage);
  let hitAny = false;
  for (let j = enemies.length - 1; j >= 0; j--) {
    const en = enemies[j];
    if (overlap(rect, { x: en.x, y: en.y, w: en.w, h: en.h })) {
      if (en.meleeLock > 0) continue;   // 命中冷却中，本次不生效
      if (dmgEnemy(en, dmg)) enemies.splice(j, 1);
      en.meleeLock = 6;
      // Zero 专属受击特效（通用 hit 动画，画在怪物上层）
      spawnMeleeHitEffect(en.x + en.w / 2, en.y + en.h / 2, p.facing);
      hitAny = true;
    }
  }
  if (hitAny) hitstop = HITSTOP;
}

// ==================== 主循环 ====================
function update() {
  // 编辑模式下暂停游戏逻辑
  if (editMode) return;
  // hitstop 全冻结：怪物/玩家/子弹/挥砍动画全部定格（仅 Zero 近战命中触发）
  if (hitstop > 0) { hitstop--; return; }

  const p = player;
  if (p.invT > 0) p.invT--;
  if (p.wjLock > 0) p.wjLock--;
  if (p.dashEndLock > 0) p.dashEndLock--;

  const jD = keys['j'] || keys['J'];
  const kR = keys['k'] || keys['K'];
  const lR = keys['l'] || keys['L'];
  const sR = keys['s'] || keys['S'];
  if (!kR) p.kCon = false;
  const kD = kR && !p.kCon;
  if (!lR) p.lCon = false;
  const lD = lR && !p.lCon;
  let mx = 0;
  if (keys['a'] || keys['A']) mx = -1;
  if (keys['d'] || keys['D']) mx += 1;
  if ((keys['a'] || keys['A']) && (keys['d'] || keys['D'])) mx = 0;

  // 墙面
  const pr = { x: p.x, y: p.y, w: p.w, h: p.h };
  const ws = wallCheck(pr);
  const wasWall = p.onWall;
  p.onWall = 0; p.wallSlide = false;
  if (!p.grounded) {
    if (ws.l) p.onWall = -1; if (ws.r) p.onWall = 1;
    if (p.onWall !== 0 && p.vy > 0) {
      const press = (p.onWall === -1 && mx === -1) || (p.onWall === 1 && mx === 1);
      if (press) { p.vy = Math.min(p.vy, P.WALL_SLIDE); p.wallSlide = true; }
    }
  }

  // 攻击：X = 射击蓄力；Zero = 近战挥砍三段连击
  if (CHARS[curChar].melee) {
    // === Zero 近战 ===
    // 冷却 / 连击重置 / 第三段硬直倒计时
    if (p.meleeCd > 0) p.meleeCd--;
    if (p.meleeReset > 0) { p.meleeReset--; if (p.meleeReset === 0) p.meleeCombo = 0; }
    if (p.meleeFinalLock > 0) p.meleeFinalLock--;
    // 挥砍渐隐
    if (p.melee > 0) p.melee--;

    if (jPressed && jD && p.meleeCd === 0 && p.meleeFinalLock === 0) {
      jPressed = false;  // 消费按下沿：长按不连挥，每次挥砍都需要重新按攻击键
      let stage;
      if (!p.grounded) {
        // 空中攻击：固定第 2 段，不推进连击段数；使用独立 0.5s 间隔 CD
        stage = 2;
        p.meleeCd = MELEE_AIR_CD;
      } else {
        // 地面攻击：连击推进（重置窗口内继续下一段，否则第 1 段；3 段后回到第 1 段）
        stage = (p.meleeCombo >= 3) ? 1 : p.meleeCombo + 1;
        p.meleeCombo = stage;
        p.meleeReset = MELEE_RESET;
        p.meleeCd = MELEE_CD;
        // 第三段后硬直
        if (stage === 3) p.meleeFinalLock = MELEE_FINAL_LOCK;
      }
      p.meleeCurStage = stage;  // 记录本次挥砍段数，供绘制/范围显示
      p.melee = MELEE_ACTIVE;
      p.shootHold = 8;  // 挥砍进入短暂攻击动画
      // 执行挥砍判定
      doMelee(stage);
      if (p.grounded && !p.landing && mx === 0) { p.animF = 1; p.animT = 0; }
    }
  } else {
    // === X 射击蓄力 ===
    jPressed = false;  // X 不消费按下沿，清零避免切回 Zero 时残留误触发
    if (jD) {
      if (!p.isChg) {
        p.isChg = true; p.chgT = 0;
        let sd = p.facing; if (p.wallSlide) sd = -p.onWall;
        spawnBullet(p.x + (sd > 0 ? p.w : 0), p.y, sd, 0);
        p.shootHold = 15;  // 普通射击：发射子弹瞬间进入射击动画（保留 0.25s）
        // 仅站立不动射击(shoot)重置帧到第二帧；空中(jumpShoot)/移动射击(runShoot/dashShoot)不重置，
        // 保持与移动动画的帧同步（由 KEEP_FRAME_PAIRS 保证切换时保留当前帧索引）
        if (p.grounded && !p.landing && mx === 0) { p.animF = 1; p.animT = 0; }
      } else {
        p.chgT++;
        if (p.chgT >= P.CHG2 && p.chgT === P.CHG2) spawnPart(p.x + p.w / 2, p.y + p.h / 2, 3, '#f44');
      }
    } else {
      if (p.isChg) {
        let pw = 0;
        if (p.chgT >= P.CHG2) pw = 2;
        else if (p.chgT > P.CHG1) pw = 1;
        if (pw > 0) {
          let sd = p.facing; if (p.wallSlide) sd = -p.onWall;
          spawnBullet(p.x + (sd > 0 ? p.w : 0), p.y, sd, pw);
          p.shootHold = 15;  // 蓄力发射：松手发射蓄力弹时进入射击动画（保留 0.25s）
          // 仅站立不动射击(shoot)重置帧到第二帧；空中(jumpShoot)/移动射击(runShoot/dashShoot)不重置，
          // 保持与移动动画的帧同步（由 KEEP_FRAME_PAIRS 保证切换时保留当前帧索引）
          if (p.grounded && !p.landing && mx === 0) { p.animF = 1; p.animT = 0; }
        }
        p.isChg = false; p.chgT = 0;
      }
    }
  }

  // Dash 1
  if (p.isDash) {
    p.dashT--;
    p.vx = p.dashDir * P.SPEED * P.DASH_MULT;
    let cancel = false;
    if (p.dashT <= 0) cancel = true;
    const hFwd = (p.dashDir === 1 && mx === 1) || (p.dashDir === -1 && mx === -1);
    if (!lR && !hFwd) cancel = true;
    if (mx !== 0 && mx !== p.dashDir) cancel = true;
    // 冲刺过程中脚下无地面支撑则立即结束冲刺（掉落），避免悬空冲
    if (!hasGroundBelow()) cancel = true;
    if (cancel) { endDash(); p.dashReady = !!lR; }
    if (kD) {
      p.vy = P.JUMP; p.grounded = false;
      p.vx = mx !== 0 ? mx * P.SPEED * P.DASH_MULT : 0;
      p.isDash = false; p.dashReady = false; p.dashAir = true; p.kCon = true;
      // 空中冲刺跳恢复跳跃碰撞盒（=站立盒 A）：dashAir 动画走 jump 分支，碰撞盒须同步，不能停留在 dash 的低矮 B 盒
      // （含下蹲冲刺跳场景：只要不是强制蹲下，跳起后都站直为站立盒）
      if (!p.forcedCrouch) { setPlayerBox(HITBOX.stand.w, HITBOX.stand.h); p.crouch = false; }
      spawnPart(p.x + p.w / 2, p.y + p.h, 5, '#aaf');
    }
  }
  // Dash 2
  if (p.dashReady) {
    if (!lR) p.dashReady = false;
    if (kR && p.grounded && !p.kCon) {
      p.vy = P.JUMP; p.grounded = false;
      if (mx !== 0) p.vx = mx * P.SPEED * P.DASH_MULT;
      p.dashReady = false; p.dashAir = true; p.kCon = true;
      spawnPart(p.x + p.w / 2, p.y + p.h, 5, '#aaf');
    }
  }
  // 移动
  if (!p.isDash && !p.dashAir) {
    if (p.wjLock > 0) { p.vx = p.wjDir * P.WALL_JUMP_X; }
    else {
      if (mx !== 0) p.facing = mx;   // 面向始终跟随方向键（下蹲时也允许左右选择朝向）
      if (p.crouch || p.forcedCrouch) { p.vx = 0; }   // 下蹲时锁死位移，只允许 dash
      else if (mx !== 0) { p.vx = mx * P.SPEED; }
      else p.vx = 0;
    }
  }
  // Dash
  if (lD && p.grounded && !p.isDash && !p.dashReady) {
    // 站立→dash 切换碰撞盒 B 前检测冲突：若新碰撞盒与地形重叠则禁止本次 dash
    const dashBlocked = !p.crouch && !boxFitsTerrain(HITBOX.dash.w, HITBOX.dash.h);
    if (!dashBlocked) {
      p.isDash = true; p.dashDir = p.facing; p.lCon = true;
      const ds = P.SPEED * P.DASH_MULT;
      p.dashT = Math.floor(P.DASH_DIST / ds);
      p.vx = p.dashDir * ds;
      if (!p.crouch) setPlayerBox(HITBOX.dash.w, HITBOX.dash.h);   // dash 期间压低碰撞盒（宽=dash，高=crouch）
      spawnPart(p.x + p.w / 2, p.y + p.h / 2, 8, '#aaf');
    }
  }
  // 跳跃
  if (kD) {
    if (p.grounded && !p.isDash && !p.dashReady) {
      // 起跳前若处于下蹲，先恢复站立碰撞盒（跳跃碰撞盒=站立）
      if (p.crouch && !p.forcedCrouch && canStandUp()) {
        setPlayerBox(HITBOX.stand.w, HITBOX.stand.h);
        p.crouch = false;
      }
      p.vy = P.JUMP; p.grounded = false; p.kCon = true;
      // 若仍在落地尾段播放中（landing=true）就再次起跳，舍弃剩余尾段，重新从起跳段(索引0)播放跳跃动画
      if (p.landing || p.animKey === 'jump' || p.animKey === 'jumpShoot') {
        p.landing = false;
        p.animF = 0; p.animT = 0;
      }
      if (lR) { if (mx !== 0) p.vx = mx * P.SPEED * P.DASH_MULT; p.dashReady = false; p.dashAir = true; spawnPart(p.x + p.w / 2, p.y + p.h, 5, '#aaf'); }
      else spawnPart(p.x + p.w / 2, p.y + p.h, 5, '#fff');
    }
    if (p.onWall !== 0 && !p.grounded) {
      p.vy = P.WALL_JUMP_Y; p.facing = -p.onWall;
      p.wjLock = P.WALL_LOCK; p.wjDir = -p.onWall; p.kCon = true;
      if (lR) { p.vx = -p.onWall * P.WALL_JUMP_X * P.DASH_MULT; p.dashAir = true; spawnPart(p.x + p.w / 2, p.y + p.h / 2, 6, '#aaf'); }
      else { p.vx = -p.onWall * P.WALL_JUMP_X; spawnPart(p.x + p.w / 2, p.y + p.h / 2, 6, '#8cf'); }
    }
  }
  // Dash air
  if (p.dashAir && !p.grounded && !p.onWall && !p.isDash && p.wjLock <= 0) {
    p.vx = mx !== 0 ? mx * P.SPEED * P.DASH_MULT : 0;
    if (mx !== 0) p.facing = mx;   // 面朝方向跟随方向键（与普通跳跃一致）
  }
  // 重力
  if (!p.isDash) { p.vy += GRAVITY; if (p.vy > MAX_FALL) p.vy = MAX_FALL; }

  // 碰撞
  p.x += p.vx;
  const xr = { x: p.x, y: p.y, w: p.w, h: p.h };
  for (let r = 0; r < LH; r++) for (let c = 0; c < LW; c++) {
    if (map[r * LW + c] === 0) continue;
    const t = { x: c * TILE, y: r * TILE, w: TILE, h: TILE };
    if (overlap(xr, t)) {
      if (p.vx > 0) p.x = t.x - p.w; else if (p.vx < 0) p.x = t.x + t.w;
      if (p.isDash) { endDash(); p.dashReady = lR; spawnPart(p.x + p.w / 2, p.y + p.h / 2, 6, '#888'); }
      p.vx = 0;
    }
  }
  p.y += p.vy;
  const yr = { x: p.x, y: p.y, w: p.w, h: p.h };
  const wasGnd = p.grounded;
  p.grounded = false;
  for (let r = 0; r < LH; r++) for (let c = 0; c < LW; c++) {
    if (map[r * LW + c] === 0) continue;
    const t = { x: c * TILE, y: r * TILE, w: TILE, h: TILE };
    if (overlap(yr, t)) {
      if (p.vy > 0) { p.y = t.y - p.h; p.vy = 0; p.grounded = true; }
      else if (p.vy < 0) { p.y = t.y + t.h; p.vy = 0; }
    }
  }
  if ((p.grounded && !wasGnd) || (p.onWall !== 0 && wasWall === 0)) p.dashAir = false;
  if (p.grounded && !wasGnd && lR) p.lCon = true;
  // 落地：若当前处于跳跃动画，标记进入落地收尾阶段（播放尾段 3 帧）
  if (p.grounded && !wasGnd && (p.animKey === 'jump' || p.animKey === 'jumpShoot')) {
    p.landing = true;
  }
  // 兜底清理：落地收尾期间若角色又离地（如高速冲刺跳擦过地面后立即腾空），
  // 强制清除 landing，避免空中误播落地尾段（半空闪落地动画）
  if (!p.grounded && p.landing) {
    p.landing = false;
  }

  // 世界边界（无底部边界限制，角色可自由掉落）

  // 摄像机
  updateCamera();

  // 下蹲：按住 S 蹲下，松开站起（dash/跳跃期间不处理）
  if (sR && p.grounded && !p.isDash && !p.dashAir) {
    setCrouch(true, false);
  } else if (!sR && !p.forcedCrouch) {
    setCrouch(false, false);
  }

  // 强制蹲下：每帧检测能否站起，能则恢复
  if (p.forcedCrouch) {
    if (canStandUp()) {
      setPlayerBox(HITBOX.stand.w, HITBOX.stand.h);
      p.crouch = false;
      p.forcedCrouch = false;
    }
  }

  // 怪物
  // 挥砍逐帧命中判定（仅 Zero）：动画期间每帧判定，命中冷却 6 帧，同帧多目标合并一次停顿
  if (CHARS[curChar].melee && p.melee > 0) doMeleeHit(p.meleeCurStage);
  for (const en of enemies) { ai(en); enPhys(en); }

  // 玩家子弹 vs 怪物/墙
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx; b.life--; b.animT++;
    const br = { x: b.x - b.w / 2, y: b.y - b.h / 2, w: b.w, h: b.h };
    let hit = false;
    // 记录最靠子弹发射侧的接触表面 x（兜底为子弹前边缘）
    let hitSurfaceX = b.dir > 0 ? -Infinity : Infinity;
    let hitY = b.y;
    // 打瓦片：接触边 = 瓦片靠近子弹那一侧的表面
    for (let r = 0; r < LH; r++) for (let c = 0; c < LW; c++) {
      if (map[r * LW + c] === 0) continue;
      const tl = { x: c * TILE, y: r * TILE, w: TILE, h: TILE };
      if (overlap(br, tl)) {
        hit = true; spawnPart(b.x, b.y, b.power === 2 ? 8 : 3, b.color);
        const sx = b.dir > 0 ? tl.x : tl.x + tl.w;
        if (b.dir > 0) { if (sx > hitSurfaceX) hitSurfaceX = sx; }
        else           { if (sx < hitSurfaceX) hitSurfaceX = sx; }
      }
    }
    // 打敌人：接触边 = 敌人靠近子弹那一侧的表面
    for (let j = enemies.length - 1; j >= 0; j--) {
      const en = enemies[j];
      if (overlap(br, { x: en.x, y: en.y, w: en.w, h: en.h })) {
        hit = true; if (dmgEnemy(en, b.dmg)) enemies.splice(j, 1);
        const sx = b.dir > 0 ? en.x : en.x + en.w;
        if (b.dir > 0) { if (sx > hitSurfaceX) hitSurfaceX = sx; }
        else           { if (sx < hitSurfaceX) hitSurfaceX = sx; }
      }
    }
    // 命中特效：以接触表面为中线（一半在目标内、一半在目标外）
    if (hit) spawnHitEffect(hitSurfaceX, hitY, b.dir, b.type);  // 命中特效（不延迟移除）
    if (hit || b.life <= 0 || b.x < camera.x - 22 || b.x > camera.x + VW / VIEW_SCALE + 22) bullets.splice(i, 1);
  }

  // 敌人子弹 vs 玩家
  for (let i = eBullets.length - 1; i >= 0; i--) {
    const b = eBullets[i];
    b.x += b.vx; b.y += b.vy; b.life--;
    const br = { x: b.x - b.w / 2, y: b.y - b.h / 2, w: b.w, h: b.h };
    if (overlap(br, pr) && p.invT <= 0) { dmgPlayer(2); spawnPart(b.x, b.y, 4, '#f4f'); eBullets.splice(i, 1); continue; }
    let hw = false;
    for (let r = 0; r < LH; r++) for (let c = 0; c < LW; c++) {
      if (map[r * LW + c] === 0) continue;
      if (overlap(br, { x: c * TILE, y: r * TILE, w: TILE, h: TILE })) hw = true;
    }
    if (hw || b.life <= 0 || b.x < camera.x - 22 || b.x > camera.x + VW / VIEW_SCALE + 22 || b.y < -22 || b.y > VH / VIEW_SCALE + 22) eBullets.splice(i, 1);
  }

  // 玩家碰怪物
  if (p.invT <= 0) {
    for (const en of enemies) {
      if (overlap(pr, { x: en.x, y: en.y, w: en.w, h: en.h })) {
        dmgPlayer(ET[en.type].boss ? 3 : 1);
      }
    }
  }

  // 粒子
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i]; pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.04; pt.life--;
    if (pt.life <= 0) particles.splice(i, 1);
  }
  // 枪口发射特效（out）：播放一遍后移除
  for (let i = muzzleEffects.length - 1; i >= 0; i--) {
    const m = muzzleEffects[i];
    const entry = BULLET_SPRITES[`${m.key}-out`];
    const totalFrames = entry ? entry.frames.length : 0;
    const frameDur = entry ? Math.round(60 / entry.fps) : 6;
    m.animT++;
    if (totalFrames === 0 || m.animT >= totalFrames * frameDur) muzzleEffects.splice(i, 1);
  }
  // 命中特效（hit）：播放一遍后移除
  for (let i = hitEffects.length - 1; i >= 0; i--) {
    const h = hitEffects[i];
    const entry = BULLET_SPRITES[`${h.key}-hit`];
    const totalFrames = entry ? entry.frames.length : 0;
    const frameDur = entry ? Math.round(60 / entry.fps) : 6;
    h.animT += 2;  // 播放速度翻倍（帧切换速度 ×2）
    if (totalFrames === 0 || h.animT >= totalFrames * frameDur) hitEffects.splice(i, 1);
  }
  // Zero 近战受击特效：播放一遍后移除
  for (let i = meleeHitEffects.length - 1; i >= 0; i--) {
    const h = meleeHitEffects[i];
    const entry = BULLET_SPRITES['melee-hit'];
    const totalFrames = entry ? entry.frames.length : 0;
    const frameDur = entry ? Math.round(60 / entry.fps) : 6;
    h.animT += 2;  // 播放速度翻倍（帧切换速度 ×2）
    if (totalFrames === 0 || h.animT >= totalFrames * frameDur) meleeHitEffects.splice(i, 1);
  }
  // 残影寿命递减（新残影的生成在下方动画状态机更新之后）
  for (let i = afterimages.length - 1; i >= 0; i--) { afterimages[i].life--; if (afterimages[i].life <= 0) afterimages.splice(i, 1); }

  if (keys[' ']) { reset(); keys[' '] = false; }

  // 角色动画状态机
  const animKey = playerAnimKey(p, mx);
  // 兜底清理：一旦动画脱离跳跃/跳跃射击（如下蹲、站立等），残留的 landing 标志立即失效，
  // 避免「落地后立即下蹲→松开站起」时 landing 残留导致误入 airborne 分支闪 jump
  if (animKey !== 'jump' && animKey !== 'jumpShoot' && p.landing) {
    p.landing = false;
  }
  if (animKey !== p.animKey) {
    // 同帧数动画对切换时保留当前帧索引，保证逐帧对应，避免切换瞬间帧索引重置造成错帧闪现
    const KEEP_FRAME_PAIRS = [
      ['jump', 'jumpShoot'],
      ['running', 'runShoot'],
      ['dash', 'dashShoot'],
    ];
    let keepFrame = false;
    for (const [a, b] of KEEP_FRAME_PAIRS) {
      if ((p.animKey === a && animKey === b) || (p.animKey === b && animKey === a)) {
        keepFrame = true;
        break;
      }
    }
    const prevKey = p.animKey;
    p.animKey = animKey;
    p.animT = 0;
    if (!keepFrame) {
      // shoot 动画从第二帧(索引1)开始倒放；其余动画从第一帧(索引0)开始
      p.animF = (animKey === 'shoot') ? 1 : 0;
      // 从贴墙滑行(climb)松开方向键自由下落时，直接定格在跳跃的空中帧(索引3)，不从头播起跳段
      if (prevKey === 'climb' && (animKey === 'jump' || animKey === 'jumpShoot')) {
        p.animF = 3;
      }
    }
  }
  const animEntry = PLAYER_SPRITES[p.animKey];
  const nf = animEntry ? animEntry.frames.length : 0;
  const frameDur = animEntry ? Math.round(60 / animEntry.fps / 1.5) : 4;
  if (nf > 0) {
    p.animT++;
    // 冲刺/冲刺射击：播放到第二帧后定格；攀爬：播放到最后一帧后定格（滑行姿态）
    const holdLast = (animKey === 'dash' || animKey === 'dashShoot' || animKey === 'climb');
    // 跳跃/跳跃射击：三段式——先播前4帧(索引0~3)→空中定格在第4帧(索引3)→落地播尾段(索引4~6)后切回
    const isJump = (animKey === 'jump' || animKey === 'jumpShoot');
    // 站立射击：从第二帧(索引1)倒放到第一帧(索引0)后定格，不循环
    const isShoot = (animKey === 'shoot');
    if (holdLast && p.animF >= nf - 1) {
      // 定格在最后一帧
    } else if (isShoot && p.animF <= 0) {
      // 倒放到第一帧后定格
    } else if (isJump && !p.landing && p.animF >= 3) {
      // 空中定格在第4帧
    } else if (p.animT >= frameDur) {
      p.animT = 0;
      if (isShoot) {
        p.animF--;
      } else {
        p.animF++;
      }
      if (isJump && p.landing && p.animF >= nf) {
        // 落地尾段播完，切回站立
        p.animF = 0;
        p.landing = false;
      } else if (!isJump && !isShoot) {
        p.animF = p.animF % nf;
      }
    }
  }

  // 残影生成：冲刺/空中冲刺跳期间，每隔 3 帧记录一次当前精灵快照（用新模型资源）
  if ((p.isDash || p.dashAir) && p.animT % 3 === 0) {
    afterimages.push({ animKey: p.animKey, animF: p.animF, x: p.x, y: p.y, w: p.w, h: p.h, facing: p.facing, life: 12 });
  }

  // 射击动画持续计时：放在动画状态机之后递减，确保「本帧射击→本帧动画立即是射击形态」，
  // 避免 shootHold 在动画判定前归零造成 jump/jumpShoot、dash/dashShoot 间的一帧错位闪切
  if (p.shootHold > 0) p.shootHold--;
}

// ==================== 渲染 (所有世界坐标 - camera.x) ====================
function drawTile(x, y) {
  // 砖块内描边按 TILE 相对比例绘制，适配素材像素尺度（TILE=14）
  const b = Math.max(1, Math.round(TILE / 32));          // 基础描边宽度（素材像素下≈0.5→1）
  ctx.fillStyle = '#2a4a2a'; ctx.fillRect(x, y, TILE, TILE);
  ctx.fillStyle = '#3a5a3a'; ctx.fillRect(x + b, y + b, TILE - b * 2, TILE - b * 2);
  ctx.fillStyle = '#4a6a3a'; ctx.fillRect(x + b, y + b, TILE - b * 2, TILE - b * 2 - b);
  ctx.fillStyle = '#5a8a3a'; ctx.fillRect(x + b, y + b, TILE - b * 2, Math.max(1, Math.round(3 * TILE / 32)));
  ctx.strokeStyle = '#1a3a1a'; ctx.lineWidth = 1; ctx.strokeRect(x, y, TILE, TILE);
}

// 碰撞盒可视化：半透明显示所有实体物体的碰撞盒
function drawHitboxes() {
  // 地砖/地形碰撞盒（白色，只绘制可见范围）
  const invZ = 1 / camera.zoom;
  const startCol = Math.max(0, Math.floor(camera.x / TILE) - 1);
  const endCol = Math.min(LW, Math.ceil((camera.x + VW * invZ / VIEW_SCALE) / TILE) + 1);
  const startRow = Math.max(0, Math.floor(camera.y / TILE) - 1);
  const endRow = Math.min(LH, Math.ceil((camera.y + VH * invZ / VIEW_SCALE) / TILE) + 1);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
  ctx.lineWidth = 1;
  for (let r = startRow; r < endRow; r++) {
    for (let c = startCol; c < endCol; c++) {
      if (map[r * LW + c] === 0) continue;
      ctx.fillRect(c * TILE, r * TILE, TILE, TILE);
      ctx.strokeRect(c * TILE, r * TILE, TILE, TILE);
    }
  }

  // 玩家碰撞盒（青绿色）
  const p = player;
  ctx.fillStyle = 'rgba(0, 255, 200, 0.25)';
  ctx.strokeStyle = 'rgba(0, 255, 200, 0.8)';
  ctx.fillRect(p.x, p.y, p.w, p.h);
  ctx.strokeRect(p.x, p.y, p.w, p.h);

  // 敌人碰撞盒（红色）
  ctx.fillStyle = 'rgba(255, 60, 60, 0.25)';
  ctx.strokeStyle = 'rgba(255, 60, 60, 0.8)';
  for (const en of enemies) {
    ctx.fillRect(en.x, en.y, en.w, en.h);
    ctx.strokeRect(en.x, en.y, en.w, en.h);
  }

  // 子弹碰撞盒（黄色）
  ctx.fillStyle = 'rgba(255, 255, 0, 0.25)';
  ctx.strokeStyle = 'rgba(255, 255, 0, 0.8)';
  for (const b of bullets) {
    ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
    ctx.strokeRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
  }
  for (const b of eBullets) {
    ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
    ctx.strokeRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
  }
}

function drawX(cx, cy, f) {
  // 手绘小人（素材像素尺度）：原世界坐标 ÷2.286 后按素材像素重画
  const p = player;
  const lo = p.grounded && Math.abs(p.vx) > 0.2 ? Math.sin(p.animT * 0.8) * 1 : 0;
  ctx.fillStyle = '#24a'; ctx.fillRect(cx - 5, cy - 15, 11, 21);
  ctx.fillStyle = '#36c'; ctx.fillRect(cx - 4, cy - 14, 9, 9);
  ctx.fillStyle = '#24a'; ctx.fillRect(cx - 5, cy - 17, 10, 4);
  ctx.fillStyle = '#35b'; ctx.fillRect(cx - 4, cy - 16, 8, 2);
  ctx.fillStyle = '#c33'; ctx.fillRect(cx - 1, cy - 18, 3, 3);
  ctx.fillStyle = '#f55'; ctx.fillRect(cx - 1, cy - 18, 2, 2);
  ctx.fillStyle = '#fff';
  const ex = cx + f * 2; ctx.fillRect(ex - 1, cy - 14, 3, 2);
  ctx.fillStyle = '#111'; ctx.fillRect(ex + f * 1, cy - 13, 1, 1);
  ctx.fillStyle = '#35b'; const ax = cx + f * 6;
  ctx.fillRect(ax - 1, cy - 7, 4, 3);
  ctx.fillStyle = '#45c'; ctx.fillRect(ax + (f > 0 ? 2 : -2), cy - 6, 2, 1);
  ctx.fillStyle = '#ca3'; ctx.fillRect(cx - 5, cy + 4, 11, 2);
  ctx.fillStyle = '#138'; ctx.fillRect(cx - 4, cy + 6 + lo, 3, 7); ctx.fillRect(cx + 1, cy + 6 - lo, 3, 7);
  ctx.fillStyle = '#c33'; ctx.fillRect(cx - 4, cy + 12 + lo, 4, 2); ctx.fillRect(cx + 1, cy + 12 - lo, 4, 2);
}

// 用精灵绘制角色。所有动画统一按素材原尺寸 × SPRITE_SCALE 显示（不跟随碰撞盒缩放）。
// 水平对齐规则（均以「面朝右」为基准，面朝左时镜像）：
//  - 左对齐类：jump / jumpShoot / climb / dashShoot → 模型贴碰撞盒左侧，多余部分向面朝方向伸出
//  - runShoot「身体居中」：身体部分（=running 最大宽）居中于碰撞盒，枪向面朝方向伸出
//  - 其余（stand/shoot/running/dash/crouch）：模型整体水平居中
// 垂直对齐规则：
//  - 上下居中类：jump / jumpShoot / climb
//  - 其余：下对齐（脚底对齐碰撞盒底部）
function drawPlayerSprite(p, cx, cy) {
  const entry = PLAYER_SPRITES[p.animKey];
  if (!entry || !entry.loaded || entry.frames.length === 0) {
    drawX(cx, cy, p.facing);  // 回退到手绘小人
    return;
  }
  const fi = Math.min(p.animF, entry.frames.length - 1);
  const f = entry.frames[fi];

  const scale = SPRITE_SCALE;
  const dw = f.w * scale;
  const dh = f.h * scale;

  // ---- 水平对齐：计算「面朝右基准下」模型左边缘相对碰撞盒左(p.x)的偏移 offsetL ----
  const leftAlignAnims = { jump: 1, jumpShoot: 1, climb: 1, dashShoot: 1 };
  let offsetL;
  if (leftAlignAnims[p.animKey]) {
    offsetL = 0;  // 左对齐：模型左边缘贴碰撞盒左
  } else if (p.animKey === 'runShoot') {
    // 身体居中：身体部分（running 最大宽）居中，枪向面朝方向伸出
    const run = PLAYER_SPRITES.running;
    const bodyW = (run && run.maxW ? run.maxW : 34) * SPRITE_SCALE;
    offsetL = (p.w - bodyW) / 2;
  } else {
    offsetL = (p.w - dw) / 2;  // 居中
  }

  // ---- 垂直对齐 ----
  const vCenterAnims = { jump: 1, jumpShoot: 1, climb: 1 };
  let drawY;
  if (vCenterAnims[p.animKey]) {
    drawY = p.y + p.h / 2 - dh / 2;  // 上下居中
  } else {
    drawY = p.y + p.h - dh;          // 下对齐（脚底对齐）
  }

  // ---- 渲染朝向 rdir：climb 贴墙时面朝「朝外」方向（背对墙），其余用 facing ----
  // climb 素材默认面朝右、手在左（背对墙）；贴左墙(onWall=-1)时面朝右、手贴左墙
  const rdir = (p.animKey === 'climb') ? (-p.onWall) : p.facing;

  // ---- 模型水平位置：面朝右→左边缘=p.x+offsetL；面朝左→镜像到右侧 ----
  const modelLeft = (rdir > 0) ? (p.x + offsetL) : (p.x + p.w - offsetL - dw);

  // 素材默认面向右（rdir<0 才翻）
  const flip = rdir < 0;
  ctx.save();
  if (flip) {
    ctx.translate(modelLeft + dw / 2, drawY + dh / 2);
    ctx.scale(-1, 1);
    ctx.drawImage(entry.img, f.x, f.y, f.w, f.h, -dw / 2, -dh / 2, dw, dh);
  } else {
    ctx.drawImage(entry.img, f.x, f.y, f.w, f.h, modelLeft, drawY, dw, dh);
  }
  ctx.restore();
}

function drawPlayer() {
  const p = player;
  if (p.invT > 0 && Math.floor(p.invT / 3) % 2 === 0) return;
  const cx = Math.floor(p.x + p.w / 2);
  const cy = Math.floor(p.y + p.h / 2);
  ctx.save();
  for (const a of afterimages) {
    ctx.globalAlpha = (a.life / 12) * 0.35;
    const acx = Math.floor(a.x + a.w / 2);
    const acy = Math.floor(a.y + a.h / 2);
    drawPlayerSprite(a, acx, acy);  // 用新模型资源绘制残影快照
  }
  ctx.globalAlpha = 1; drawPlayerSprite(p, cx, cy);
  ctx.restore();
  if (p.isChg && p.chgT > P.CHG1) {
    const r = 10 + (p.chgT >= P.CHG2 ? 4 : 0);
    const al = 0.4 + Math.sin(Date.now() / 100) * 0.2;
    ctx.strokeStyle = p.chgT >= P.CHG2 ? `rgba(255,60,60,${al})` : `rgba(255,180,60,${al})`;
    ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy - 2, r, 0, Math.PI * 2); ctx.stroke(); ctx.lineWidth = 1;
  }
  // 近战挥砍可视化（Zero）
  if (p.melee > 0) {
    drawMeleeEffect(p, cx, cy);
  }
}

// 绘制近战挥砍刀光（用 blade.png，三段连击共用同一刀光，范围随段数放大）
// 不做挥砍转动，blade 资源本身已表现挥砍，仅随挥砍进度渐隐消失
function drawMeleeEffect(p, cx, cy) {
  if (!BLADE.loaded) {
    // 未加载时回退到扇形
    drawMeleeEffectFallback(p, cx, cy);
    return;
  }
  const stage = p.meleeCurStage > 0 ? p.meleeCurStage : 1;
  const idx = Math.min(stage - 1, MELEE_STAGES.length - 1);
  // 三段范围放大倍率（第 1/2/3 段）
  const stageMult = MELEE_STAGES[idx].range / MELEE_STAGES[0].range;
  // 挥砍进度：1 → 0（渐隐）
  const progress = p.melee / MELEE_ACTIVE;
  const alpha = progress;  // 线性渐隐

  const bw = BLADE.img.naturalWidth;
  const bh = BLADE.img.naturalHeight;
  // 逆时针旋转 90° 后：渲染宽 = 原高(bh)，渲染高 = 原宽(bw)
  const targetH = P.PH;            // 旋转后高度 = 角色高度
  const s = targetH / bw * stageMult; // 缩放系数（含段数放大）
  const dispW = bh * s;            // 旋转后宽度（刀光长度方向）

  // 刀光锚点：从角色中心向前方偏移 dispW/2，使刀光整体位于角色前方，不压住身体
  const anchorX = cx + p.facing * (dispW / 2);
  const anchorY = cy;

  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(anchorX, anchorY);
  if (p.facing > 0) {
    // 面朝右：刀光尖端指向右。blade 原「下方」指向怪物 → 逆时针旋转 90°
    ctx.rotate(-Math.PI / 2);
  } else {
    // 面朝左：刀光尖端指向左 = 面朝右的镜像
    ctx.rotate(Math.PI / 2);
  }
  // blade 绘制：原图中心对齐锚点，下方（尖端）在旋转后指向怪物方向
  ctx.drawImage(BLADE.img, -bw * s / 2, -bh * s / 2, bw * s, bh * s);
  ctx.restore();
  ctx.lineWidth = 1;
}

// blade 未加载时的回退扇形
function drawMeleeEffectFallback(p, cx, cy) {
  const stage = p.meleeCurStage > 0 ? p.meleeCurStage : 1;
  const idx = Math.min(stage - 1, MELEE_STAGES.length - 1);
  const range = MELEE_STAGES[idx].range;
  const arc = MELEE_STAGES[idx].arc;
  const progress = p.melee / MELEE_ACTIVE;
  const alpha = progress;
  const baseAng = p.facing > 0 ? 0 : Math.PI;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = 'rgba(120,220,255,0.25)';
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.arc(cx, cy, range, baseAng - arc / 2, baseAng + arc / 2, p.facing > 0 ? false : true);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
  ctx.lineWidth = 1;
}

// 绘制怪物身体（以 cx,cy 为视觉中心，不含血条）。c 为绘制上下文：
// 正常绘制传主画布 ctx；受击白色剪影时传离屏画布 hitCtx，复用本函数后整体涂白贴回。
function paintEnemyBody(en, t, cx, cy, c) {
  if (t.boss) {
    c.fillStyle = '#63a'; c.lineWidth = 2;
    for (let i = 0; i < 6; i++) {
      const a = [-0.7, -0.4, -0.15, 0.15, 0.4, 0.7][i];
      const lx = cx + (i < 3 ? -6 : 6), ly = cy - 3 + i * 2;
      c.beginPath(); c.moveTo(lx, ly);
      c.lineTo(lx + Math.cos(a) * 10 * (i < 3 ? -1 : 1), ly + Math.abs(Math.sin(a)) * 10);
      c.stroke();
      c.fillStyle = '#84c'; c.beginPath();
      c.arc(lx + Math.cos(a) * 10 * (i < 3 ? -1 : 1), ly + Math.abs(Math.sin(a)) * 10, 1, 0, Math.PI * 2); c.fill();
      c.fillStyle = '#63a';
    }
    c.fillStyle = '#84c'; c.beginPath(); c.ellipse(cx, cy, 10, 6, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#95d'; c.beginPath(); c.ellipse(cx, cy - 1, 7, 4, 0, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#73b'; c.beginPath(); c.arc(cx + en.facing * 6, cy - 3, 5, 0, Math.PI * 2); c.fill();
    const gl = 0.6 + Math.sin(Date.now() / 120) * 0.4;
    c.fillStyle = t.eye; c.beginPath(); c.arc(cx + en.facing * 8, cy - 4, 2, 0, Math.PI * 2); c.fill();
    c.fillStyle = `rgba(255,0,255,${gl})`; c.beginPath(); c.arc(cx + en.facing * 8, cy - 4, 1, 0, Math.PI * 2); c.fill();
    c.fillStyle = t.eye; c.beginPath(); c.arc(cx + en.facing * 6, cy - 6, 1, 0, Math.PI * 2); c.fill();
  } else if (en.type === 'bee') {
    c.fillStyle = '#fa0'; c.beginPath(); c.arc(cx, cy, 4, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#333'; c.fillRect(cx - 2, cy - 3, 4, 1); c.fillRect(cx - 2, cy + 1, 4, 1);
    const wf = Math.sin(Date.now() / 30) * 2;
    c.fillStyle = 'rgba(200,220,255,0.5)';
    c.beginPath(); c.ellipse(cx - 3, cy - 4 + wf, 4, 2, -0.3, 0, Math.PI * 2); c.fill();
    c.beginPath(); c.ellipse(cx + 3, cy - 4 - wf, 4, 2, 0.3, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#f44'; c.fillRect(cx - 2, cy - 2, 1, 1); c.fillRect(cx + 1, cy - 2, 1, 1);
    c.fillStyle = '#f60'; c.beginPath(); c.moveTo(cx, cy + 4); c.lineTo(cx - 1, cy + 7); c.lineTo(cx + 1, cy + 7); c.fill();
  } else if (t.amp) {
    c.fillStyle = t.col; c.beginPath(); c.arc(cx, cy, en.w / 2, 0, Math.PI * 2); c.fill();
    c.fillStyle = t.eye; c.beginPath(); c.arc(cx, cy, 3, 0, Math.PI * 2); c.fill();
    c.fillStyle = '#fff'; c.beginPath(); c.arc(cx - 1, cy - 1, 1, 0, Math.PI * 2); c.fill();
  } else {
    const f = en.facing;
    c.fillStyle = t.col; c.fillRect(cx - 4, cy - 6, 9, 12);
    c.fillStyle = '#373'; c.fillRect(cx - 3, cy - 8, 7, 4);
    c.fillStyle = t.eye; c.fillRect(cx + f * 1 - 1, cy - 7, 3, 2);
    c.fillStyle = '#262'; c.fillRect(cx - 3, cy + 6, 3, 4); c.fillRect(cx + 1, cy + 6, 3, 4);
    c.fillStyle = '#888'; c.fillRect(cx + f * 5 - 1, cy - 3, 3, 4);
  }
  c.lineWidth = 1;
}

function drawEnemy(en) {
  const t = ET[en.type];
  const cx = Math.floor(en.x + en.w / 2), cy = Math.floor(en.y + en.h / 2);
  const sx = en.x, sy = en.y;

  if (en.hurtT > 0) {
    // 受击白色剪影：离屏绘制怪物形状 → source-in 整体涂白 → 贴回原位（闪一瞬）
    hitCtx.clearRect(0, 0, HIT_CANVAS_SIZE, HIT_CANVAS_SIZE);
    paintEnemyBody(en, t, HIT_CANVAS_HALF, HIT_CANVAS_HALF, hitCtx);
    hitCtx.save();
    hitCtx.globalCompositeOperation = 'source-in';
    hitCtx.fillStyle = '#fff';
    hitCtx.fillRect(0, 0, HIT_CANVAS_SIZE, HIT_CANVAS_SIZE);
    hitCtx.restore();
    ctx.drawImage(hitCanvas, cx - HIT_CANVAS_HALF, cy - HIT_CANVAS_HALF);
  } else {
    paintEnemyBody(en, t, cx, cy, ctx);
  }

  // 血条
  if (en.hp < en.maxHp) {
    const bw = t.boss ? 40 : 12, bh = t.boss ? 3 : 2;
    const bx = sx + en.w / 2 - bw / 2, by = sy - (t.boss ? 5 : 3);
    ctx.fillStyle = '#222'; ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
    const rt = Math.max(0, en.hp / en.maxHp);
    ctx.fillStyle = rt > 0.5 ? '#4c4' : rt > 0.25 ? '#cc4' : '#c44';
    ctx.fillRect(bx, by, bw * rt, bh);
    if (t.boss) {
      ctx.fillStyle = '#fff'; ctx.font = '4px "Courier New"'; ctx.textAlign = 'center';
      ctx.fillText(`${t.name} ${en.hp}/${en.maxHp}`, sx + en.w / 2, by - 1);
    }
  }
}

// 绘制一个基于 strip+frames.json 的动画实体（子弹 flying / 特效 out / 特效 hit 共用）
// entry: BULLET_SPRITES 里的条目 { img, frames, fps }
// 按每帧真实宽高绘制，不统一缩放，避免高度不一致导致忽大忽小
function drawAnimEntry(entry, animT, dir, cx, cy, scale) {
  if (!entry || !entry.loaded || entry.frames.length === 0) return false;
  const frameDur = Math.round(60 / entry.fps);
  const fi = Math.floor(animT / frameDur) % entry.frames.length;
  const f = entry.frames[fi];
  const dw = f.w * scale, dh = f.h * scale;
  ctx.save();
  if (dir < 0) {
    ctx.translate(cx, cy);
    ctx.scale(-1, 1);
    ctx.drawImage(entry.img, f.x, f.y, f.w, f.h, -dw / 2, -dh / 2, dw, dh);
  } else {
    ctx.drawImage(entry.img, f.x, f.y, f.w, f.h, cx - dw / 2, cy - dh / 2, dw, dh);
  }
  ctx.restore();
  return true;
}

function drawBullets() {
  for (const b of bullets) {
    const bx = b.x, by = b.y;
    const entry = BULLET_SPRITES[`${b.type}-flying`];
    const scale = BULLET_TYPE[b.type] ? BULLET_TYPE[b.type].displayScale : 1.0;
    // 用真实帧宽高绘制 flying 循环动画；未加载时回退到纯色矩形
    if (!drawAnimEntry(entry, b.animT, b.dir, bx, by, scale)) {
      ctx.fillStyle = b.color;
      ctx.fillRect(bx - b.w / 2, by - b.h / 2, b.w, b.h);
      if (b.power > 0) { ctx.fillStyle = '#fff'; ctx.fillRect(bx - b.w / 4, by - b.h / 4, b.w / 2, b.h / 2); }
    }
  }
  for (const b of eBullets) {
    const bx = b.x, by = b.y;
    ctx.strokeStyle = '#f4f'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(bx, by, 2 + Math.sin(Date.now() / 60) * 0.2, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,68,255,0.5)'; ctx.beginPath(); ctx.arc(bx, by, 1, 0, Math.PI * 2); ctx.fill();
  }
  // 枪口发射特效（out）
  for (const m of muzzleEffects) {
    const entry = BULLET_SPRITES[`${m.key}-out`];
    const scale = BULLET_TYPE[m.key] ? BULLET_TYPE[m.key].displayScale : 1.0;
    drawAnimEntry(entry, m.animT, m.dir, m.x, m.y, scale);
  }
  // 命中特效（hit）
  for (const h of hitEffects) {
    const entry = BULLET_SPRITES[`${h.key}-hit`];
    const scale = BULLET_TYPE[h.key] ? BULLET_TYPE[h.key].displayScale : 1.0;
    drawAnimEntry(entry, h.animT, h.dir, h.x, h.y, scale);
  }
}

function drawParticles() {
  for (const pt of particles) {
    ctx.globalAlpha = pt.life / 30; ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size);
  }
  ctx.globalAlpha = 1;
}

function drawUI() {
  const hx = 10, hy = 10, hw = 200, hh = 14;
  ctx.fillStyle = '#222'; ctx.fillRect(hx - 1, hy - 1, hw + 2, hh + 2);
  ctx.fillStyle = '#400'; ctx.fillRect(hx, hy, hw, hh);
  const r = Math.max(0, player.hp / P.MAX_HP);
  ctx.fillStyle = r > 0.5 ? '#4c4' : r > 0.25 ? '#cc4' : '#c44';
  ctx.fillRect(hx, hy, hw * r, hh);
  ctx.fillStyle = '#fff'; ctx.font = '10px "Courier New"'; ctx.textAlign = 'center';
  ctx.fillText(`HP: ${player.hp}/${P.MAX_HP}`, hx + hw / 2, hy + 11);

  if (player.isChg) {
    const cy = hy + hh + 6;
    ctx.fillStyle = '#222'; ctx.fillRect(hx, cy, hw, 6);
    const cr = Math.min(1, player.chgT / P.CHG2);
    ctx.fillStyle = cr >= 1 ? '#f33' : cr >= 0.05 ? '#fa0' : '#ff0';
    ctx.fillRect(hx, cy, hw * cr, 6);
  }

  if (player.hp <= 0) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, VW, VH);
    ctx.fillStyle = '#f33'; ctx.font = 'bold 36px "Courier New"'; ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', VW / 2, VH / 2 - 10);
    ctx.fillStyle = '#fff'; ctx.font = '16px "Courier New"';
    ctx.fillText('按空格键重新开始', VW / 2, VH / 2 + 30);
  }

  document.getElementById('db-char').textContent = curChar;
  document.getElementById('db-hp').textContent = `${player.hp}/${P.MAX_HP}`;
  document.getElementById('db-charge').textContent = player.isChg ? `${Math.round(player.chgT / P.CHG2 * 100)}%` : '0%';
  document.getElementById('db-enemies').textContent = `${enemies.length}`;
  document.getElementById('db-pos').textContent = `${Math.round(player.x / MAP_W * 100)}%`;
  updateCharUI();
}

// 更新角色切换按钮高亮（当前角色高亮显示）
function updateCharUI() {
  const bx = document.getElementById('btn-char-x');
  const bz = document.getElementById('btn-char-zero');
  if (bx && bz) {
    bx.style.outline = curChar === 'X' ? '2px solid #ffcc00' : 'none';
    bz.style.outline = curChar === 'Zero' ? '2px solid #ffcc00' : 'none';
  }
}

function render() {
  ctx.clearRect(0, 0, VW, VH);
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, '#0a1a2a'); g.addColorStop(0.5, '#0d2a1a'); g.addColorStop(1, '#0a1a0a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);

  // 瀑布背景线（跟随摄像机，在世界变换之前绘制避免缩放影响）
  // 使用屏幕像素的 tile 尺寸（TILE * VIEW_SCALE），保持与改造前一致的视觉间距
  const screenTile = TILE * VIEW_SCALE;
  ctx.strokeStyle = 'rgba(100,180,255,0.04)'; ctx.lineWidth = 2;
  for (let x = 0; x < VW + screenTile; x += screenTile) {
    const wx = x + Math.floor(camera.x * VIEW_SCALE / screenTile) * screenTile;
    for (let y = 0; y < VH; y += 16) {
      const o = (Date.now() / 50 + wx * 3) % 16;
      ctx.beginPath(); ctx.moveTo(x, y + o); ctx.lineTo(x, y + o + 6); ctx.stroke();
    }
  }

  // === 统一世界变换: 所有世界坐标渲染都在此变换下 ===
  // 世界坐标为「素材原始像素」，通过 VIEW_SCALE 放大到屏幕像素（视觉与改造前一致）。
  // 注意: 先 translate 再 scale，避免 translate 量被 scale 放大。
  const z = camera.zoom;
  const invZ = 1 / z;
  ctx.save();
  ctx.translate(-camera.x * z * VIEW_SCALE, -camera.y * z * VIEW_SCALE);
  ctx.scale(z * VIEW_SCALE, z * VIEW_SCALE);

  // 只渲染屏幕可见范围的砖块
  const startCol = Math.max(0, Math.floor(camera.x / TILE) - 1);
  const endCol = Math.min(LW, Math.ceil((camera.x + VW * invZ / VIEW_SCALE) / TILE) + 1);
  const startRow = Math.max(0, Math.floor(camera.y / TILE) - 1);
  const endRow = Math.min(LH, Math.ceil((camera.y + VH * invZ / VIEW_SCALE) / TILE) + 1);
  for (let r = startRow; r < endRow; r++) {
    for (let c = startCol; c < endCol; c++) {
      if (map[r * LW + c] === 1) drawTile(c * TILE, r * TILE);
    }
  }

  drawParticles();
  drawBullets();
  for (const en of enemies) {
    if (en.x + en.w > camera.x - 22 * invZ && en.x < camera.x + VW * invZ / VIEW_SCALE + 22 * invZ) {
      drawEnemy(en);
    }
  }
  // Zero 近战受击特效（画在怪物上层，避免被遮挡）
  for (const h of meleeHitEffects) {
    drawAnimEntry(BULLET_SPRITES['melee-hit'], h.animT, h.dir, h.x, h.y, 0.75);
  }
  if (!editMode) drawPlayer();

  // 碰撞盒可视化（P 键开关）
  if (showHitboxes) drawHitboxes();

  // 编辑器 overlay 也在世界变换下
  if (editMode) drawEditorOverlay();

  ctx.restore();
  // === 世界变换结束, 以下为屏幕坐标 ===

  drawUI();
}

// ==================== 编辑模式 ====================
let editMode = false;
let editTool = 'tile'; // 'tile' | 'enemy' | 'player'
let mouseWorldX = 0, mouseWorldY = 0;

const editorToolbar = document.getElementById('editor-toolbar');
const editorPanel = document.getElementById('editor-panel');
const btnTile = document.getElementById('btn-tile');
const btnEnemy = document.getElementById('btn-enemy');
const btnPlayer = document.getElementById('btn-player');
const enemyTypeSelect = document.getElementById('enemy-type');
const tileSizeSelect = document.getElementById('tile-size');
const jsonOutput = document.getElementById('json-output');

function setEditMode(on) {
  if (on) {
    editMode = true;
    editorToolbar.classList.add('active');
    updateToolUI();
    // 进入编辑模式时清空子弹和粒子残留，重置所有怪物到初始状态
    bullets = []; eBullets = []; particles = []; afterimages = []; muzzleEffects = []; hitEffects = []; meleeHitEffects = []; hitstop = 0;
    const data = levelData || DEFAULT_LEVEL;
    enemies = spawnEnemiesFromData(data);
  } else {
    // 退出编辑模式前验证出生点合法性
    const ps = getPlayerSpawn();
    if (!isSpawnValid(ps.x, ps.y)) {
      alert('初始点位置错误！出生点与地形或敌人重合，请移动到一个空位后再退出。');
      return;
    }
    editMode = false;
    editorToolbar.classList.remove('active');
    editorPanel.classList.remove('active');
    // 退出编辑模式时重置摄像机，定位到玩家居中位置
    camera.zoom = 1.0;
    const mapH = LH * TILE;
    camera.x = Math.max(0, Math.min(MAP_W - VW / VIEW_SCALE, player.x + player.w / 2 - VW / VIEW_SCALE / 2));
    camera.y = Math.max(0, Math.min(mapH - VH / VIEW_SCALE, player.y + player.h / 2 - VH / VIEW_SCALE / 2));
    isPanning = false;
    isDraggingPlayer = false;
    canvas.style.cursor = '';
  }
}

function updateToolUI() {
  btnTile.classList.toggle('sel', editTool === 'tile');
  btnEnemy.classList.toggle('sel', editTool === 'enemy');
  btnPlayer.classList.toggle('sel', editTool === 'player');
  enemyTypeSelect.style.display = editTool === 'enemy' ? 'inline' : 'none';
  tileSizeSelect.style.display = editTool === 'tile' ? 'inline' : 'none';
  // player 模式显示 grab 光标
  if (editMode) {
    canvas.style.cursor = (editTool === 'player') ? 'grab' : '';
  }
}

btnTile.addEventListener('click', () => { editTool = 'tile'; updateToolUI(); });
btnEnemy.addEventListener('click', () => { editTool = 'enemy'; updateToolUI(); });
btnPlayer.addEventListener('click', () => { editTool = 'player'; updateToolUI(); });
document.getElementById('btn-exit-edit').addEventListener('click', () => setEditMode(false));

// 长按放置/删除
let mouseDown = 0; // 0=无, 1=左键, 2=右键
let isDraggingPlayer = false; // player 模式下是否正在拖拽出生点
let dragPlayerOffX = 0, dragPlayerOffY = 0; // 拖拽时鼠标相对于出生点左上角的偏移

// 检测玩家出生点矩形是否与地形或敌人碰撞
function isSpawnValid(sx, sy) {
  const rect = { x: sx, y: sy, w: P.PW, h: P.PH };
  // 检查是否与任何 tile 碰撞
  for (let r = 0; r < LH; r++) {
    for (let c = 0; c < LW; c++) {
      if (map[r * LW + c] === 0) continue;
      if (overlap(rect, { x: c * TILE, y: r * TILE, w: TILE, h: TILE })) return false;
    }
  }
  // 检查是否与任何敌人碰撞
  for (const en of enemies) {
    if (overlap(rect, { x: en.x, y: en.y, w: en.w, h: en.h })) return false;
  }
  // 检查是否超出地图边界
  if (sx < 0 || sy < 0 || sx + P.PW > MAP_W) return false;
  return true;
}

function doEditAction() {
  const col = Math.floor(mouseWorldX / TILE);
  const row = Math.floor(mouseWorldY / TILE);

  if (editTool === 'tile') {
    if (mouseDown === 1) {
      // 大砖：以鼠标格为中心，向左上偏移 1 格放置 2×2；小砖：单格
      const big = (tileSizeSelect.value === 'big');
      const baseCol = big ? col - 1 : col;
      const baseRow = big ? row - 1 : row;
      const span = big ? 2 : 1;
      for (let dr = 0; dr < span; dr++) {
        for (let dc = 0; dc < span; dc++) {
          const cc = baseCol + dc, rr = baseRow + dr;
          if (cc < 0 || cc >= LW || rr < 0 || rr >= LH) expandMap(cc, rr);
          map[rr * LW + cc] = 1;
        }
      }
      updateMapBounds(); // 放置后重算砖块包围盒
    } else if (mouseDown === 2) {
      if (col >= 0 && col < LW && row >= 0 && row < LH) {
        map[row * LW + col] = 0;
        updateMapBounds(); // 删除后重算砖块包围盒
      }
    }
  } else if (editTool === 'enemy') {
    if (mouseDown === 1) {
      const etype = enemyTypeSelect.value;
      const tw = ET[etype].w, th = ET[etype].h;
      // 自由放置：怪物中心对齐鼠标位置，不再按格子对齐
      const ex = mouseWorldX - tw / 2;
      const ey = mouseWorldY - th / 2;
      const nr = { x: ex, y: ey, w: tw, h: th };
      // 冲突检测：不与已有怪物重叠，不与地形重叠
      const clashEnemy = enemies.some(en => overlap(nr, { x: en.x, y: en.y, w: en.w, h: en.h }));
      let clashTile = false;
      for (let r = 0; r < LH; r++) for (let c = 0; c < LW; c++) {
        if (map[r * LW + c] === 0) continue;
        if (overlap(nr, { x: c * TILE, y: r * TILE, w: TILE, h: TILE })) { clashTile = true; break; }
      }
      if (!clashEnemy && !clashTile) {
        enemies.push(mkEnemy(etype, ex, ey));
      }
    } else if (mouseDown === 2) {
      const wx = mouseWorldX, wy = mouseWorldY;
      let closest = null, closestDist = Infinity;
      for (let i = enemies.length - 1; i >= 0; i--) {
        const en = enemies[i];
        const cx = en.x + en.w / 2, cy = en.y + en.h / 2;
        const d = Math.sqrt((wx - cx) ** 2 + (wy - cy) ** 2);
        if (d < 18 && d < closestDist) { closest = i; closestDist = d; }
      }
      if (closest !== null) enemies.splice(closest, 1);
    }
  }
  // player 模式不再通过 doEditAction 处理，而是通过拖拽处理
}

canvas.addEventListener('mousedown', e => {
  if (!editMode) return;
  if (e.button === 0) {
    e.preventDefault();
    if (editTool === 'player') {
      // player 模式：检查是否点击在出生点矩形内
      const ps = getPlayerSpawn();
      if (mouseWorldX >= ps.x && mouseWorldX <= ps.x + P.PW &&
          mouseWorldY >= ps.y && mouseWorldY <= ps.y + P.PH) {
        isDraggingPlayer = true;
        dragPlayerOffX = mouseWorldX - ps.x;
        dragPlayerOffY = mouseWorldY - ps.y;
        canvas.style.cursor = 'grabbing';
      }
    } else {
      mouseDown = 1;
      doEditAction();
    }
  } else if (e.button === 2) {
    e.preventDefault();
    mouseDown = 2;
    doEditAction();
  }
});

window.addEventListener('mouseup', e => {
  if (e.button === 0) {
    if (isDraggingPlayer) {
      isDraggingPlayer = false;
      canvas.style.cursor = (editTool === 'player') ? 'grab' : '';
    }
    mouseDown = 0;
  } else if (e.button === 2) {
    mouseDown = 0;
  }
});

// mousemove 中持续执行编辑操作
canvas.addEventListener('mousemove', e => {
  if (!editMode) return;
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;
  mouseWorldX = sx / (camera.zoom * VIEW_SCALE) + camera.x;
  mouseWorldY = sy / (camera.zoom * VIEW_SCALE) + camera.y;
  if (isDraggingPlayer) {
    // 拖拽出生点：自由像素级位置
    const data = levelData || DEFAULT_LEVEL;
    if (!data.playerSpawn) data.playerSpawn = {};
    data.playerSpawn.x = Math.round(mouseWorldX - dragPlayerOffX);
    data.playerSpawn.y = Math.round(mouseWorldY - dragPlayerOffY);
  } else if (mouseDown !== 0) {
    doEditAction();
  }
});

canvas.addEventListener('contextmenu', e => { if (editMode) e.preventDefault(); });

// 编辑模式下按住中键(滚轮按下)拖动平移摄像机
let isPanning = false, panStartX = 0, panStartY = 0, panCamStartX = 0, panCamStartY = 0;

canvas.addEventListener('mousedown', e => {
  if (!editMode) return;
  if (e.button === 1) { // 中键按下
    e.preventDefault();
    isPanning = true;
    panStartX = e.clientX;
    panStartY = e.clientY;
    panCamStartX = camera.x;
    panCamStartY = camera.y;
    canvas.style.cursor = 'grabbing';
  }
});

window.addEventListener('mousemove', e => {
  if (!isPanning) return;
  const dx = (panStartX - e.clientX) / (camera.zoom * VIEW_SCALE);
  const dy = (panStartY - e.clientY) / (camera.zoom * VIEW_SCALE);
  camera.x = panCamStartX + dx;
  camera.y = panCamStartY + dy;
  // 不再限制范围，允许自由平移查看地图外区域
});

window.addEventListener('mouseup', e => {
  if (e.button === 1 && isPanning) {
    isPanning = false;
    canvas.style.cursor = '';
  }
});

// 防止中键点击默认行为(自动滚动)
canvas.addEventListener('auxclick', e => { if (e.button === 1) e.preventDefault(); });

// 编辑模式下滚轮缩放
canvas.addEventListener('wheel', e => {
  if (!editMode) return;
  e.preventDefault();
  const zoomSpeed = 0.1;
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / (camera.zoom * VIEW_SCALE) + camera.x;
  const my = (e.clientY - rect.top) / (camera.zoom * VIEW_SCALE) + camera.y;
  const oldZoom = camera.zoom;
  if (e.deltaY < 0) {
    camera.zoom = Math.min(4.0, camera.zoom + zoomSpeed);
  } else {
    camera.zoom = Math.max(0.2, camera.zoom - zoomSpeed);
  }
  // 以鼠标位置为中心缩放
  camera.x = mx - (e.clientX - rect.left) / (camera.zoom * VIEW_SCALE);
  camera.y = my - (e.clientY - rect.top) / (camera.zoom * VIEW_SCALE);
}, { passive: false });

// 导出 JSON
function exportLevelJSON() {
  // 从当前 map 生成 tile 规则 (简化: 直接导出逐格地图)
  // 先用 tile rules 压缩格式，但为了通用性，直接导出完整 tile 数组
  const tiles = [];
  for (let r = 0; r < LH; r++) {
    for (let c = 0; c < LW; c++) {
      if (map[r * LW + c] === 1) {
        tiles.push({ col: c, row: r, value: 1 });
      }
    }
  }
  // 压缩: 合并连续的行列
  const compressed = compressTiles(tiles);
  const enemyData = enemies.map(en => {
    const e = { type: en.type, x: Math.round(en.x), y: Math.round(en.y) };
    if (en.type === 'soldier') {
      e.patrolMin = en.pMin;
      e.patrolMax = en.pMax;
    }
    return e;
  });
  const ps = getPlayerSpawn();
  return JSON.stringify({
    width: LW, height: LH, tileSize: TILE,
    playerSpawn: { x: ps.x, y: ps.y },
    tiles: compressed,
    enemies: enemyData
  }, null, 2);
}

function compressTiles(rawTiles) {
  // 简单的按行分组压缩: 同一行连续列合并成 [colStart, colEnd]
  const byRow = {};
  for (const t of rawTiles) {
    if (!byRow[t.row]) byRow[t.row] = [];
    byRow[t.row].push(t.col);
  }
  const result = [];
  for (const [row, cols] of Object.entries(byRow)) {
    cols.sort((a, b) => a - b);
    let start = cols[0], end = cols[0];
    for (let i = 1; i < cols.length; i++) {
      if (cols[i] === end + 1) { end = cols[i]; }
      else {
        result.push({ col: start === end ? start : [start, end], row: parseInt(row), value: 1 });
        start = cols[i]; end = cols[i];
      }
    }
    result.push({ col: start === end ? start : [start, end], row: parseInt(row), value: 1 });
  }
  return result;
}

function showExportPanel() {
  jsonOutput.value = exportLevelJSON();
  editorPanel.classList.add('active');
}

// Ctrl+S 导出
window.addEventListener('keydown', e => {
  if (e.key === 'e' || e.key === 'E') {
    // 只在没有聚焦输入框时触发
    if (document.activeElement === document.body || document.activeElement === canvas) {
      setEditMode(!editMode);
    }
  }
  if (e.ctrlKey && e.key === 's') {
    e.preventDefault();
    showExportPanel();
  }
});

document.getElementById('btn-copy').addEventListener('click', () => {
  jsonOutput.select();
  document.execCommand('copy');
  alert('JSON 已复制到剪贴板!');
});

document.getElementById('btn-export-download').addEventListener('click', () => {
  const blob = new Blob([jsonOutput.value], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'level.json'; a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('btn-close-panel').addEventListener('click', () => {
  editorPanel.classList.remove('active');
});

// ==================== 编辑器渲染覆盖 ====================
function drawEditorOverlay() {
  if (!editMode) return;
  const col = Math.floor(mouseWorldX / TILE);
  const row = Math.floor(mouseWorldY / TILE);

  const sx = col * TILE;
  const sy = row * TILE;

  // 编辑器视觉常量（线宽/字体/虚线）画在世界变换下会被 VIEW_SCALE 放大，
  // 这里统一除以 VIEW_SCALE 保持与改造前一致的屏幕观感。
  const LW1 = 1 / VIEW_SCALE, LW2 = 2 / VIEW_SCALE, LW3 = 3 / VIEW_SCALE;
  const FONT = `${Math.round(10 / VIEW_SCALE)}px "Courier New"`;

  if (editTool === 'tile') {
    const big = (tileSizeSelect.value === 'big');
    const px = big ? (col - 1) * TILE : col * TILE;
    const py = big ? (row - 1) * TILE : row * TILE;
    const pw = big ? TILE_BIG : TILE;
    const ph = big ? TILE_BIG : TILE;
    ctx.strokeStyle = 'rgba(255,255,0,0.7)';
    ctx.lineWidth = LW2;
    ctx.strokeRect(px, py, pw, ph);
    ctx.fillStyle = 'rgba(255,255,0,0.15)';
    ctx.fillRect(px, py, pw, ph);
    ctx.lineWidth = LW1;
  } else if (editTool === 'enemy') {
    const etype = enemyTypeSelect.value;
    const t = ET[etype];
    // 自由放置预览：怪物中心对齐鼠标，不再按格子对齐
    const ex = mouseWorldX - t.w / 2;
    const ey = mouseWorldY - t.h / 2;
    const cx = ex + t.w / 2;
    const cy = ey + t.h / 2;
    ctx.strokeStyle = 'rgba(255,100,100,0.7)';
    ctx.lineWidth = LW2;
    ctx.strokeRect(ex, ey, t.w, t.h);
    ctx.fillStyle = 'rgba(255,100,100,0.15)';
    ctx.fillRect(ex, ey, t.w, t.h);
    ctx.fillStyle = '#fff';
    ctx.font = FONT;
    ctx.textAlign = 'center';
    ctx.fillText(t.name, cx, cy - t.h / 2 - 2);
    ctx.lineWidth = LW1;
  } else if (editTool === 'player') {
    // 鼠标悬停显示玩家实际大小预览（非拖拽中）
    if (!isDraggingPlayer) {
      const px = mouseWorldX - P.PW / 2;
      const py = mouseWorldY - P.PH / 2;
      ctx.strokeStyle = 'rgba(100,255,255,0.5)';
      ctx.lineWidth = LW2;
      ctx.setLineDash([4 / VIEW_SCALE, 4 / VIEW_SCALE]);
      ctx.strokeRect(px, py, P.PW, P.PH);
      ctx.setLineDash([]);
      ctx.lineWidth = LW1;
    }
  }

  // 始终绘制当前玩家出生点标记（任何编辑模式下都显示）
  const ps = getPlayerSpawn();
  const valid = isSpawnValid(ps.x, ps.y);
  const psa = 0.5 + Math.sin(Date.now() / 500) * 0.3;

  if (valid) {
    // 合法：青色
    ctx.strokeStyle = `rgba(100,255,255,${psa})`;
    ctx.fillStyle = `rgba(100,255,255,0.2)`;
  } else {
    // 不合法：红色闪烁
    ctx.strokeStyle = `rgba(255,60,60,${0.7 + psa * 0.3})`;
    ctx.fillStyle = `rgba(255,60,60,0.25)`;
  }
  ctx.lineWidth = LW3;
  ctx.strokeRect(ps.x, ps.y, P.PW, P.PH);
  ctx.fillRect(ps.x, ps.y, P.PW, P.PH);

  // 标签
  ctx.fillStyle = valid ? '#0ff' : '#f44';
  ctx.font = FONT;
  ctx.textAlign = 'center';
  ctx.fillText(valid ? 'SPAWN' : 'INVALID!', ps.x + P.PW / 2, ps.y - 3);
  ctx.lineWidth = LW1;
}

// ==================== 角色切换按钮 ====================
document.getElementById('btn-char-x').addEventListener('click', () => switchCharacter('X'));
document.getElementById('btn-char-zero').addEventListener('click', () => switchCharacter('Zero'));

function loop() { update(); render(); requestAnimationFrame(loop); }

reset(); loop();
</script>
