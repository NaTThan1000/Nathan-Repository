<script>
// ==================== 常量 ====================
const VW = 800, VH = 500;  // 视口大小
const GRAVITY = 0.55, MAX_FALL = 12, TILE = 32;

const P = {
  PW: 28, PH: 80,
  SPEED: 4.0, JUMP: -12.0,
  WALL_SLIDE: 1.5, WALL_JUMP_X: 5.5, WALL_JUMP_Y: -10.0,
  DASH_MULT: 1.5, DASH_DIST: 128,
  CHG1: 6, CHG2: 60,
  BULLET: 14.0,
  INV: 30, WALL_LOCK: 6,
  MAX_HP: 28,
};
const DMG = { 0: 1, 1: 3, 2: 6 };

// ==================== 子弹 Sprite 资源 ====================
// 子弹类型 → 状态 → 资源。每种子弹有 flying(循环)/hit(瞬时)/out(枪口瞬时) 三个状态。
// 显示缩放：以资源真实尺寸为基准，映射到游戏里的显示尺寸（displayScale）。
// 帧数据来自 {type}-{state}_frames.json 的 frames[]，加载时按 strip 排版规则重算为 strip 图里的源裁剪坐标。
const BULLET_TYPE = {
  small:  { power: 0, baseW: 18, baseH: 12, displayScale: 1.0 },
  middle: { power: 1, baseW: 54, baseH: 36, displayScale: 1.6 },
  big:    { power: 2, baseW: 90, baseH: 60, displayScale: 2.0 },
};
const BULLET_SPRITES = {};  // key: `${type}-${state}` -> { img, frames, fps, loaded }

// 资源配置表：子弹类型 → 状态列表
const BULLET_STATES = {
  small:  { states: ['flying', 'hit'],             type: 'small-bullet' },
  middle: { states: ['flying', 'hit', 'out'],      type: 'middle-bullet' },
  big:    { states: ['flying', 'hit', 'out'],      type: 'big-bullet' },
};

// 加载所有子弹的 strip 图 + frames.json
function loadBulletSprites() {
  for (const key of Object.keys(BULLET_STATES)) {
    const { type, states } = BULLET_STATES[key];
    for (const state of states) {
      const base = `Assets/Assets-Clean/${type}-${state}`;
      const entry = { img: new Image(), frames: [], fps: 10, loaded: false };
      BULLET_SPRITES[`${key}-${state}`] = entry;
      // 加载帧数据
      fetch(`${base}_frames.json`)
        .then(r => r.json())
        .then(data => {
          // _frames.json 里的 frames[] 坐标是相对原图(clean.png)的绝对位置，
          // 但实际渲染用的是 strip.png（等宽条带），需要按 strip 排版规则重算每帧在 strip 里的源裁剪坐标。
          // strip 规则(与 sprite-build.js 一致)：等宽 fw=max(w)，条带高 fh=max(h)，每帧水平/垂直居中。
          const rawFrames = data.frames || [];
          if (rawFrames.length > 0) {
            const fw = Math.max(...rawFrames.map(f => f.w));
            const fh = Math.max(...rawFrames.map(f => f.h));
            entry.frames = rawFrames.map((f, i) => ({
              x: i * fw + Math.round((fw - f.w) / 2),  // strip 里水平居中后的 x
              y: Math.round((fh - f.h) / 2),           // strip 里垂直居中后的 y
              w: f.w,
              h: f.h,
            }));
          }
          entry.fps = data.fps || 10;
        })
        .catch(() => { entry.frames = []; });
      entry.img.onload = () => { entry.loaded = true; };
      entry.img.src = `${base}_strip.png`;
    }
  }
}
loadBulletSprites();

// ==================== 角色 Sprite 资源 ====================
// 角色动画状态 → 资源文件前缀（与 idle-*.json/png 对应）
// 缩放基准：以站立帧高度为基准，等比放大到碰撞盒高度 PH(80px)。
const PLAYER_ANIMS = {
  stand:     'idle-stand',
  shoot:     'idle-shoot',
  running:   'idle-running',
  jump:      'idle-jump',
  dash:      'idle-dash',
  climb:     'idle-climb',
  runShoot:  'idle-running&shoot',
  jumpShoot: 'idle-jump&shoot',
  dashShoot: 'idle-dash&shoot',
};
const PLAYER_SPRITES = {};  // key -> { img, frames, fps, loaded }
const PLAYER_TARGET_H = 80; // 站立时精灵显示高度（对齐碰撞盒 PH）

function loadPlayerSprites() {
  for (const key of Object.keys(PLAYER_ANIMS)) {
    const base = `Assets/Assets-Clean/${PLAYER_ANIMS[key]}`;
    const entry = { img: new Image(), frames: [], fps: 10, loaded: false };
    PLAYER_SPRITES[key] = entry;
    fetch(`${base}_frames.json`)
      .then(r => r.json())
      .then(data => {
        const rawFrames = data.frames || [];
        if (rawFrames.length > 0) {
          const fw = Math.max(...rawFrames.map(f => f.w));
          const fh = Math.max(...rawFrames.map(f => f.h));
          entry.frames = rawFrames.map((f, i) => ({
            x: i * fw + Math.round((fw - f.w) / 2),
            y: Math.round((fh - f.h) / 2),
            w: f.w,
            h: f.h,
          }));
        }
        entry.fps = data.fps || 10;
      })
      .catch(() => { entry.frames = []; });
    entry.img.onload = () => { entry.loaded = true; };
    entry.img.src = `${base}_strip.png`;
  }
}
loadPlayerSprites();

// 根据玩家状态返回当前应播放的动画 key
function playerAnimKey(p, mx) {
  const shooting = p.isChg || p.shootHold > 0;  // 正在射击（按住 j 蓄力中）或射击结束后的 0.5 秒缓冲
  const moving = mx !== 0;
  const airborne = !p.grounded || p.landing;   // 落地收尾期间仍算空中，继续播 jump/jumpShoot 尾段

  if (p.isDash || p.dashAir) {
    return shooting ? 'dashShoot' : 'dash';
  }
  if (airborne) {
    if (p.onWall !== 0) return 'climb';  // 贴墙滑落过渡
    return shooting ? 'jumpShoot' : 'jump';
  }
  if (moving) return shooting ? 'runShoot' : 'running';
  return shooting ? 'shoot' : 'stand';
}

// 根据 power 取子弹类型 key
function bulletKeyByPower(power) {
  if (power === 2) return 'big';
  if (power === 1) return 'middle';
  return 'small';
}

const canvas = document.getElementById('game');
canvas.width = VW; canvas.height = VH;
const ctx = canvas.getContext('2d');

const keys = {};
window.addEventListener('keydown', e => { keys[e.key] = true; if (e.key === ' ') e.preventDefault(); });
window.addEventListener('keyup', e => { keys[e.key] = false; });

// ==================== 摄像机 ====================
const camera = { x: 0, y: 0, targetX: 0, zoom: 1.0 };

function updateCamera() {
  // 玩家在画面中央
  const targetCX = player.x + player.w / 2;
  const targetCY = player.y + player.h / 2;
  let idealX = targetCX - VW / 2;
  let idealY = targetCY - VH / 2;
  // 边界限制：玩家走到地图边缘时镜头停止
  const mapH = LH * TILE;
  idealX = Math.max(0, Math.min(MAP_W - VW, idealX));
  idealY = Math.max(0, Math.min(mapH - VH, idealY));
  // 平滑跟随
  camera.x += (idealX - camera.x) * 0.12;
  camera.y += (idealY - camera.y) * 0.12;
}

// ==================== 大关卡 (100×16 Tile = 3200×512) ====================
let LW = 100, LH = 16;
let MAP_W = LW * TILE; // 3200px

// 动态扩展地图：当在边界外放置砖块时自动扩大
function expandMap(newCol, newRow) {
  const oldLW = LW, oldLH = LH;
  let newLW = LW, newLH = LH;
  let colOffset = 0, rowOffset = 0;

  if (newCol < 0) { colOffset = -newCol; newLW += colOffset; }
  if (newCol >= LW) { newLW = newCol + 1; }
  if (newRow < 0) { rowOffset = -newRow; newLH += rowOffset; }
  if (newRow >= LH) { newLH = newRow + 1; }

  if (newLW === LW && newLH === LH) return; // 无需扩展

  const newMap = new Array(newLH * newLW).fill(0);
  for (let r = 0; r < oldLH; r++) {
    for (let c = 0; c < oldLW; c++) {
      newMap[(r + rowOffset) * newLW + (c + colOffset)] = map[r * oldLW + c];
    }
  }
  map = newMap;
  LW = newLW;
  LH = newLH;
  MAP_W = LW * TILE;

  // 同步偏移所有敌人的坐标
  const px = colOffset * TILE;
  const py = rowOffset * TILE;
  for (const en of enemies) {
    en.x += px;
    en.y += py;
    en.baseY += py;
    if (en.pMin != null) { en.pMin += px; en.pMax += px; }
  }

  // 调整摄像机，保持画面内容不跳动
  camera.x += px;
  camera.y += py;
}

// 关卡分 4 个区域:
//   Tile 0~24:  起始峡谷 (平坦+阶梯)
//   Tile 25~49: 瀑布攀爬区 (多层平台+竖井)
//   Tile 50~74: 中层丛林 (开阔平台)
//   Tile 75~99: Boss巢穴 (封闭房间)

// ---- 关卡数据加载器 ----
// 支持两种方式:
//   1. 外部 level.json (fetch 加载，需要本地服务器)
//   2. 内联默认数据 (fallback)

let levelData = null;

function parseTileRule(rule, mapArray, lw, lh) {
  const val = rule.value ?? 1;
  const colStart = Array.isArray(rule.col) ? rule.col[0] : rule.col;
  const colEnd   = Array.isArray(rule.col) ? rule.col[1] : rule.col;
  const rowStart = Array.isArray(rule.row) ? rule.row[0] : rule.row;
  const rowEnd   = Array.isArray(rule.row) ? rule.row[1] : rule.row;

  for (let r = rowStart; r <= rowEnd; r++) {
    for (let c = colStart; c <= colEnd; c++) {
      if (r >= 0 && r < lh && c >= 0 && c < lw) {
        mapArray[r * lw + c] = val;
      }
    }
  }
}

function buildMapFromData(data) {
  const m = new Array(data.height * data.width).fill(0);
  for (const rule of data.tiles) {
    if (rule.comment) continue; // 跳过注释行
    parseTileRule(rule, m, data.width, data.height);
  }
  return m;
}

function spawnEnemiesFromData(data) {
  const result = [];
  for (const entry of data.enemies) {
    if (entry.comment) continue;
    result.push(mkEnemy(entry.type, entry.x, entry.y, entry.patrolMin, entry.patrolMax));
  }
  return result;
}

function loadLevel(jsonData) {
  levelData = jsonData;
  // 重建 map
  LW = jsonData.width;
  LH = jsonData.height;
  map = buildMapFromData(jsonData);
  MAP_W = LW * TILE;
  // 重建敌人
  enemies = spawnEnemiesFromData(jsonData);
  // 读取玩家出生点
  if (jsonData.playerSpawn) {
    player.x = jsonData.playerSpawn.x;
    player.y = jsonData.playerSpawn.y;
  }
}

// 默认内联关卡数据 (与 level.json 同步)

let map = buildMapFromData(DEFAULT_LEVEL);

// 尝试从外部 JSON 加载 (需要本地服务器)
fetch('level.json')
  .then(r => r.json())
  .then(data => {
    loadLevel(data);
    console.log('关卡已从 level.json 加载');
  })
  .catch(() => {
    console.log('使用内联默认关卡 (将 level.json 放到同级目录并通过本地服务器访问即可加载)');

function tile(x, y) {
  const c = Math.floor(x / TILE), r = Math.floor(y / TILE);
  if (c < 0 || c >= LW || r < 0 || r >= LH) return 1;
  return map[r * LW + c];
}

function overlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

// ==================== 全局列表 ====================
let bullets = [], eBullets = [], particles = [], afterimages = [], enemies = [];
let muzzleEffects = [];   // 枪口发射特效（out 动画，瞬时）
let hitEffects = [];      // 命中特效（hit 动画，瞬时，不延迟子弹移除）

function spawnBullet(x, y, dir, power) {
  // 普通子弹 3x (18×12)；蓄力 = 普通×3 (54×36)；满蓄力 = 普通×5 (90×60)
  const baseW = 18, baseH = 12; // 普通子弹碰撞体积
  const key = bulletKeyByPower(power);
  bullets.push({
    x, y: y + P.PH / 2 - 4, vx: P.BULLET * dir, vy: 0,
    dir,                                     // 面朝方向（用于 sprite 镜像）
    w: power === 2 ? baseW * 5 : power === 1 ? baseW * 3 : baseW,
    h: power === 2 ? baseH * 5 : power === 1 ? baseH * 3 : baseH,
    power, dmg: DMG[power], life: 120,
    color: power === 2 ? '#ff4444' : power === 1 ? '#ffaa00' : '#ffff00',
    animT: 0,                                 // sprite 动画计时器
    type: key,                                // 子弹类型（用于取 flying sprite）
  });
  // 枪口发射特效（out 动画）：锚定在发射点，播放一遍后消失，不跟随子弹
  // small-bullet 无 out 状态，跳过
  spawnMuzzle(x, y + P.PH / 2 - 4, dir, key);
}

// 枪口发射特效（out 动画），独立于子弹本体
function spawnMuzzle(x, y, dir, key) {
  const entry = BULLET_SPRITES[`${key}-out`];
  if (!entry || entry.frames.length === 0) return;  // small 无 out
  muzzleEffects.push({ x, y, dir, key, animT: 0 });
}

// 命中特效（hit 动画），独立的瞬时粒子，不延迟子弹移除
function spawnHitEffect(x, y, dir, key) {
  const entry = BULLET_SPRITES[`${key}-hit`];
  if (!entry || entry.frames.length === 0) return;
  hitEffects.push({ x, y, dir, key, animT: 0 });
}
function spawnEBullet(x, y, vx, vy) {
  eBullets.push({ x, y, vx, vy, w: 6, h: 6, life: 90 });
}
function spawnPart(x, y, n, col) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y, vx: (Math.random() - 0.5) * 4, vy: (Math.random() - 0.5) * 4 - 2,
      life: 15 + Math.random() * 15, color: col, size: 1 + Math.random() * 3,
    });
  }
}

// ==================== 怪物 ====================
const ET = {
  soldier: { name: '丛林兵', w: 28, h: 40, hp: 10, spd: 1.5, col: '#44aa44', eye: '#ffcc00', boss: false },
  bee:     { name: '机械蜂', w: 22, h: 22, hp: 6,  spd: 1.8, col: '#ffaa00', eye: '#ff4444', boss: false, amp: 24, fspd: 0.04 },
  floater: { name: '浮游炮', w: 24, h: 24, hp: 8,  spd: 2.0, col: '#aa44ff', eye: '#ff4444', boss: false, amp: 30, fspd: 0.03 },
  boss:    { name: 'Web Spider', w: 56, h: 56, hp: 80, spd: 2.5, col: '#8844cc', eye: '#ff00ff', boss: true },
};

function mkEnemy(type, x, y, pMin, pMax) {
  const t = ET[type];
  return {
    type, x, y, w: t.w, h: t.h, vx: 0, vy: 0, hp: t.hp, maxHp: t.hp,
    facing: 1, grounded: false,
    pMin: pMin ?? x - 80, pMax: pMax ?? x + 80,
    hurtT: 0, baseY: y, fp: Math.random() * Math.PI * 2,
    bossAtk: 0, bossJump: false, bossWeb: 0,
  };
}

function spawnAll() {
  enemies = [];
  // 优先用 levelData (如果已加载外部 JSON)，否则用 DEFAULT_LEVEL
  const data = levelData || DEFAULT_LEVEL;
  enemies = spawnEnemiesFromData(data);
}

// ==================== 怪物 AI ====================
function ai(en) {
  const t = ET[en.type];
  const dx = player.x - en.x, dy = player.y - en.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (en.hurtT > 0) en.hurtT--;

  if (!t.boss) {
    const inRange = dist < 250;
    if (en.type === 'bee' || t.amp) {
      en.fp += (t.fspd || 0.04);
      en.y = en.baseY + Math.sin(en.fp) * (t.amp || 24);
      if (inRange) {
        en.x += (dx > 0 ? 1 : -1) * t.spd;
        en.facing = dx > 0 ? 1 : -1;
      }
    } else {
      if (inRange && dist < 160) {
        en.facing = dx > 0 ? 1 : -1;
        en.vx = en.facing * t.spd * 1.3;
      } else {
        en.vx = en.facing * t.spd;
        if (en.x <= en.pMin) { en.facing = 1; en.vx = t.spd; }
        if (en.x >= en.pMax) { en.facing = -1; en.vx = -t.spd; }
      }
    }
  }

  // Boss
  if (t.boss) {
    const phase2 = en.hp < en.maxHp * 0.5;
    en.bossAtk++;

    if (en.bossJump) {
      en.vy += GRAVITY;
      en.y += en.vy;
      const br = { x: en.x, y: en.y + en.vy, w: en.w, h: en.h };
      for (let r = 0; r < LH; r++) for (let c = 0; c < LW; c++) {
        if (map[r * LW + c] === 0) continue;
        if (overlap(br, { x: c * TILE, y: r * TILE, w: TILE, h: TILE }) && en.vy > 0) {
          en.y = r * TILE - en.h; en.vy = 0; en.bossJump = false; en.grounded = true;
          spawnPart(en.x + en.w / 2, en.y + en.h, 12, '#cc44ff');
        }
      }
      if (en.y > VH + 200) { en.y = 120; en.vy = 0; en.bossJump = false; }
    } else {
      en.facing = dx > 0 ? 1 : -1;
      const spd = phase2 ? t.spd * 1.4 : t.spd;
      en.vx = en.facing * spd;
      en.x += en.vx;

      const interval = phase2 ? 100 : 160;
      if (en.bossAtk >= interval && en.grounded) {
        en.bossAtk = 0;
        en.bossJump = true;
        en.vy = phase2 ? -15 : -12;
        en.grounded = false;
        en.vx = en.facing * spd * 2;
        en.x += en.vx;
        spawnPart(en.x + en.w / 2, en.y + en.h, 8, '#cc44ff');
      }
    }

    en.bossWeb++;
    if (en.bossWeb >= (phase2 ? 30 : 50)) {
      en.bossWeb = 0;
      const ex = en.x + en.w / 2, ey = en.y + en.h / 2;
      const adx = player.x + player.w / 2 - ex, ady = player.y + player.h / 2 - ey;
      const ad = Math.sqrt(adx * adx + ady * ady) || 1;
      spawnEBullet(ex, ey, (adx / ad) * 3.5, (ady / ad) * 3.5);
    }
  }

  en.x = Math.max(0, Math.min(MAP_W - en.w, en.x));
}

// ==================== 怪物物理 ====================
function enPhys(en) {
  const t = ET[en.type];
  if (en.type === 'bee' || t.amp) return;
  if (!t.boss || !en.bossJump) { en.vy += GRAVITY; if (en.vy > MAX_FALL) en.vy = MAX_FALL; }

  en.x += en.vx;
  const xr = { x: en.x, y: en.y, w: en.w, h: en.h };
  for (let r = 0; r < LH; r++) for (let c = 0; c < LW; c++) {
    if (map[r * LW + c] === 0) continue;
    const tl = { x: c * TILE, y: r * TILE, w: TILE, h: TILE };
    if (overlap(xr, tl)) {
      if (en.vx > 0) en.x = tl.x - en.w; else if (en.vx < 0) en.x = tl.x + tl.w;
      en.vx = 0;
    }
  }
  en.y += en.vy;
  const yr = { x: en.x, y: en.y, w: en.w, h: en.h };
  en.grounded = false;
  for (let r = 0; r < LH; r++) for (let c = 0; c < LW; c++) {
    if (map[r * LW + c] === 0) continue;
    const tl = { x: c * TILE, y: r * TILE, w: TILE, h: TILE };
    if (overlap(yr, tl)) {
      if (en.vy > 0) { en.y = tl.y - en.h; en.vy = 0; en.grounded = true; }
      else if (en.vy < 0) { en.y = tl.y + tl.h; en.vy = 0; }
    }
  }
}

// ==================== 伤害 ====================
function dmgEnemy(en, d) {
  en.hp -= d; en.hurtT = 8;
  spawnPart(en.x + en.w / 2, en.y + en.h / 2, d * 2, '#fff');
  if (en.hp <= 0) {
    spawnPart(en.x + en.w / 2, en.y + en.h / 2, ET[en.type].boss ? 40 : 20, ET[en.type].col);
    return true;
  }
  return false;
}
function dmgPlayer(d) {
  if (player.invT > 0) return;
  player.hp -= d; player.invT = P.INV;
  spawnPart(player.x + player.w / 2, player.y + player.h / 2, 8, '#f44');
  if (player.hp <= 0) player.hp = 0;
}

// ==================== 玩家 ====================
function getPlayerSpawn() {
  const data = levelData || DEFAULT_LEVEL;
  if (data.playerSpawn) return { x: data.playerSpawn.x, y: data.playerSpawn.y };
  return { x: 60, y: 200 };
}

const spawn = getPlayerSpawn();
const player = {
  x: spawn.x, y: spawn.y, vx: 0, vy: 0, w: P.PW, h: P.PH,
  facing: 1, grounded: false, onWall: 0, wallSlide: false,
  isDash: false, dashT: 0, dashDir: 0, dashReady: false, dashAir: false,
  chgT: 0, isChg: false, shootHold: 0, wjLock: 0,
  kCon: false, lCon: false, invT: 0, hp: P.MAX_HP, landing: false,
  animF: 0, animT: 0, animKey: '',
};

function reset() {
  const spawn = getPlayerSpawn();
  Object.assign(player, {
    x: spawn.x, y: spawn.y, vx: 0, vy: 0, facing: 1, grounded: false, onWall: 0, wallSlide: false,
    isDash: false, dashT: 0, dashDir: 0, dashReady: false, dashAir: false,
    chgT: 0, isChg: false, shootHold: 0, wjLock: 0, kCon: false, lCon: false, invT: 0, hp: P.MAX_HP, landing: false,
    animF: 0, animT: 0, animKey: '',
  });
  bullets = []; eBullets = []; particles = []; afterimages = []; muzzleEffects = []; hitEffects = [];
  camera.x = 0;
  spawnAll();
}

function wallCheck(rect) {
  let l = false, r = false;
  const m = 8;
  const cl = { x: rect.x - 1, y: rect.y + m, w: 2, h: rect.h - m * 2 };
  const cr = { x: rect.x + rect.w - 1, y: rect.y + m, w: 2, h: rect.h - m * 2 };
  for (let rr = 0; rr < LH; rr++) for (let cc = 0; cc < LW; cc++) {
    if (map[rr * LW + cc] === 0) continue;
    const t = { x: cc * TILE, y: rr * TILE, w: TILE, h: TILE };
    if (overlap(cl, t)) l = true;
    if (overlap(cr, t)) r = true;
  }
  return { l, r };
}

// ==================== 主循环 ====================
function update() {
  // 编辑模式下暂停游戏逻辑
  if (editMode) return;

  const p = player;
  if (p.invT > 0) p.invT--;
  if (p.wjLock > 0) p.wjLock--;
  if (p.shootHold > 0) p.shootHold--;

  const jD = keys['j'] || keys['J'];
  const kR = keys['k'] || keys['K'];
  const lR = keys['l'] || keys['L'];
  if (!kR) p.kCon = false;
  const kD = kR && !p.kCon;
  if (!lR) p.lCon = false;
  const lD = lR && !p.lCon;
  let mx = 0;
  if (keys['a'] || keys['A']) mx = -1;
  if (keys['d'] || keys['D']) mx += 1;
  if ((keys['a'] || keys['A']) && (keys['d'] || keys['D'])) mx = 0;

  // 墙面
  const pr = { x: p.x, y: p.y, w: p.w, h: p.h };
  const ws = wallCheck(pr);
  const wasWall = p.onWall;
  p.onWall = 0; p.wallSlide = false;
  if (!p.grounded) {
    if (ws.l) p.onWall = -1; if (ws.r) p.onWall = 1;
    if (p.onWall !== 0 && p.vy > 0) {
      const press = (p.onWall === -1 && mx === -1) || (p.onWall === 1 && mx === 1);
      if (press) { p.vy = Math.min(p.vy, P.WALL_SLIDE); p.wallSlide = true; }
    }
  }

  // 射击蓄力
  if (jD) {
    if (!p.isChg) {
      p.isChg = true; p.chgT = 0;
      let sd = p.facing; if (p.wallSlide) sd = -p.onWall;
      spawnBullet(p.x + p.w / 2, p.y, sd, 0);
    } else {
      p.chgT++;
      if (p.chgT >= P.CHG2 && p.chgT === P.CHG2) spawnPart(p.x + p.w / 2, p.y + p.h / 2, 3, '#f44');
    }
  } else {
    if (p.isChg) {
      let pw = 0;
      if (p.chgT >= P.CHG2) pw = 2;
      else if (p.chgT > P.CHG1) pw = 1;
      if (pw > 0) {
        let sd = p.facing; if (p.wallSlide) sd = -p.onWall;
        spawnBullet(p.x + p.w / 2, p.y, sd, pw);
      }
      p.isChg = false; p.chgT = 0;
      p.shootHold = 15;  // 射击结束后保留 shoot 动画 0.25 秒（60fps × 0.25s）
    }
  }

  // Dash 1
  if (p.isDash) {
    p.dashT--;
    p.vx = p.dashDir * P.SPEED * P.DASH_MULT;
    let cancel = false;
    if (p.dashT <= 0) cancel = true;
    const hFwd = (p.dashDir === 1 && mx === 1) || (p.dashDir === -1 && mx === -1);
    if (!lR && !hFwd) cancel = true;
    if (mx !== 0 && mx !== p.dashDir) cancel = true;
    if (cancel) { p.isDash = false; p.vx = 0; p.dashReady = !!lR; }
    if (kD) {
      p.vy = P.JUMP; p.grounded = false;
      p.vx = mx !== 0 ? mx * P.SPEED * P.DASH_MULT : 0;
      p.isDash = false; p.dashReady = false; p.dashAir = true; p.kCon = true;
      spawnPart(p.x + p.w / 2, p.y + p.h, 5, '#aaf');
    }
  }
  // Dash 2
  if (p.dashReady) {
    if (!lR) p.dashReady = false;
    if (kR && p.grounded && !p.kCon) {
      p.vy = P.JUMP; p.grounded = false;
      if (mx !== 0) p.vx = mx * P.SPEED * P.DASH_MULT;
      p.dashReady = false; p.dashAir = true; p.kCon = true;
      spawnPart(p.x + p.w / 2, p.y + p.h, 5, '#aaf');
    }
  }
  // 移动
  if (!p.isDash && !p.dashAir) {
    if (p.wjLock > 0) { p.vx = -p.onWall * P.WALL_JUMP_X; }
    else { if (mx !== 0) { p.facing = mx; p.vx = mx * P.SPEED; } else p.vx = 0; }
  }
  // Dash
  if (lD && p.grounded && !p.isDash && !p.dashReady) {
    p.isDash = true; p.dashDir = p.facing; p.lCon = true;
    const ds = P.SPEED * P.DASH_MULT;
    p.dashT = Math.floor(P.DASH_DIST / ds);
    p.vx = p.dashDir * ds;
    spawnPart(p.x + p.w / 2, p.y + p.h / 2, 8, '#aaf');
  }
  // 跳跃
  if (kD) {
    if (p.grounded && !p.isDash && !p.dashReady) {
      p.vy = P.JUMP; p.grounded = false; p.kCon = true;
      if (lR) { if (mx !== 0) p.vx = mx * P.SPEED * P.DASH_MULT; p.dashReady = false; p.dashAir = true; spawnPart(p.x + p.w / 2, p.y + p.h, 5, '#aaf'); }
      else spawnPart(p.x + p.w / 2, p.y + p.h, 5, '#fff');
    }
    if (p.onWall !== 0 && !p.grounded) {
      p.vy = P.WALL_JUMP_Y; p.facing = -p.onWall;
      p.wjLock = P.WALL_LOCK; p.kCon = true;
      if (lR) { p.vx = -p.onWall * P.WALL_JUMP_X * P.DASH_MULT; p.dashAir = true; spawnPart(p.x + p.w / 2, p.y + p.h / 2, 6, '#aaf'); }
      else { p.vx = -p.onWall * P.WALL_JUMP_X; spawnPart(p.x + p.w / 2, p.y + p.h / 2, 6, '#8cf'); }
    }
  }
  // Dash air
  if (p.dashAir && !p.grounded && !p.onWall && !p.isDash && p.wjLock <= 0) {
    p.vx = mx !== 0 ? mx * P.SPEED * P.DASH_MULT : 0;
  }
  // 重力
  if (!p.isDash) { p.vy += GRAVITY; if (p.vy > MAX_FALL) p.vy = MAX_FALL; }

  // 碰撞
  p.x += p.vx;
  const xr = { x: p.x, y: p.y, w: p.w, h: p.h };
  for (let r = 0; r < LH; r++) for (let c = 0; c < LW; c++) {
    if (map[r * LW + c] === 0) continue;
    const t = { x: c * TILE, y: r * TILE, w: TILE, h: TILE };
    if (overlap(xr, t)) {
      if (p.vx > 0) p.x = t.x - p.w; else if (p.vx < 0) p.x = t.x + t.w;
      if (p.isDash) { p.isDash = false; p.dashReady = lR; spawnPart(p.x + p.w / 2, p.y + p.h / 2, 6, '#888'); }
      p.vx = 0;
    }
  }
  p.y += p.vy;
  const yr = { x: p.x, y: p.y, w: p.w, h: p.h };
  const wasGnd = p.grounded;
  p.grounded = false;
  for (let r = 0; r < LH; r++) for (let c = 0; c < LW; c++) {
    if (map[r * LW + c] === 0) continue;
    const t = { x: c * TILE, y: r * TILE, w: TILE, h: TILE };
    if (overlap(yr, t)) {
      if (p.vy > 0) { p.y = t.y - p.h; p.vy = 0; p.grounded = true; }
      else if (p.vy < 0) { p.y = t.y + t.h; p.vy = 0; }
    }
  }
  if ((p.grounded && !wasGnd) || (p.onWall !== 0 && wasWall === 0)) p.dashAir = false;
  if (p.grounded && !wasGnd && lR) p.lCon = true;
  // 落地：若当前处于跳跃动画，标记进入落地收尾阶段（播放尾段 3 帧）
  if (p.grounded && !wasGnd && (p.animKey === 'jump' || p.animKey === 'jumpShoot')) {
    p.landing = true;
  }

  // 世界边界（无底部边界限制，角色可自由掉落）

  // 摄像机
  updateCamera();

  // 怪物
  for (const en of enemies) { ai(en); enPhys(en); }

  // 玩家子弹 vs 怪物/墙
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx; b.life--; b.animT++;
    const br = { x: b.x - b.w / 2, y: b.y - b.h / 2, w: b.w, h: b.h };
    let hit = false;
    // 记录最靠子弹发射侧的接触表面 x（兜底为子弹前边缘）
    let hitSurfaceX = b.dir > 0 ? -Infinity : Infinity;
    let hitY = b.y;
    // 打瓦片：接触边 = 瓦片靠近子弹那一侧的表面
    for (let r = 0; r < LH; r++) for (let c = 0; c < LW; c++) {
      if (map[r * LW + c] === 0) continue;
      const tl = { x: c * TILE, y: r * TILE, w: TILE, h: TILE };
      if (overlap(br, tl)) {
        hit = true; spawnPart(b.x, b.y, b.power === 2 ? 8 : 3, b.color);
        const sx = b.dir > 0 ? tl.x : tl.x + tl.w;
        if (b.dir > 0) { if (sx > hitSurfaceX) hitSurfaceX = sx; }
        else           { if (sx < hitSurfaceX) hitSurfaceX = sx; }
      }
    }
    // 打敌人：接触边 = 敌人靠近子弹那一侧的表面
    for (let j = enemies.length - 1; j >= 0; j--) {
      const en = enemies[j];
      if (overlap(br, { x: en.x, y: en.y, w: en.w, h: en.h })) {
        hit = true; if (dmgEnemy(en, b.dmg)) enemies.splice(j, 1);
        const sx = b.dir > 0 ? en.x : en.x + en.w;
        if (b.dir > 0) { if (sx > hitSurfaceX) hitSurfaceX = sx; }
        else           { if (sx < hitSurfaceX) hitSurfaceX = sx; }
      }
    }
    // 命中特效：以接触表面为中线（一半在目标内、一半在目标外）
    if (hit) spawnHitEffect(hitSurfaceX, hitY, b.dir, b.type);  // 命中特效（不延迟移除）
    if (hit || b.life <= 0 || b.x < camera.x - 50 || b.x > camera.x + VW + 50) bullets.splice(i, 1);
  }

  // 敌人子弹 vs 玩家
  for (let i = eBullets.length - 1; i >= 0; i--) {
    const b = eBullets[i];
    b.x += b.vx; b.y += b.vy; b.life--;
    const br = { x: b.x - b.w / 2, y: b.y - b.h / 2, w: b.w, h: b.h };
    if (overlap(br, pr) && p.invT <= 0) { dmgPlayer(2); spawnPart(b.x, b.y, 4, '#f4f'); eBullets.splice(i, 1); continue; }
    let hw = false;
    for (let r = 0; r < LH; r++) for (let c = 0; c < LW; c++) {
      if (map[r * LW + c] === 0) continue;
      if (overlap(br, { x: c * TILE, y: r * TILE, w: TILE, h: TILE })) hw = true;
    }
    if (hw || b.life <= 0 || b.x < camera.x - 50 || b.x > camera.x + VW + 50 || b.y < -50 || b.y > VH + 50) eBullets.splice(i, 1);
  }

  // 玩家碰怪物
  if (p.invT <= 0) {
    for (const en of enemies) {
      if (overlap(pr, { x: en.x, y: en.y, w: en.w, h: en.h })) {
        dmgPlayer(ET[en.type].boss ? 3 : 1);
      }
    }
  }

  // 粒子
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i]; pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.1; pt.life--;
    if (pt.life <= 0) particles.splice(i, 1);
  }
  // 枪口发射特效（out）：播放一遍后移除
  for (let i = muzzleEffects.length - 1; i >= 0; i--) {
    const m = muzzleEffects[i];
    const entry = BULLET_SPRITES[`${m.key}-out`];
    const totalFrames = entry ? entry.frames.length : 0;
    const frameDur = entry ? Math.round(60 / entry.fps) : 6;
    m.animT++;
    if (totalFrames === 0 || m.animT >= totalFrames * frameDur) muzzleEffects.splice(i, 1);
  }
  // 命中特效（hit）：播放一遍后移除
  for (let i = hitEffects.length - 1; i >= 0; i--) {
    const h = hitEffects[i];
    const entry = BULLET_SPRITES[`${h.key}-hit`];
    const totalFrames = entry ? entry.frames.length : 0;
    const frameDur = entry ? Math.round(60 / entry.fps) : 6;
    h.animT++;
    if (totalFrames === 0 || h.animT >= totalFrames * frameDur) hitEffects.splice(i, 1);
  }
  // 残影
  for (let i = afterimages.length - 1; i >= 0; i--) { afterimages[i].life--; if (afterimages[i].life <= 0) afterimages.splice(i, 1); }
  if ((p.isDash || p.dashAir) && p.animT % 3 === 0) afterimages.push({ x: Math.floor(p.x + p.w / 2), y: Math.floor(p.y + p.h / 2), facing: p.facing, life: 12 });

  if (keys[' ']) { reset(); keys[' '] = false; }

  // 角色动画状态机
  const animKey = playerAnimKey(p, mx);
  if (animKey !== p.animKey) {
    // 同帧数动画对（jump/jumpShoot、running/runShoot）切换时保留当前帧索引，保证逐帧对应
    const KEEP_FRAME_PAIRS = [['jump', 'jumpShoot'], ['running', 'runShoot']];
    let keepFrame = false;
    for (const [a, b] of KEEP_FRAME_PAIRS) {
      if ((p.animKey === a && animKey === b) || (p.animKey === b && animKey === a)) {
        keepFrame = true;
        break;
      }
    }
    p.animKey = animKey;
    p.animT = 0;
    if (!keepFrame) p.animF = 0;
  }
  const animEntry = PLAYER_SPRITES[p.animKey];
  const nf = animEntry ? animEntry.frames.length : 0;
  const frameDur = animEntry ? Math.round(60 / animEntry.fps / 1.5) : 4;
  if (nf > 0) {
    p.animT++;
    // 冲刺/冲刺射击：播放到第二帧后定格；攀爬：播放到最后一帧后定格
    const holdLast = (animKey === 'dash' || animKey === 'dashShoot' || animKey === 'climb');
    // 跳跃/跳跃射击：三段式——先播前4帧(索引0~3)→空中定格在第4帧(索引3)→落地播尾段(索引4~6)后切回
    const isJump = (animKey === 'jump' || animKey === 'jumpShoot');
    if (holdLast && p.animF >= nf - 1) {
      // 定格在最后一帧
    } else if (isJump && !p.landing && p.animF >= 3) {
      // 空中定格在第4帧
    } else if (p.animT >= frameDur) {
      p.animT = 0;
      p.animF++;
      if (isJump && p.landing && p.animF >= nf) {
        // 落地尾段播完，切回站立
        p.animF = 0;
        p.landing = false;
      } else if (!isJump) {
        p.animF = p.animF % nf;
      }
    }
  }
}

// ==================== 渲染 (所有世界坐标 - camera.x) ====================
function drawTile(x, y) {
  ctx.fillStyle = '#2a4a2a'; ctx.fillRect(x, y, TILE, TILE);
  ctx.fillStyle = '#3a5a3a'; ctx.fillRect(x + 1, y + 1, TILE - 2, TILE - 2);
  ctx.fillStyle = '#4a6a3a'; ctx.fillRect(x + 2, y + 2, TILE - 4, TILE - 2);
  ctx.fillStyle = '#5a8a3a'; ctx.fillRect(x + 2, y + 2, TILE - 4, 3);
  ctx.strokeStyle = '#1a3a1a'; ctx.lineWidth = 1; ctx.strokeRect(x, y, TILE, TILE);
}

function drawX(cx, cy, f) {
  const p = player;
  const lo = p.grounded && Math.abs(p.vx) > 0.5 ? Math.sin(p.animT * 0.8) * 2 : 0;
  ctx.fillStyle = '#24a'; ctx.fillRect(cx - 12, cy - 34, 24, 48);
  ctx.fillStyle = '#36c'; ctx.fillRect(cx - 10, cy - 32, 20, 20);
  ctx.fillStyle = '#24a'; ctx.fillRect(cx - 11, cy - 38, 22, 8);
  ctx.fillStyle = '#35b'; ctx.fillRect(cx - 9, cy - 36, 18, 4);
  ctx.fillStyle = '#c33'; ctx.fillRect(cx - 3, cy - 42, 6, 6);
  ctx.fillStyle = '#f55'; ctx.fillRect(cx - 2, cy - 41, 4, 4);
  ctx.fillStyle = '#fff';
  const ex = cx + f * 5; ctx.fillRect(ex - 3, cy - 31, 6, 5);
  ctx.fillStyle = '#111'; ctx.fillRect(ex + f * 1, cy - 29, 3, 3);
  ctx.fillStyle = '#35b'; const ax = cx + f * 13;
  ctx.fillRect(ax - 3, cy - 16, 8, 6);
  ctx.fillStyle = '#45c'; ctx.fillRect(ax + (f > 0 ? 5 : -4), cy - 14, 4, 3);
  ctx.fillStyle = '#ca3'; ctx.fillRect(cx - 12, cy + 10, 24, 4);
  ctx.fillStyle = '#138'; ctx.fillRect(cx - 8, cy + 14 + lo, 6, 16); ctx.fillRect(cx + 2, cy + 14 - lo, 6, 16);
  ctx.fillStyle = '#c33'; ctx.fillRect(cx - 9, cy + 28 + lo, 8, 4); ctx.fillRect(cx + 1, cy + 28 - lo, 8, 4);
}

// 用精灵绘制角色。脚底对齐碰撞盒底部，水平中心对齐碰撞盒中心。
// 高度等比缩放对齐 PLAYER_TARGET_H(80px)。
function drawPlayerSprite(p, cx, cy) {
  const entry = PLAYER_SPRITES[p.animKey];
  if (!entry || !entry.loaded || entry.frames.length === 0) {
    drawX(cx, cy, p.facing);  // 回退到手绘小人
    return;
  }
  const fi = Math.min(p.animF, entry.frames.length - 1);
  const f = entry.frames[fi];
  const scale = PLAYER_TARGET_H / f.h;
  const dw = f.w * scale, dh = f.h * scale;
  const bottomY = p.y + p.h;
  const drawXPos = cx - dw / 2;
  const drawY = bottomY - dh;
  // 其他动画资源默认面向右（facing>0 不翻）；climb 资源默认面向左（facing>0 翻）
  const flip = (p.animKey === 'climb') ? (p.facing > 0) : (p.facing < 0);
  ctx.save();
  if (flip) {
    ctx.translate(cx, bottomY);
    ctx.scale(-1, 1);
    ctx.drawImage(entry.img, f.x, f.y, f.w, f.h, -dw / 2, -dh, dw, dh);
  } else {
    ctx.drawImage(entry.img, f.x, f.y, f.w, f.h, drawXPos, drawY, dw, dh);
  }
  ctx.restore();
}

function drawPlayer() {
  const p = player;
  if (p.invT > 0 && Math.floor(p.invT / 3) % 2 === 0) return;
  const cx = Math.floor(p.x + p.w / 2);
  const cy = Math.floor(p.y + p.h / 2);
  ctx.save();
  for (const a of afterimages) { ctx.globalAlpha = (a.life / 12) * 0.35; drawX(a.x, a.y, a.facing); }
  ctx.globalAlpha = 1; drawPlayerSprite(p, cx, cy);
  ctx.restore();
  if (p.isChg && p.chgT > P.CHG1) {
    const r = 22 + (p.chgT >= P.CHG2 ? 8 : 0);
    const al = 0.4 + Math.sin(Date.now() / 100) * 0.2;
    ctx.strokeStyle = p.chgT >= P.CHG2 ? `rgba(255,60,60,${al})` : `rgba(255,180,60,${al})`;
    ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy - 4, r, 0, Math.PI * 2); ctx.stroke(); ctx.lineWidth = 1;
  }
}

function drawEnemy(en) {
  const t = ET[en.type];
  const cx = Math.floor(en.x + en.w / 2), cy = Math.floor(en.y + en.h / 2);
  const sx = en.x, sy = en.y;
  if (en.hurtT > 0 && en.hurtT % 2 === 0) ctx.globalAlpha = 0.5;

  if (t.boss) {
    ctx.fillStyle = '#63a'; ctx.lineWidth = 3;
    for (let i = 0; i < 6; i++) {
      const a = [-0.7, -0.4, -0.15, 0.15, 0.4, 0.7][i];
      const lx = cx + (i < 3 ? -14 : 14), ly = cy - 6 + i * 5;
      ctx.beginPath(); ctx.moveTo(lx, ly);
      ctx.lineTo(lx + Math.cos(a) * 22 * (i < 3 ? -1 : 1), ly + Math.abs(Math.sin(a)) * 24);
      ctx.stroke();
      ctx.fillStyle = '#84c'; ctx.beginPath();
      ctx.arc(lx + Math.cos(a) * 22 * (i < 3 ? -1 : 1), ly + Math.abs(Math.sin(a)) * 24, 3, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#63a';
    }
    ctx.fillStyle = '#84c'; ctx.beginPath(); ctx.ellipse(cx, cy, 22, 14, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#95d'; ctx.beginPath(); ctx.ellipse(cx, cy - 2, 16, 9, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#73b'; ctx.beginPath(); ctx.arc(cx + en.facing * 14, cy - 6, 11, 0, Math.PI * 2); ctx.fill();
    const g = 0.6 + Math.sin(Date.now() / 120) * 0.4;
    ctx.fillStyle = t.eye; ctx.beginPath(); ctx.arc(cx + en.facing * 18, cy - 8, 5, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `rgba(255,0,255,${g})`; ctx.beginPath(); ctx.arc(cx + en.facing * 18, cy - 8, 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = t.eye; ctx.beginPath(); ctx.arc(cx + en.facing * 14, cy - 14, 3, 0, Math.PI * 2); ctx.fill();
  } else if (en.type === 'bee') {
    ctx.fillStyle = '#fa0'; ctx.beginPath(); ctx.arc(cx, cy, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#333'; ctx.fillRect(cx - 4, cy - 7, 8, 3); ctx.fillRect(cx - 4, cy + 2, 8, 3);
    const wf = Math.sin(Date.now() / 30) * 4;
    ctx.fillStyle = 'rgba(200,220,255,0.5)';
    ctx.beginPath(); ctx.ellipse(cx - 6, cy - 8 + wf, 8, 4, -0.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + 6, cy - 8 - wf, 8, 4, 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#f44'; ctx.fillRect(cx - 4, cy - 4, 3, 3); ctx.fillRect(cx + 1, cy - 4, 3, 3);
    ctx.fillStyle = '#f60'; ctx.beginPath(); ctx.moveTo(cx, cy + 10); ctx.lineTo(cx - 3, cy + 16); ctx.lineTo(cx + 3, cy + 16); ctx.fill();
  } else if (t.amp) {
    ctx.fillStyle = t.col; ctx.beginPath(); ctx.arc(cx, cy, en.w / 2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = t.eye; ctx.beginPath(); ctx.arc(cx, cy, 6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx - 1, cy - 1, 2, 0, Math.PI * 2); ctx.fill();
  } else {
    const f = en.facing;
    ctx.fillStyle = t.col; ctx.fillRect(cx - 10, cy - 14, 20, 28);
    ctx.fillStyle = '#373'; ctx.fillRect(cx - 8, cy - 18, 16, 8);
    ctx.fillStyle = t.eye; ctx.fillRect(cx + f * 3 - 3, cy - 15, 6, 4);
    ctx.fillStyle = '#262'; ctx.fillRect(cx - 8, cy + 14, 6, 8); ctx.fillRect(cx + 2, cy + 14, 6, 8);
    ctx.fillStyle = '#888'; ctx.fillRect(cx + f * 11 - 2, cy - 6, 6, 10);
  }
  ctx.globalAlpha = 1;

  // 血条
  if (en.hp < en.maxHp) {
    const bw = t.boss ? 90 : 28, bh = t.boss ? 6 : 3;
    const bx = sx + en.w / 2 - bw / 2, by = sy - (t.boss ? 12 : 6);
    ctx.fillStyle = '#222'; ctx.fillRect(bx - 1, by - 1, bw + 2, bh + 2);
    const rt = Math.max(0, en.hp / en.maxHp);
    ctx.fillStyle = rt > 0.5 ? '#4c4' : rt > 0.25 ? '#cc4' : '#c44';
    ctx.fillRect(bx, by, bw * rt, bh);
    if (t.boss) {
      ctx.fillStyle = '#fff'; ctx.font = '8px "Courier New"'; ctx.textAlign = 'center';
      ctx.fillText(`${t.name} ${en.hp}/${en.maxHp}`, sx + en.w / 2, by - 2);
    }
  }
}

// 绘制一个基于 strip+frames.json 的动画实体（子弹 flying / 特效 out / 特效 hit 共用）
// entry: BULLET_SPRITES 里的条目 { img, frames, fps }
// 按每帧真实宽高绘制，不统一缩放，避免高度不一致导致忽大忽小
function drawAnimEntry(entry, animT, dir, cx, cy, scale) {
  if (!entry || !entry.loaded || entry.frames.length === 0) return false;
  const frameDur = Math.round(60 / entry.fps);
  const fi = Math.floor(animT / frameDur) % entry.frames.length;
  const f = entry.frames[fi];
  const dw = f.w * scale, dh = f.h * scale;
  ctx.save();
  if (dir < 0) {
    ctx.translate(cx, cy);
    ctx.scale(-1, 1);
    ctx.drawImage(entry.img, f.x, f.y, f.w, f.h, -dw / 2, -dh / 2, dw, dh);
  } else {
    ctx.drawImage(entry.img, f.x, f.y, f.w, f.h, cx - dw / 2, cy - dh / 2, dw, dh);
  }
  ctx.restore();
  return true;
}

function drawBullets() {
  for (const b of bullets) {
    const bx = b.x, by = b.y;
    const entry = BULLET_SPRITES[`${b.type}-flying`];
    const scale = BULLET_TYPE[b.type] ? BULLET_TYPE[b.type].displayScale : 1.0;
    // 用真实帧宽高绘制 flying 循环动画；未加载时回退到纯色矩形
    if (!drawAnimEntry(entry, b.animT, b.dir, bx, by, scale)) {
      ctx.fillStyle = b.color;
      ctx.fillRect(bx - b.w / 2, by - b.h / 2, b.w, b.h);
      if (b.power > 0) { ctx.fillStyle = '#fff'; ctx.fillRect(bx - b.w / 4, by - b.h / 4, b.w / 2, b.h / 2); }
    }
  }
  for (const b of eBullets) {
    const bx = b.x, by = b.y;
    ctx.strokeStyle = '#f4f'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(bx, by, 4 + Math.sin(Date.now() / 60) * 0.5, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,68,255,0.5)'; ctx.beginPath(); ctx.arc(bx, by, 2, 0, Math.PI * 2); ctx.fill();
  }
  // 枪口发射特效（out）
  for (const m of muzzleEffects) {
    const entry = BULLET_SPRITES[`${m.key}-out`];
    const scale = BULLET_TYPE[m.key] ? BULLET_TYPE[m.key].displayScale : 1.0;
    drawAnimEntry(entry, m.animT, m.dir, m.x, m.y, scale);
  }
  // 命中特效（hit）
  for (const h of hitEffects) {
    const entry = BULLET_SPRITES[`${h.key}-hit`];
    const scale = BULLET_TYPE[h.key] ? BULLET_TYPE[h.key].displayScale : 1.0;
    drawAnimEntry(entry, h.animT, h.dir, h.x, h.y, scale);
  }
}

function drawParticles() {
  for (const pt of particles) {
    ctx.globalAlpha = pt.life / 30; ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size);
  }
  ctx.globalAlpha = 1;
}

function drawUI() {
  const hx = 10, hy = 10, hw = 200, hh = 14;
  ctx.fillStyle = '#222'; ctx.fillRect(hx - 1, hy - 1, hw + 2, hh + 2);
  ctx.fillStyle = '#400'; ctx.fillRect(hx, hy, hw, hh);
  const r = Math.max(0, player.hp / P.MAX_HP);
  ctx.fillStyle = r > 0.5 ? '#4c4' : r > 0.25 ? '#cc4' : '#c44';
  ctx.fillRect(hx, hy, hw * r, hh);
  ctx.fillStyle = '#fff'; ctx.font = '10px "Courier New"'; ctx.textAlign = 'center';
  ctx.fillText(`HP: ${player.hp}/${P.MAX_HP}`, hx + hw / 2, hy + 11);

  if (player.isChg) {
    const cy = hy + hh + 6;
    ctx.fillStyle = '#222'; ctx.fillRect(hx, cy, hw, 6);
    const cr = Math.min(1, player.chgT / P.CHG2);
    ctx.fillStyle = cr >= 1 ? '#f33' : cr >= 0.05 ? '#fa0' : '#ff0';
    ctx.fillRect(hx, cy, hw * cr, 6);
  }

  if (player.hp <= 0) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, VW, VH);
    ctx.fillStyle = '#f33'; ctx.font = 'bold 36px "Courier New"'; ctx.textAlign = 'center';
    ctx.fillText('GAME OVER', VW / 2, VH / 2 - 10);
    ctx.fillStyle = '#fff'; ctx.font = '16px "Courier New"';
    ctx.fillText('按空格键重新开始', VW / 2, VH / 2 + 30);
  } else if (enemies.length === 0) {
    ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(0, 0, VW, VH);
    ctx.fillStyle = '#4f4'; ctx.font = 'bold 36px "Courier New"'; ctx.textAlign = 'center';
    ctx.fillText('STAGE CLEAR!', VW / 2, VH / 2 - 10);
    ctx.fillStyle = '#fff'; ctx.font = '16px "Courier New"';
    ctx.fillText('按空格键重新开始', VW / 2, VH / 2 + 30);
  }

  document.getElementById('db-hp').textContent = `${player.hp}/${P.MAX_HP}`;
  document.getElementById('db-charge').textContent = player.isChg ? `${Math.round(player.chgT / P.CHG2 * 100)}%` : '0%';
  document.getElementById('db-enemies').textContent = `${enemies.length}`;
  document.getElementById('db-pos').textContent = `${Math.round(player.x / MAP_W * 100)}%`;
}

function render() {
  ctx.clearRect(0, 0, VW, VH);
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, '#0a1a2a'); g.addColorStop(0.5, '#0d2a1a'); g.addColorStop(1, '#0a1a0a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);

  // 瀑布背景线（跟随摄像机，在世界变换之前绘制避免缩放影响）
  ctx.strokeStyle = 'rgba(100,180,255,0.04)'; ctx.lineWidth = 2;
  for (let x = 0; x < VW + TILE; x += TILE) {
    const wx = x + Math.floor(camera.x / TILE) * TILE;
    for (let y = 0; y < VH; y += 16) {
      const o = (Date.now() / 50 + wx * 3) % 16;
      ctx.beginPath(); ctx.moveTo(x, y + o); ctx.lineTo(x, y + o + 6); ctx.stroke();
    }
  }

  // === 统一世界变换: 所有世界坐标渲染都在此变换下 ===
  // 注意: 先 translate 再 scale，避免 translate 量被 scale 放大
  const z = camera.zoom;
  const invZ = 1 / z;
  ctx.save();
  ctx.translate(-camera.x * z, -camera.y * z);
  ctx.scale(z, z);

  // 只渲染屏幕可见范围的砖块
  const startCol = Math.max(0, Math.floor(camera.x / TILE) - 1);
  const endCol = Math.min(LW, Math.ceil((camera.x + VW * invZ) / TILE) + 1);
  const startRow = Math.max(0, Math.floor(camera.y / TILE) - 1);
  const endRow = Math.min(LH, Math.ceil((camera.y + VH * invZ) / TILE) + 1);
  for (let r = startRow; r < endRow; r++) {
    for (let c = startCol; c < endCol; c++) {
      if (map[r * LW + c] === 1) drawTile(c * TILE, r * TILE);
    }
  }

  drawParticles();
  drawBullets();
  for (const en of enemies) {
    if (en.x + en.w > camera.x - 50 * invZ && en.x < camera.x + VW * invZ + 50 * invZ) {
      drawEnemy(en);
    }
  }
  if (!editMode) drawPlayer();

  // 编辑器 overlay 也在世界变换下
  if (editMode) drawEditorOverlay();

  ctx.restore();
  // === 世界变换结束, 以下为屏幕坐标 ===

  drawUI();
}

// ==================== 编辑模式 ====================
let editMode = false;
let editTool = 'tile'; // 'tile' | 'enemy' | 'player'
let mouseWorldX = 0, mouseWorldY = 0;

const editorToolbar = document.getElementById('editor-toolbar');
const editorPanel = document.getElementById('editor-panel');
const btnTile = document.getElementById('btn-tile');
const btnEnemy = document.getElementById('btn-enemy');
const btnPlayer = document.getElementById('btn-player');
const enemyTypeSelect = document.getElementById('enemy-type');
const jsonOutput = document.getElementById('json-output');

function setEditMode(on) {
  if (on) {
    editMode = true;
    editorToolbar.classList.add('active');
    updateToolUI();
    // 进入编辑模式时清空子弹和粒子残留，重置所有怪物到初始状态
    bullets = []; eBullets = []; particles = []; afterimages = []; muzzleEffects = []; hitEffects = [];
    const data = levelData || DEFAULT_LEVEL;
    enemies = spawnEnemiesFromData(data);
  } else {
    // 退出编辑模式前验证出生点合法性
    const ps = getPlayerSpawn();
    if (!isSpawnValid(ps.x, ps.y)) {
      alert('初始点位置错误！出生点与地形或敌人重合，请移动到一个空位后再退出。');
      return;
    }
    editMode = false;
    editorToolbar.classList.remove('active');
    editorPanel.classList.remove('active');
    // 退出编辑模式时重置摄像机，定位到玩家居中位置
    camera.zoom = 1.0;
    const mapH = LH * TILE;
    camera.x = Math.max(0, Math.min(MAP_W - VW, player.x + player.w / 2 - VW / 2));
    camera.y = Math.max(0, Math.min(mapH - VH, player.y + player.h / 2 - VH / 2));
    isPanning = false;
    isDraggingPlayer = false;
    canvas.style.cursor = '';
  }
}

function updateToolUI() {
  btnTile.classList.toggle('sel', editTool === 'tile');
  btnEnemy.classList.toggle('sel', editTool === 'enemy');
  btnPlayer.classList.toggle('sel', editTool === 'player');
  enemyTypeSelect.style.display = editTool === 'enemy' ? 'inline' : 'none';
  // player 模式显示 grab 光标
  if (editMode) {
    canvas.style.cursor = (editTool === 'player') ? 'grab' : '';
  }
}

btnTile.addEventListener('click', () => { editTool = 'tile'; updateToolUI(); });
btnEnemy.addEventListener('click', () => { editTool = 'enemy'; updateToolUI(); });
btnPlayer.addEventListener('click', () => { editTool = 'player'; updateToolUI(); });
document.getElementById('btn-exit-edit').addEventListener('click', () => setEditMode(false));

// 长按放置/删除
let mouseDown = 0; // 0=无, 1=左键, 2=右键
let isDraggingPlayer = false; // player 模式下是否正在拖拽出生点
let dragPlayerOffX = 0, dragPlayerOffY = 0; // 拖拽时鼠标相对于出生点左上角的偏移

// 检测玩家出生点矩形是否与地形或敌人碰撞
function isSpawnValid(sx, sy) {
  const rect = { x: sx, y: sy, w: P.PW, h: P.PH };
  // 检查是否与任何 tile 碰撞
  for (let r = 0; r < LH; r++) {
    for (let c = 0; c < LW; c++) {
      if (map[r * LW + c] === 0) continue;
      if (overlap(rect, { x: c * TILE, y: r * TILE, w: TILE, h: TILE })) return false;
    }
  }
  // 检查是否与任何敌人碰撞
  for (const en of enemies) {
    if (overlap(rect, { x: en.x, y: en.y, w: en.w, h: en.h })) return false;
  }
  // 检查是否超出地图边界
  if (sx < 0 || sy < 0 || sx + P.PW > MAP_W) return false;
  return true;
}

function doEditAction() {
  const col = Math.floor(mouseWorldX / TILE);
  const row = Math.floor(mouseWorldY / TILE);

  if (editTool === 'tile') {
    if (mouseDown === 1) {
      if (col < 0 || col >= LW || row < 0 || row >= LH) expandMap(col, row);
      map[row * LW + col] = 1;
    } else if (mouseDown === 2) {
      if (col >= 0 && col < LW && row >= 0 && row < LH) map[row * LW + col] = 0;
    }
  } else if (editTool === 'enemy') {
    if (mouseDown === 1) {
      const etype = enemyTypeSelect.value;
      const ex = col * TILE + TILE / 2 - (ET[etype].w / 2);
      const ey = row * TILE;
      // 避免在同一位置反复放置：检查是否已有敌人在附近
      const nearby = enemies.some(en =>
        Math.abs(en.x - ex) < 8 && Math.abs(en.y - ey) < 8
      );
      if (!nearby) {
        enemies.push(mkEnemy(etype, ex, ey));
      }
    } else if (mouseDown === 2) {
      const wx = mouseWorldX, wy = mouseWorldY;
      let closest = null, closestDist = Infinity;
      for (let i = enemies.length - 1; i >= 0; i--) {
        const en = enemies[i];
        const cx = en.x + en.w / 2, cy = en.y + en.h / 2;
        const d = Math.sqrt((wx - cx) ** 2 + (wy - cy) ** 2);
        if (d < 40 && d < closestDist) { closest = i; closestDist = d; }
      }
      if (closest !== null) enemies.splice(closest, 1);
    }
  }
  // player 模式不再通过 doEditAction 处理，而是通过拖拽处理
}

canvas.addEventListener('mousedown', e => {
  if (!editMode) return;
  if (e.button === 0) {
    e.preventDefault();
    if (editTool === 'player') {
      // player 模式：检查是否点击在出生点矩形内
      const ps = getPlayerSpawn();
      if (mouseWorldX >= ps.x && mouseWorldX <= ps.x + P.PW &&
          mouseWorldY >= ps.y && mouseWorldY <= ps.y + P.PH) {
        isDraggingPlayer = true;
        dragPlayerOffX = mouseWorldX - ps.x;
        dragPlayerOffY = mouseWorldY - ps.y;
        canvas.style.cursor = 'grabbing';
      }
    } else {
      mouseDown = 1;
      doEditAction();
    }
  } else if (e.button === 2) {
    e.preventDefault();
    mouseDown = 2;
    doEditAction();
  }
});

window.addEventListener('mouseup', e => {
  if (e.button === 0) {
    if (isDraggingPlayer) {
      isDraggingPlayer = false;
      canvas.style.cursor = (editTool === 'player') ? 'grab' : '';
    }
    mouseDown = 0;
  } else if (e.button === 2) {
    mouseDown = 0;
  }
});

// mousemove 中持续执行编辑操作
canvas.addEventListener('mousemove', e => {
  if (!editMode) return;
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;
  mouseWorldX = sx / camera.zoom + camera.x;
  mouseWorldY = sy / camera.zoom + camera.y;
  if (isDraggingPlayer) {
    // 拖拽出生点：自由像素级位置
    const data = levelData || DEFAULT_LEVEL;
    if (!data.playerSpawn) data.playerSpawn = {};
    data.playerSpawn.x = Math.round(mouseWorldX - dragPlayerOffX);
    data.playerSpawn.y = Math.round(mouseWorldY - dragPlayerOffY);
  } else if (mouseDown !== 0) {
    doEditAction();
  }
});

canvas.addEventListener('contextmenu', e => { if (editMode) e.preventDefault(); });

// 编辑模式下按住中键(滚轮按下)拖动平移摄像机
let isPanning = false, panStartX = 0, panStartY = 0, panCamStartX = 0, panCamStartY = 0;

canvas.addEventListener('mousedown', e => {
  if (!editMode) return;
  if (e.button === 1) { // 中键按下
    e.preventDefault();
    isPanning = true;
    panStartX = e.clientX;
    panStartY = e.clientY;
    panCamStartX = camera.x;
    panCamStartY = camera.y;
    canvas.style.cursor = 'grabbing';
  }
});

window.addEventListener('mousemove', e => {
  if (!isPanning) return;
  const dx = (panStartX - e.clientX) / camera.zoom;
  const dy = (panStartY - e.clientY) / camera.zoom;
  camera.x = panCamStartX + dx;
  camera.y = panCamStartY + dy;
  // 不再限制范围，允许自由平移查看地图外区域
});

window.addEventListener('mouseup', e => {
  if (e.button === 1 && isPanning) {
    isPanning = false;
    canvas.style.cursor = '';
  }
});

// 防止中键点击默认行为(自动滚动)
canvas.addEventListener('auxclick', e => { if (e.button === 1) e.preventDefault(); });

// 编辑模式下滚轮缩放
canvas.addEventListener('wheel', e => {
  if (!editMode) return;
  e.preventDefault();
  const zoomSpeed = 0.1;
  const rect = canvas.getBoundingClientRect();
  const mx = (e.clientX - rect.left) / camera.zoom + camera.x;
  const my = (e.clientY - rect.top) / camera.zoom + camera.y;
  const oldZoom = camera.zoom;
  if (e.deltaY < 0) {
    camera.zoom = Math.min(4.0, camera.zoom + zoomSpeed);
  } else {
    camera.zoom = Math.max(0.2, camera.zoom - zoomSpeed);
  }
  // 以鼠标位置为中心缩放
  camera.x = mx - (e.clientX - rect.left) / camera.zoom;
  camera.y = my - (e.clientY - rect.top) / camera.zoom;
}, { passive: false });

// 导出 JSON
function exportLevelJSON() {
  // 从当前 map 生成 tile 规则 (简化: 直接导出逐格地图)
  // 先用 tile rules 压缩格式，但为了通用性，直接导出完整 tile 数组
  const tiles = [];
  for (let r = 0; r < LH; r++) {
    for (let c = 0; c < LW; c++) {
      if (map[r * LW + c] === 1) {
        tiles.push({ col: c, row: r, value: 1 });
      }
    }
  }
  // 压缩: 合并连续的行列
  const compressed = compressTiles(tiles);
  const enemyData = enemies.map(en => {
    const e = { type: en.type, x: Math.round(en.x), y: Math.round(en.y) };
    if (en.type === 'soldier') {
      e.patrolMin = en.pMin;
      e.patrolMax = en.pMax;
    }
    return e;
  });
  const ps = getPlayerSpawn();
  return JSON.stringify({
    width: LW, height: LH, tileSize: TILE,
    playerSpawn: { x: ps.x, y: ps.y },
    tiles: compressed,
    enemies: enemyData
  }, null, 2);
}

function compressTiles(rawTiles) {
  // 简单的按行分组压缩: 同一行连续列合并成 [colStart, colEnd]
  const byRow = {};
  for (const t of rawTiles) {
    if (!byRow[t.row]) byRow[t.row] = [];
    byRow[t.row].push(t.col);
  }
  const result = [];
  for (const [row, cols] of Object.entries(byRow)) {
    cols.sort((a, b) => a - b);
    let start = cols[0], end = cols[0];
    for (let i = 1; i < cols.length; i++) {
      if (cols[i] === end + 1) { end = cols[i]; }
      else {
        result.push({ col: start === end ? start : [start, end], row: parseInt(row), value: 1 });
        start = cols[i]; end = cols[i];
      }
    }
    result.push({ col: start === end ? start : [start, end], row: parseInt(row), value: 1 });
  }
  return result;
}

function showExportPanel() {
  jsonOutput.value = exportLevelJSON();
  editorPanel.classList.add('active');
}

// Ctrl+S 导出
window.addEventListener('keydown', e => {
  if (e.key === 'e' || e.key === 'E') {
    // 只在没有聚焦输入框时触发
    if (document.activeElement === document.body || document.activeElement === canvas) {
      setEditMode(!editMode);
    }
  }
  if (e.ctrlKey && e.key === 's') {
    e.preventDefault();
    showExportPanel();
  }
});

document.getElementById('btn-copy').addEventListener('click', () => {
  jsonOutput.select();
  document.execCommand('copy');
  alert('JSON 已复制到剪贴板!');
});

document.getElementById('btn-export-download').addEventListener('click', () => {
  const blob = new Blob([jsonOutput.value], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'level.json'; a.click();
  URL.revokeObjectURL(url);
});

document.getElementById('btn-close-panel').addEventListener('click', () => {
  editorPanel.classList.remove('active');
});

// ==================== 编辑器渲染覆盖 ====================
function drawEditorOverlay() {
  if (!editMode) return;
  const col = Math.floor(mouseWorldX / TILE);
  const row = Math.floor(mouseWorldY / TILE);

  const sx = col * TILE;
  const sy = row * TILE;

  if (editTool === 'tile') {
    ctx.strokeStyle = 'rgba(255,255,0,0.7)';
    ctx.lineWidth = 2;
    ctx.strokeRect(sx, sy, TILE, TILE);
    ctx.fillStyle = 'rgba(255,255,0,0.15)';
    ctx.fillRect(sx, sy, TILE, TILE);
    ctx.lineWidth = 1;
  } else if (editTool === 'enemy') {
    const etype = enemyTypeSelect.value;
    const t = ET[etype];
    const ex = col * TILE + TILE / 2 - t.w / 2;
    const ey = row * TILE;
    const cx = ex + t.w / 2;
    const cy = ey + t.h / 2;
    ctx.strokeStyle = 'rgba(255,100,100,0.7)';
    ctx.lineWidth = 2;
    ctx.strokeRect(ex, ey, t.w, t.h);
    ctx.fillStyle = 'rgba(255,100,100,0.15)';
    ctx.fillRect(ex, ey, t.w, t.h);
    ctx.fillStyle = '#fff';
    ctx.font = '10px "Courier New"';
    ctx.textAlign = 'center';
    ctx.fillText(t.name, cx, cy - t.h / 2 - 4);
    ctx.lineWidth = 1;
  } else if (editTool === 'player') {
    // 鼠标悬停显示玩家实际大小预览（非拖拽中）
    if (!isDraggingPlayer) {
      const px = mouseWorldX - P.PW / 2;
      const py = mouseWorldY - P.PH / 2;
      ctx.strokeStyle = 'rgba(100,255,255,0.5)';
      ctx.lineWidth = 2;
      ctx.setLineDash([4, 4]);
      ctx.strokeRect(px, py, P.PW, P.PH);
      ctx.setLineDash([]);
      ctx.lineWidth = 1;
    }
  }

  // 始终绘制当前玩家出生点标记（任何编辑模式下都显示）
  const ps = getPlayerSpawn();
  const valid = isSpawnValid(ps.x, ps.y);
  const psa = 0.5 + Math.sin(Date.now() / 500) * 0.3;

  if (valid) {
    // 合法：青色
    ctx.strokeStyle = `rgba(100,255,255,${psa})`;
    ctx.fillStyle = `rgba(100,255,255,0.2)`;
  } else {
    // 不合法：红色闪烁
    ctx.strokeStyle = `rgba(255,60,60,${0.7 + psa * 0.3})`;
    ctx.fillStyle = `rgba(255,60,60,0.25)`;
  }
  ctx.lineWidth = 3;
  ctx.strokeRect(ps.x, ps.y, P.PW, P.PH);
  ctx.fillRect(ps.x, ps.y, P.PW, P.PH);

  // 标签
  ctx.fillStyle = valid ? '#0ff' : '#f44';
  ctx.font = '10px "Courier New"';
  ctx.textAlign = 'center';
  ctx.fillText(valid ? 'SPAWN' : 'INVALID!', ps.x + P.PW / 2, ps.y - 6);
  ctx.lineWidth = 1;
}

function loop() { update(); render(); requestAnimationFrame(loop); }

reset(); loop();
</script>
