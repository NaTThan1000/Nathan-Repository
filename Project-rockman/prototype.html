<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rockman X4 - 丛林关卡</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Courier New', monospace;
    color: #e0e0e0;
    user-select: none;
    position: relative;
  }
  canvas { border: 2px solid #4a4a6a; image-rendering: pixelated; }
  #ui { display: flex; gap: 40px; margin-top: 12px; align-items: flex-start; }
  #controls-info { font-size: 12px; line-height: 1.6; color: #888; }
  #controls-info span.key {
    display: inline-block; background: #333; color: #ffcc00;
    padding: 2px 6px; border-radius: 3px; margin: 0 2px;
    font-weight: bold; min-width: 20px; text-align: center;
  }
  #debug-panel { font-size: 11px; line-height: 1.5; color: #666; min-width: 180px; }
  #debug-panel .label { color: #888; }
  #debug-panel .value { color: #4fc3f7; }
  h2 { font-size: 14px; color: #ffcc00; margin-bottom: 8px; letter-spacing: 2px; }
  /* 编辑器面板 */
  #editor-panel {
    display: none; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: #1a1a2e; border: 2px solid #ffcc00;
    padding: 16px; z-index: 10; width: 700px; max-height: 80vh; overflow-y: auto;
    font-family: 'Courier New', monospace; font-size: 12px;
  }
  #editor-panel.active { display: block; }
  #editor-panel textarea {
    width: 100%; height: 300px; background: #0d0d1a; color: #4fc3f7;
    border: 1px solid #444; padding: 8px; font-family: 'Courier New', monospace;
    font-size: 11px; resize: vertical;
  }
  #editor-panel button {
    background: #333; color: #ffcc00; border: 1px solid #ffcc00;
    padding: 6px 14px; margin: 4px; cursor: pointer; font-family: inherit; font-size: 12px;
  }
  #editor-panel button:hover { background: #555; }
  #editor-panel button.danger { color: #ff4444; border-color: #ff4444; }
  #editor-toolbar {
    display: none; position: absolute; top: 8px; right: 8px;
    background: rgba(0,0,0,0.8); border: 1px solid #ffcc00;
    padding: 6px 10px; z-index: 5; font-family: 'Courier New', monospace; font-size: 11px;
  }
  #editor-toolbar.active { display: flex; gap: 8px; align-items: center; }
  #editor-toolbar .mode-btn { padding: 3px 8px; cursor: pointer; border: 1px solid #888; background: #222; color: #aaa; border-radius: 2px; }
  #editor-toolbar .mode-btn.sel { background: #ffcc00; color: #111; border-color: #ffcc00; }
  #editor-toolbar select { background: #222; color: #ffcc00; border: 1px solid #888; padding: 2px 4px; font: inherit; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="editor-toolbar">
  <span style="color:#ffcc00">编辑模式</span>
  <button class="mode-btn sel" data-mode="tile" id="btn-tile">砖块</button>
  <button class="mode-btn" data-mode="enemy" id="btn-enemy">敌人</button>
  <button class="mode-btn" data-mode="player" id="btn-player">玩家出生点</button>
  <select id="enemy-type" style="display:none">
    <option value="soldier">丛林兵</option>
    <option value="bee">机械蜂</option>
    <option value="floater">浮游炮</option>
    <option value="boss">Boss</option>
  </select>
  <select id="tile-size" style="display:none">
    <option value="small">小砖块 28×28</option>
    <option value="big">大砖块 56×56</option>
  </select>
  <span style="color:#888;font-size:10px">左键=放置 右键=删除 中键拖动=平移 滚轮=缩放 Ctrl+S=导出</span>
  <button style="margin-left:8px;color:#f44;border-color:#f44" id="btn-exit-edit">退出编辑</button>
</div>
<div id="editor-panel">
  <h2 style="margin-top:0">导出关卡 JSON</h2>
  <p style="color:#888;margin:0 0 8px">复制下面的 JSON 内容，粘贴到 level.json 文件中保存即可。</p>
  <textarea id="json-output" readonly></textarea>
  <div style="margin-top:8px">
    <button id="btn-copy">复制到剪贴板</button>
    <button id="btn-export-download">下载 JSON 文件</button>
    <button id="btn-close-panel">关闭</button>
  </div>
</div>
<div id="ui">
  <div>
    <h2>操作说明</h2>
    <div id="controls-info">
      <span class="key">A</span><span class="key">D</span> 移动 &nbsp;
      <span class="key">K</span> 跳跃<br>
      <span class="key">J</span> 射击/蓄力 &nbsp;
      <span class="key">L</span> 冲刺<br>
      <span class="key">S</span> 下蹲<br>
      <span class="key">空格</span> 重置<br>
      <span class="key">E</span> 编辑模式 &nbsp;
      <span class="key">Ctrl+S</span> 导出<br><br>
      普通弹=1 小蓄力=3 大蓄力=6<br>
      卷轴关卡: 峡谷→瀑布→丛林→Boss巢穴
    </div>
  </div>
  <div id="debug-panel">
    <h2>状态</h2>
    <div style="margin-bottom:4px">
      <button id="btn-char-x" class="char-btn" style="background:#24a;color:#fff;border:1px solid #888;padding:2px 8px;cursor:pointer">X</button>
      <button id="btn-char-zero" class="char-btn" style="background:#c22;color:#fff;border:1px solid #888;padding:2px 8px;cursor:pointer">Zero</button>
    </div>
    <div><span class="label">角色:</span> <span class="value" id="db-char">X</span></div>
    <div><span class="label">HP:</span> <span class="value" id="db-hp">28/28</span></div>
    <div><span class="label">蓄力:</span> <span class="value" id="db-charge">0%</span></div>
    <div><span class="label">怪物:</span> <span class="value" id="db-enemies">-</span></div>
    <div><span class="label">进度:</span> <span class="value" id="db-pos">0%</span></div>
  </div>
</div>

<script>
// ==================== 常量 ====================
const VW = 800, VH = 500;  // 视口大小（屏幕像素，不参与世界缩放）

// 世界缩放系数：素材原始像素 → 屏幕像素 的固定放大倍数（唯一的世界尺寸缩放口径）。
// 所有游戏世界坐标/尺寸/物理量一律以「素材原始像素」为单位，渲染时在最外层乘回 VIEW_SCALE 放大到屏幕。
// 取 2.3 作为干净近似值（原精确值为 80/35≈2.286，允许极小误差，见 README 约定）。
const VIEW_SCALE = 2.3;

const GRAVITY = 0.24, MAX_FALL = 5.2, TILE = 28;   // 小砖块尺寸（素材像素）
const TILE_BIG = 56;                                  // 大砖块尺寸 = TILE * 2

const P = {
  PW: 30, PH: 35,
  PC: 17,           // 下蹲/冲刺碰撞盒高度
  SPEED: 1.75, JUMP: -5.2,
  WALL_SLIDE: 0.65, WALL_JUMP_X: 2.4, WALL_JUMP_Y: -4.4,
  DASH_MULT: 1.5, DASH_DIST: 56,
  CHG1: 6, CHG2: 60,
  BULLET: 6.1,
  INV: 30, WALL_LOCK: 6,
  MAX_HP: 28,
};
const DMG = { 0: 1, 1: 3, 2: 6 };

// ==================== 子弹 Sprite 资源 ====================
// 子弹类型 → 状态 → 资源。每种子弹有 flying(循环)/hit(瞬时)/out(枪口瞬时) 三个状态。
// 显示缩放：以资源真实尺寸为基准，映射到游戏里的显示尺寸（displayScale）。
// 帧数据来自 {type}-{state}_frames.json 的 frames[]，加载时按 strip 排版规则重算为 strip 图里的源裁剪坐标。
const BULLET_TYPE = {
  small:  { power: 0, baseW: 16, baseH: 11, displayScale: 1.0 },
  middle: { power: 1, baseW: 24, baseH: 16, displayScale: 1.0 },
  big:    { power: 2, baseW: 39, baseH: 26, displayScale: 1.0 },
};
const BULLET_SPRITES = {};  // key: `${type}-${state}` -> { img, frames, fps, loaded }

// 资源配置表：子弹类型 → 状态列表
const BULLET_STATES = {
  small:  { states: ['flying', 'hit'],             type: 'small-bullet' },
  middle: { states: ['flying', 'hit', 'out'],      type: 'middle-bullet' },
  big:    { states: ['flying', 'hit', 'out'],      type: 'big-bullet' },
};

// 加载所有子弹的 strip 图 + frames.json
function loadBulletSprites() {
  for (const key of Object.keys(BULLET_STATES)) {
    const { type, states } = BULLET_STATES[key];
    for (const state of states) {
      const base = `Assets/Assets-Clean/${type}-${state}`;
      const entry = { img: new Image(), frames: [], fps: 10, loaded: false };
      BULLET_SPRITES[`${key}-${state}`] = entry;
      // 加载帧数据
      fetch(`${base}_frames.json`)
        .then(r => r.json())
        .then(data => {
          // _frames.json 里的 frames[] 坐标是相对原图(clean.png)的绝对位置，
          // 但实际渲染用的是 strip.png（等宽条带），需要按 strip 排版规则重算每帧在 strip 里的源裁剪坐标。
          // strip 规则(与 sprite-build.js 一致)：等宽 fw=max(w)，条带高 fh=max(h)，每帧水平/垂直居中。
          const rawFrames = data.frames || [];
          if (rawFrames.length > 0) {
            const fw = Math.max(...rawFrames.map(f => f.w));
            const fh = Math.max(...rawFrames.map(f => f.h));
            entry.frames = rawFrames.map((f, i) => ({
              x: i * fw + Math.round((fw - f.w) / 2),  // strip 里水平居中后的 x
              y: Math.round((fh - f.h) / 2),           // strip 里垂直居中后的 y
              w: f.w,
              h: f.h,
            }));
          }
          entry.fps = data.fps || 10;
        })
        .catch(() => { entry.frames = []; });
      entry.img.onload = () => { entry.loaded = true; };
      entry.img.src = `${base}_strip.png`;
    }
  }
  // 通用受击特效（Zero 近战命中专用）：Assets/Assets-Clean/hit_strip.png + hit_frames.json
  {
    const base = 'Assets/Assets-Clean/hit';
    const entry = { img: new Image(), frames: [], fps: 10, loaded: false };
    BULLET_SPRITES['melee-hit'] = entry;
    fetch(`${base}_frames.json`)
      .then(r => r.json())
      .then(data => {
        const rawFrames = data.frames || [];
        if (rawFrames.length > 0) {
          const fw = Math.max(...rawFrames.map(f => f.w));
          const fh = Math.max(...rawFrames.map(f => f.h));
          entry.frames = rawFrames.map((f, i) => ({
            x: i * fw + Math.round((fw - f.w) / 2),  // strip 里水平居中后的 x
            y: Math.round((fh - f.h) / 2),           // strip 里垂直居中后的 y
            w: f.w,
            h: f.h,
          }));
        }
        entry.fps = data.fps || 10;
      })
      .catch(() => { entry.frames = []; });
    entry.img.onload = () => { entry.loaded = true; };
    entry.img.src = `${base}_strip.png`;
  }
}
loadBulletSprites();

// ==================== 角色 Sprite 资源 ====================
// 角色动画状态 → 资源文件前缀（与 idle-*.json/png 对应）
// 缩放基准：以站立帧高度为基准，等比放大到碰撞盒高度 PH(80px)。
const PLAYER_ANIMS = {
  stand:     'idle-stand',
  shoot:     'idle-shoot',
  running:   'idle-running',
  jump:      'idle-jump',
  dash:      'idle-dash',
  climb:     'idle-climb',
  crouch:    'idle-crouch',
  runShoot:  'idle-running&shoot',
  jumpShoot: 'idle-jump&shoot',
  dashShoot: 'idle-dash&shoot',
};
const PLAYER_SPRITES = {};  // key -> { img, frames, fps, loaded, maxW, maxH }
// 玩家素材直接以「原始像素」作为世界坐标，不再额外放大（缩放统一由渲染层 VIEW_SCALE 负责）
const SPRITE_SCALE = 1.0;

// 各状态碰撞盒规格（素材原始像素，即世界坐标）。
// 碰撞盒 A（站立）= 站立素材最大宽高；碰撞盒 B（定制）= 宽取 dash 素材最大宽，高取 crouch 素材最大高。
// 具体宽高在素材加载完成后由 updateHitboxTable() 根据实际 maxW/maxH 计算。
const HITBOX = {
  stand:   { w: 0, h: 0 },  // 碰撞盒 A（站立）：30×35
  jump:    { w: 0, h: 0 },  // 跳跃：与站立相同（碰撞盒 A）
  dash:    { w: 0, h: 0 },  // 碰撞盒 B（定制）：38×27（宽=dash，高=crouch）
  crouch:  { w: 0, h: 0 },  // 下蹲：碰撞盒 B
};

// 根据已加载的素材 maxW/maxH 计算各状态碰撞盒
function updateHitboxTable() {
  const stand = PLAYER_SPRITES.stand;
  const dash = PLAYER_SPRITES.dash;
  const crouch = PLAYER_SPRITES.crouch;
  // 碰撞盒 A：站立素材最大宽高
  const standW = (stand && stand.maxW ? stand.maxW : 30) * SPRITE_SCALE;
  const standH = (stand && stand.maxH ? stand.maxH : 35) * SPRITE_SCALE;
  // 碰撞盒 B：宽 = dash 素材最大宽，高 = crouch 素材最大高
  const dashW = (dash && dash.maxW ? dash.maxW : 38) * SPRITE_SCALE;
  const crouchH = (crouch && crouch.maxH ? crouch.maxH : 27) * SPRITE_SCALE;

  HITBOX.stand.w = standW;
  HITBOX.stand.h = standH;
  HITBOX.jump.w = standW;          // 跳跃碰撞盒 = 站立（碰撞盒 A）
  HITBOX.jump.h = standH;
  HITBOX.dash.w = dashW;           // 碰撞盒 B 宽 = dash 素材最大宽
  HITBOX.dash.h = crouchH;         // 碰撞盒 B 高 = crouch 素材最大高
  HITBOX.crouch.w = dashW;         // 下蹲用碰撞盒 B（与 dash 同宽）
  HITBOX.crouch.h = crouchH;

  // 同步 P 常量（站立宽/高），供编辑器出生点/子弹口等引用
  P.PW = Math.round(standW);
  P.PH = Math.round(standH);
  P.PC = Math.round(standH / 2);

  // 若玩家已创建且当前处于站立状态（非下蹲/非冲刺），同步其碰撞盒到新站立值
  if (typeof player !== 'undefined' && !player.crouch && !player.isDash) {
    const cx = player.x + player.w / 2;
    const bottom = player.y + player.h;
    player.w = HITBOX.stand.w;
    player.h = HITBOX.stand.h;
    player.x = cx - HITBOX.stand.w / 2;
    player.y = bottom - HITBOX.stand.h;
  }
}

// 玩家默认站立碰撞盒宽高（素材加载完成前用默认值，加载后由 updateHitboxTable 覆盖）
P.PW = 30; P.PH = 35; P.PC = 17;

function loadPlayerSprites() {
  for (const key of Object.keys(PLAYER_ANIMS)) {
    const base = `Assets/Assets-Clean/${PLAYER_ANIMS[key]}`;
    const entry = { img: new Image(), frames: [], fps: 10, loaded: false, maxW: 0, maxH: 0 };
    PLAYER_SPRITES[key] = entry;
    fetch(`${base}_frames.json`)
      .then(r => r.json())
      .then(data => {
        const rawFrames = data.frames || [];
        if (rawFrames.length > 0) {
          const fw = Math.max(...rawFrames.map(f => f.w));
          const fh = Math.max(...rawFrames.map(f => f.h));
          entry.maxW = fw; entry.maxH = fh;
          entry.frames = rawFrames.map((f, i) => ({
            x: i * fw + Math.round((fw - f.w) / 2),
            y: Math.round((fh - f.h) / 2),
            w: f.w,
            h: f.h,
          }));
        }
        entry.fps = data.fps || 10;
        updateHitboxTable();  // 素材加载完成后重算碰撞盒
      })
      .catch(() => { entry.frames = []; });
    entry.img.onload = () => { entry.loaded = true; };
    entry.img.src = `${base}_strip.png`;
  }
}
loadPlayerSprites();

// ==================== 近战挥砍刀光资源（Zero） ====================
const BLADE = { img: new Image(), loaded: false };
BLADE.img.onload = () => { BLADE.loaded = true; };
BLADE.img.src = 'Assets/blade.png';

// 根据玩家状态返回当前应播放的动画 key
function playerAnimKey(p, mx) {
  const shooting = p.shootHold > 0;  // 蓄力发射后进入射击状态；蓄力中(isChg)视为非射击状态
  const moving = mx !== 0;
  const airborne = !p.grounded || p.landing;   // 落地收尾期间仍算空中，继续播 jump/jumpShoot 尾段

  // 地面冲刺优先（高于下蹲）：仅 isDash（地面冲刺）播 dash；dashAir（空中冲刺跳）走 jump 分支
  if (p.isDash) {
    return shooting ? 'dashShoot' : 'dash';
  }
  if (p.crouch) return 'crouch';   // 下蹲（非冲刺时）
  // 冲刺结束锁：2 帧内强制地面动画，忽略 airborne 判定，避免碰撞盒切换临界帧闪 jump
  if (p.dashEndLock > 0) {
    if (moving) return shooting ? 'runShoot' : 'running';
    return shooting ? 'shoot' : 'stand';
  }
  if (airborne) {
    if (p.wallSlide) return 'climb';  // 只有正在贴墙滑行（按住方向键）才播 climb，松开方向键自由下落走 jump
    return shooting ? 'jumpShoot' : 'jump';
  }
  if (moving) return shooting ? 'runShoot' : 'running';
  return shooting ? 'shoot' : 'stand';
}

// 根据 power 取子弹类型 key
function bulletKeyByPower(power) {
  if (power === 2) return 'big';
  if (power === 1) return 'middle';
  return 'small';
}

const canvas = document.getElementById('game');
canvas.width = VW; canvas.height = VH;
const ctx = canvas.getContext('2d');

const keys = {};
let jPressed = false;  // J 键按下沿标志：仅 Zero 挥砍消费（长按不会持续触发）
let showHitboxes = false;  // 碰撞盒可视化开关（P 键切换）
window.addEventListener('keydown', e => {
  if ((e.key === 'j' || e.key === 'J') && !keys[e.key]) jPressed = true;
  keys[e.key] = true;
  if (e.key === ' ') e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.key] = false; });

// P 键切换碰撞盒可视化（仅在非编辑模式、无输入框聚焦时生效）
window.addEventListener('keydown', e => {
  if ((e.key === 'p' || e.key === 'P') && !editMode &&
      (document.activeElement === document.body || document.activeElement === canvas)) {
    showHitboxes = !showHitboxes;
  }
});

// ==================== 摄像机 ====================
const camera = { x: 0, y: 0, targetX: 0, zoom: 1.0 };

function updateCamera() {
  // 玩家在画面中央（摄像机坐标也是素材像素，视口范围需换算成素材像素尺度）
  const targetCX = player.x + player.w / 2;
  const targetCY = player.y + player.h / 2;
  const viewW = VW / VIEW_SCALE;   // 视口宽度换算为素材像素
  const viewH = VH / VIEW_SCALE;   // 视口高度换算为素材像素
  let idealX = targetCX - viewW / 2;
  let idealY = targetCY - viewH / 2;
  // 边界限制：以已放置砖块的包围盒为准（而非网格声明尺寸），
  // 镜头永不平移到砖块范围之外，避免露出无砖块的空白背景
  const bw = MAP_BOUNDS.maxX - MAP_BOUNDS.minX;
  const bh = MAP_BOUNDS.maxY - MAP_BOUNDS.minY;
  if (bw <= viewW) {
    idealX = MAP_BOUNDS.minX + (bw - viewW) / 2;  // 地图比视口窄：居中
  } else {
    idealX = Math.max(MAP_BOUNDS.minX, Math.min(MAP_BOUNDS.maxX - viewW, idealX));
  }
  if (bh <= viewH) {
    idealY = MAP_BOUNDS.minY + (bh - viewH) / 2;  // 地图比视口矮：居中
  } else {
    idealY = Math.max(MAP_BOUNDS.minY, Math.min(MAP_BOUNDS.maxY - viewH, idealY));
  }
  // 平滑跟随
  camera.x += (idealX - camera.x) * 0.12;
  camera.y += (idealY - camera.y) * 0.12;
}

// ==================== 大关卡 (100×16 Tile = 1400×224 素材像素) ====================
let LW = 100, LH = 16;
let MAP_W = LW * TILE; // 3200px

// 地图实际砖块边界（素材像素）：以已放置的砖块包围盒为准，而非网格声明尺寸。
// 因为关卡数据里网格常有留白（如左侧/底部空行），镜头边界必须跟着真实砖块走。
let MAP_BOUNDS = { minX: 0, maxX: MAP_W, minY: 0, maxY: LH * TILE };

// 扫描地图重算砖块包围盒。在地图初始化/加载/扩展/编辑放置删除砖块后调用。
function updateMapBounds() {
  let minCol = LW, maxCol = -1, minRow = LH, maxRow = -1;
  for (let r = 0; r < LH; r++) {
    for (let c = 0; c < LW; c++) {
      if (map[r * LW + c] !== 0) {
        if (c < minCol) minCol = c;
        if (c > maxCol) maxCol = c;
        if (r < minRow) minRow = r;
        if (r > maxRow) maxRow = r;
      }
    }
  }
  if (maxCol < 0) {
    // 地图上没有任何砖块：退化为网格边界
    MAP_BOUNDS = { minX: 0, maxX: LW * TILE, minY: 0, maxY: LH * TILE };
  } else {
    MAP_BOUNDS = {
      minX: minCol * TILE,
      maxX: (maxCol + 1) * TILE,
      minY: minRow * TILE,
      maxY: (maxRow + 1) * TILE,
    };
  }
}

// 动态扩展地图：当在边界外放置砖块时自动扩大
function expandMap(newCol, newRow) {
  const oldLW = LW, oldLH = LH;
  let newLW = LW, newLH = LH;
  let colOffset = 0, rowOffset = 0;

  if (newCol < 0) { colOffset = -newCol; newLW += colOffset; }
  if (newCol >= LW) { newLW = newCol + 1; }
  if (newRow < 0) { rowOffset = -newRow; newLH += rowOffset; }
  if (newRow >= LH) { newLH = newRow + 1; }

  if (newLW === LW && newLH === LH) return; // 无需扩展

  const newMap = new Array(newLH * newLW).fill(0);
  for (let r = 0; r < oldLH; r++) {
    for (let c = 0; c < oldLW; c++) {
      newMap[(r + rowOffset) * newLW + (c + colOffset)] = map[r * oldLW + c];
    }
  }
  map = newMap;
  LW = newLW;
  LH = newLH;
  MAP_W = LW * TILE;
  updateMapBounds();

  // 同步偏移所有敌人的坐标
  const px = colOffset * TILE;
  const py = rowOffset * TILE;
  for (const en of enemies) {
    en.x += px;
    en.y += py;
    en.baseY += py;
    if (en.pMin != null) { en.pMin += px; en.pMax += px; }
  }

  // 调整摄像机，保持画面内容不跳动
  camera.x += px;
  camera.y += py;
}

// 关卡分 4 个区域:
//   Tile 0~24:  起始峡谷 (平坦+阶梯)
//   Tile 25~49: 瀑布攀爬区 (多层平台+竖井)
//   Tile 50~74: 中层丛林 (开阔平台)
//   Tile 75~99: Boss巢穴 (封闭房间)

// ---- 关卡数据加载器 ----
// 支持两种方式:
//   1. 外部 level.json (fetch 加载，需要本地服务器)
//   2. 内联默认数据 (fallback)

let levelData = null;

function parseTileRule(rule, mapArray, lw, lh) {
  const val = rule.value ?? 1;
  const colStart = Array.isArray(rule.col) ? rule.col[0] : rule.col;
  const colEnd   = Array.isArray(rule.col) ? rule.col[1] : rule.col;
  const rowStart = Array.isArray(rule.row) ? rule.row[0] : rule.row;
  const rowEnd   = Array.isArray(rule.row) ? rule.row[1] : rule.row;

  for (let r = rowStart; r <= rowEnd; r++) {
    for (let c = colStart; c <= colEnd; c++) {
      if (r >= 0 && r < lh && c >= 0 && c < lw) {
        mapArray[r * lw + c] = val;
      }
    }
  }
}

function buildMapFromData(data) {
  const m = new Array(data.height * data.width).fill(0);
  for (const rule of data.tiles) {
    if (rule.comment) continue; // 跳过注释行
    parseTileRule(rule, m, data.width, data.height);
  }
  return m;
}

function spawnEnemiesFromData(data) {
  const result = [];
  for (const entry of data.enemies) {
    if (entry.comment) continue;
    result.push(mkEnemy(entry.type, entry.x, entry.y, entry.patrolMin, entry.patrolMax));
  }
  return result;
}

function loadLevel(jsonData) {
  levelData = jsonData;
  // 重建 map
  LW = jsonData.width;
  LH = jsonData.height;
  map = buildMapFromData(jsonData);
  MAP_W = LW * TILE;
  updateMapBounds();
  // 重建敌人
  enemies = spawnEnemiesFromData(jsonData);
  // 读取玩家出生点
  if (jsonData.playerSpawn) {
    player.x = jsonData.playerSpawn.x;
    player.y = jsonData.playerSpawn.y;
  }
}

function tile(x, y) {
  const c = Math.floor(x / TILE), r = Math.floor(y / TILE);
  if (c < 0 || c >= LW || r < 0 || r >= LH) return 1;
  return map[r * LW + c];
}

function overlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

// ==================== 全局列表 ====================
let bullets = [], eBullets = [], particles = [], afterimages = [], enemies = [];
let muzzleEffects = [];   // 枪口发射特效（out 动画，瞬时）
let hitEffects = [];      // 命中特效（hit 动画，瞬时，不延迟子弹移除）
let hitstop = 0;          // hitstop 全冻结剩余帧数（挥砍命中怪物时世界定格，仅 Zero）
let meleeHitEffects = []; // Zero 近战受击特效（通用 hit 动画，画在怪物上层，区别于 X 射击的 bullet-hit）
// 受击白色剪影用的离屏画布（source-in 涂白，只覆盖怪物形状本身）
const HIT_CANVAS_SIZE = 64, HIT_CANVAS_HALF = HIT_CANVAS_SIZE / 2;
const hitCanvas = document.createElement('canvas');
hitCanvas.width = hitCanvas.height = HIT_CANVAS_SIZE;
const hitCtx = hitCanvas.getContext('2d');

function spawnBullet(x, y, dir, power) {
  // 普通子弹 16×11（素材像素）；小蓄力 = 普通×1.5；满蓄力 = 普通×2.5
  const baseW = 16, baseH = 11; // 普通子弹碰撞体积（素材原始像素）
  const key = bulletKeyByPower(power);
  bullets.push({
    x, y: y + player.h / 2 - 2, vx: P.BULLET * dir, vy: 0,
    dir,                                     // 面朝方向（用于 sprite 镜像）
    w: power === 2 ? baseW * 2.5 : power === 1 ? baseW * 1.5 : baseW,
    h: power === 2 ? baseH * 2.5 : power === 1 ? baseH * 1.5 : baseH,
    power, dmg: DMG[power], life: 120,
    color: power === 2 ? '#ff4444' : power === 1 ? '#ffaa00' : '#ffff00',
    animT: 0,                                 // sprite 动画计时器
    type: key,                                // 子弹类型（用于取 flying sprite）
  });
  // 枪口发射特效（out 动画）：锚定在发射点，播放一遍后消失，不跟随子弹
  // small-bullet 无 out 状态，跳过
  spawnMuzzle(x, y + player.h / 2 - 2, dir, key);
}

// 枪口发射特效（out 动画），独立于子弹本体
function spawnMuzzle(x, y, dir, key) {
  const entry = BULLET_SPRITES[`${key}-out`];
  if (!entry || entry.frames.length === 0) return;  // small 无 out
  muzzleEffects.push({ x, y, dir, key, animT: 0 });
}

// 命中特效（hit 动画），独立的瞬时粒子，不延迟子弹移除
function spawnHitEffect(x, y, dir, key) {
  const entry = BULLET_SPRITES[`${key}-hit`];
  if (!entry || entry.frames.length === 0) return;
  hitEffects.push({ x, y, dir, key, animT: 0 });
}

// Zero 近战受击特效：通用 hit 动画，画在怪物上层（区别于 X 射击的 bullet-hit 特效）
function spawnMeleeHitEffect(x, y, dir) {
  const entry = BULLET_SPRITES['melee-hit'];
  if (!entry || entry.frames.length === 0) return;
  meleeHitEffects.push({ x, y, dir, animT: 0 });
}
function spawnEBullet(x, y, vx, vy) {
  eBullets.push({ x, y, vx, vy, w: 3, h: 3, life: 90 });
}
function spawnPart(x, y, n, col) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y, vx: (Math.random() - 0.5) * 1.75, vy: (Math.random() - 0.5) * 1.75 - 0.9,
      life: 15 + Math.random() * 15, color: col, size: 0.5 + Math.random() * 1.3,
    });
  }
}

// ==================== 怪物 ====================
const ET = {
  soldier: { name: '丛林兵', w: 16, h: 35, hp: 40, spd: 0.65, col: '#44aa44', eye: '#ffcc00', boss: false },
  bee:     { name: '机械蜂', w: 22, h: 35, hp: 24, spd: 0.8,  col: '#ffaa00', eye: '#ff4444', boss: false, amp: 10, fspd: 0.04 },
  floater: { name: '浮游炮', w: 20, h: 35, hp: 32, spd: 0.9,  col: '#aa44ff', eye: '#ff4444', boss: false, amp: 13, fspd: 0.03 },
  boss:    { name: 'Web Spider', w: 50, h: 50, hp: 320, spd: 1.1, col: '#8844cc', eye: '#ff00ff', boss: true },
};

function mkEnemy(type, x, y, pMin, pMax) {
  const t = ET[type];
  return {
    type, x, y, w: t.w, h: t.h, vx: 0, vy: 0, hp: t.hp, maxHp: t.hp,
    facing: 1, grounded: false,
    pMin: pMin ?? x - 35, pMax: pMax ?? x + 35,
    hurtT: 0, baseY: y, fp: Math.random() * Math.PI * 2,
    bossAtk: 0, bossJump: false, bossWeb: 0,
    meleeLock: 0,  // 挥砍命中冷却：命中帧 + 5 帧无伤害（6 帧后可再命中，仅 Zero 近战使用）
  };
}

function spawnAll() {
  enemies = [];
  // 优先用 levelData (如果已加载外部 JSON)，否则用 DEFAULT_LEVEL
  const data = levelData || DEFAULT_LEVEL;
  enemies = spawnEnemiesFromData(data);
}

// ==================== 怪物 AI ====================
function ai(en) {
  const t = ET[en.type];
  const dx = player.x - en.x, dy = player.y - en.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (en.hurtT > 0) en.hurtT--;
  if (en.meleeLock > 0) en.meleeLock--;

  if (!t.boss) {
    const inRange = dist < 110;
    if (en.type === 'bee' || t.amp) {
      en.fp += (t.fspd || 0.04);
      en.y = en.baseY + Math.sin(en.fp) * (t.amp || 10);
      if (inRange) {
        en.x += (dx > 0 ? 1 : -1) * t.spd;
        en.facing = dx > 0 ? 1 : -1;
      }
    } else {
      if (inRange && dist < 70) {
        en.facing = dx > 0 ? 1 : -1;
        en.vx = en.facing * t.spd * 1.3;
      } else {
        en.vx = en.facing * t.spd;
        if (en.x <= en.pMin) { en.facing = 1; en.vx = t.spd; }
        if (en.x >= en.pMax) { en.facing = -1; en.vx = -t.spd; }
      }
    }
  }

  // Boss
  if (t.boss) {
    const phase2 = en.hp < en.maxHp * 0.5;
    en.bossAtk++;

    if (en.bossJump) {
      en.vy += GRAVITY;
      en.y += en.vy;
      const br = { x: en.x, y: en.y + en.vy, w: en.w, h: en.h };
      for (let r = 0; r < LH; r++) for (let c = 0; c < LW; c++) {
        if (map[r * LW + c] === 0) continue;
        if (overlap(br, { x: c * TILE, y: r * TILE, w: TILE, h: TILE }) && en.vy > 0) {
          en.y = r * TILE - en.h; en.vy = 0; en.bossJump = false; en.grounded = true;
          spawnPart(en.x + en.w / 2, en.y + en.h, 12, '#cc44ff');
        }
      }
      if (en.y > VH / VIEW_SCALE + 40) { en.y = 50; en.vy = 0; en.bossJump = false; }
    } else {
      en.facing = dx > 0 ? 1 : -1;
      const spd = phase2 ? t.spd * 1.4 : t.spd;
      en.vx = en.facing * spd;
      en.x += en.vx;

      const interval = phase2 ? 100 : 160;
      if (en.bossAtk >= interval && en.grounded) {
        en.bossAtk = 0;
        en.bossJump = true;
        en.vy = phase2 ? -6.5 : -5.2;
        en.grounded = false;
        en.vx = en.facing * spd * 2;
        en.x += en.vx;
        spawnPart(en.x + en.w / 2, en.y + en.h, 8, '#cc44ff');
      }
    }

    en.bossWeb++;
    if (en.bossWeb >= (phase2 ? 30 : 50)) {
      en.bossWeb = 0;
      const ex = en.x + en.w / 2, ey = en.y + en.h / 2;
      const adx = player.x + player.w / 2 - ex, ady = player.y + player.h / 2 - ey;
      const ad = Math.sqrt(adx * adx + ady * ady) || 1;
      spawnEBullet(ex, ey, (adx / ad) * 1.5, (ady / ad) * 1.5);
    }
  }

  en.x = Math.max(0, Math.min(MAP_W - en.w, en.x));
}

// ==================== 怪物物理 ====================
function enPhys(en) {
  const t = ET[en.type];
  if (en.type === 'bee' || t.amp) return;
  if (!t.boss || !en.bossJump) { en.vy += GRAVITY; if (en.vy > MAX_FALL) en.vy = MAX_FALL; }

  en.x += en.vx;
  const xr = { x: en.x, y: en.y, w: en.w, h: en.h };
  for (let r = 0; r < LH; r++) for (let c = 0; c < LW; c++) {
    if (map[r * LW + c] === 0) continue;
    const tl = { x: c * TILE, y: r * TILE, w: TILE, h: TILE };
    if (overlap(xr, tl)) {
      if (en.vx > 0) en.x = tl.x - en.w; else if (en.vx < 0) en.x = tl.x + tl.w;
      en.vx = 0;
    }
  }
  en.y += en.vy;
  const yr = { x: en.x, y: en.y, w: en.w, h: en.h };
  en.grounded = false;
  for (let r = 0; r < LH; r++) for (let c = 0; c < LW; c++) {
    if (map[r * LW + c] === 0) continue;
    const tl = { x: c * TILE, y: r * TILE, w: TILE, h: TILE };
    if (overlap(yr, tl)) {
      if (en.vy > 0) { en.y = tl.y - en.h; en.vy = 0; en.grounded = true; }
      else if (en.vy < 0) { en.y = tl.y + tl.h; en.vy = 0; }
    }
  }
}

// ==================== 伤害 ====================
function dmgEnemy(en, d) {
  const hx = en.x + en.w / 2, hy = en.y + en.h / 2;
  en.hp -= d; en.hurtT = 2; // 受击闪白 2 帧（约 33ms），快速一闪后恢复原色
  spawnPart(hx, hy, d * 2, '#fff');
  if (en.hp <= 0) {
    spawnPart(en.x + en.w / 2, en.y + en.h / 2, ET[en.type].boss ? 40 : 20, ET[en.type].col);
    return true;
  }
  return false;
}
function dmgPlayer(d) {
  if (player.invT > 0) return;
  player.hp -= d; player.invT = P.INV;
  spawnPart(player.x + player.w / 2, player.y + player.h / 2, 8, '#f44');
  if (player.hp <= 0) player.hp = 0;
}

    facing: p.facing, grounded: p.grounded, onWall: p.onWall, wallSlide: p.wallSlide,

  };
}

function restorePlayer(s) {
  Object.assign(player, s);
}

function switchCharacter(name) {
  if (name === curChar) return;
  // 保存当前角色状态
  charStates[curChar] = snapshotPlayer();
  // 恢复目标角色状态（无快照则初始化为出生点）
  if (charStates[name]) {
    restorePlayer(charStates[name]);
  } else {
    const sp = getPlayerSpawn();
    restorePlayer({
      x: sp.x, y: sp.y, vx: 0, vy: 0, w: HITBOX.stand.w, h: HITBOX.stand.h,
      facing: 1, grounded: false, onWall: 0, wallSlide: false,
      isDash: false, dashT: 0, dashDir: 0, dashReady: false, dashAir: false,
      dashEndLock: 0,
      chgT: 0, isChg: false, shootHold: 0, wjLock: 0, wjDir: 0,
      kCon: false, lCon: false, invT: 0, hp: P.MAX_HP, landing: false,
      crouch: false, forcedCrouch: false,
      animF: 0, animT: 0, animKey: '',
      melee: 0, meleeCd: 0, meleeCombo: 0, meleeReset: 0, meleeFinalLock: 0, meleeCurStage: 1,
    });
    charStates[name] = snapshotPlayer();
  }
  curChar = name;
  // 切换时清空全局子弹/特效残留

}
