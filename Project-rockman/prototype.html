<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rockman X4 - 丛林关卡</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    font-family: 'Courier New', monospace;
    color: #e0e0e0;
    user-select: none;
    position: relative;
  }
  canvas { border: 2px solid #4a4a6a; image-rendering: pixelated; }
  #ui { display: flex; gap: 40px; margin-top: 12px; align-items: flex-start; }
  #controls-info { font-size: 12px; line-height: 1.6; color: #888; }
  #controls-info span.key {
    display: inline-block; background: #333; color: #ffcc00;
    padding: 2px 6px; border-radius: 3px; margin: 0 2px;
    font-weight: bold; min-width: 20px; text-align: center;
  }
  #debug-panel { font-size: 11px; line-height: 1.5; color: #666; min-width: 180px; }
  #debug-panel .label { color: #888; }
  #debug-panel .value { color: #4fc3f7; }
  h2 { font-size: 14px; color: #ffcc00; margin-bottom: 8px; letter-spacing: 2px; }
  /* 编辑器面板 */
  #editor-panel {
    display: none; position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    background: #1a1a2e; border: 2px solid #ffcc00;
    padding: 16px; z-index: 10; width: 700px; max-height: 80vh; overflow-y: auto;
    font-family: 'Courier New', monospace; font-size: 12px;
  }
  #editor-panel.active { display: block; }
  #editor-panel textarea {
    width: 100%; height: 300px; background: #0d0d1a; color: #4fc3f7;
    border: 1px solid #444; padding: 8px; font-family: 'Courier New', monospace;
    font-size: 11px; resize: vertical;
  }
  #editor-panel button {
    background: #333; color: #ffcc00; border: 1px solid #ffcc00;
    padding: 6px 14px; margin: 4px; cursor: pointer; font-family: inherit; font-size: 12px;
  }
  #editor-panel button:hover { background: #555; }
  #editor-panel button.danger { color: #ff4444; border-color: #ff4444; }
  #editor-toolbar {
    display: none; position: absolute; top: 8px; right: 8px;
    background: rgba(0,0,0,0.8); border: 1px solid #ffcc00;
    padding: 6px 10px; z-index: 5; font-family: 'Courier New', monospace; font-size: 11px;
  }
  #editor-toolbar.active { display: flex; gap: 8px; align-items: center; }
  #editor-toolbar .mode-btn { padding: 3px 8px; cursor: pointer; border: 1px solid #888; background: #222; color: #aaa; border-radius: 2px; }
  #editor-toolbar .mode-btn.sel { background: #ffcc00; color: #111; border-color: #ffcc00; }
  #editor-toolbar select { background: #222; color: #ffcc00; border: 1px solid #888; padding: 2px 4px; font: inherit; }
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="editor-toolbar">
  <span style="color:#ffcc00">编辑模式</span>
  <button class="mode-btn sel" data-mode="tile" id="btn-tile">砖块</button>
  <button class="mode-btn" data-mode="enemy" id="btn-enemy">敌人</button>
  <button class="mode-btn" data-mode="player" id="btn-player">玩家出生点</button>
  <select id="enemy-type" style="display:none">
    <option value="soldier">丛林兵</option>
    <option value="bee">机械蜂</option>
    <option value="floater">浮游炮</option>
    <option value="boss">Boss</option>
  </select>
  <select id="tile-size" style="display:none">
    <option value="small">小砖块 28×28</option>
    <option value="big">大砖块 56×56</option>
  </select>
  <span style="color:#888;font-size:10px">左键=放置 右键=删除 中键拖动=平移 滚轮=缩放 Ctrl+S=导出</span>
  <button style="margin-left:8px;color:#f44;border-color:#f44" id="btn-exit-edit">退出编辑</button>
</div>
<div id="editor-panel">
  <h2 style="margin-top:0">导出关卡 JSON</h2>
  <p style="color:#888;margin:0 0 8px">复制下面的 JSON 内容，粘贴到 level.json 文件中保存即可。</p>
  <textarea id="json-output" readonly></textarea>
  <div style="margin-top:8px">
    <button id="btn-copy">复制到剪贴板</button>
    <button id="btn-export-download">下载 JSON 文件</button>
    <button id="btn-close-panel">关闭</button>
  </div>
</div>
<div id="ui">
  <div>
    <h2>操作说明</h2>
    <div id="controls-info">
      <span class="key">A</span><span class="key">D</span> 移动 &nbsp;
      <span class="key">K</span> 跳跃<br>
      <span class="key">J</span> 射击/蓄力 &nbsp;
      <span class="key">L</span> 冲刺<br>
      <span class="key">S</span> 下蹲<br>
      <span class="key">空格</span> 重置<br>
      <span class="key">E</span> 编辑模式 &nbsp;
      <span class="key">Ctrl+S</span> 导出<br><br>
      普通弹=1 小蓄力=3 大蓄力=6<br>
      卷轴关卡: 峡谷→瀑布→丛林→Boss巢穴
    </div>
  </div>
  <div id="debug-panel">
    <h2>状态</h2>
    <div style="margin-bottom:4px">
      <button id="btn-char-x" class="char-btn" style="background:#24a;color:#fff;border:1px solid #888;padding:2px 8px;cursor:pointer">X</button>
      <button id="btn-char-zero" class="char-btn" style="background:#c22;color:#fff;border:1px solid #888;padding:2px 8px;cursor:pointer">Zero</button>
    </div>
    <div><span class="label">角色:</span> <span class="value" id="db-char">X</span></div>
    <div><span class="label">HP:</span> <span class="value" id="db-hp">28/28</span></div>
    <div><span class="label">蓄力:</span> <span class="value" id="db-charge">0%</span></div>
    <div><span class="label">怪物:</span> <span class="value" id="db-enemies">-</span></div>
    <div><span class="label">进度:</span> <span class="value" id="db-pos">0%</span></div>
  </div>
</div>

<script>
// ==================== 常量 ====================
const VW = 800, VH = 500;  // 视口大小（屏幕像素，不参与世界缩放）

// 世界缩放系数：素材原始像素 → 屏幕像素 的固定放大倍数（唯一的世界尺寸缩放口径）。
// 所有游戏世界坐标/尺寸/物理量一律以「素材原始像素」为单位，渲染时在最外层乘回 VIEW_SCALE 放大到屏幕。
// 取 2.3 作为干净近似值（原精确值为 80/35≈2.286，允许极小误差，见 README 约定）。
const VIEW_SCALE = 2.3;

const GRAVITY = 0.24, MAX_FALL = 5.2, TILE = 28;   // 小砖块尺寸（素材像素）
const TILE_BIG = 56;                                  // 大砖块尺寸 = TILE * 2

const P = {
  PW: 30, PH: 35,
  PC: 17,           // 下蹲/冲刺碰撞盒高度
  SPEED: 1.75, JUMP: -6.84,  // 一段跳高度：当前 -5.7 再提高 1.2 倍（初速度 -5.7×1.2 = -6.84）
  JUMP2: 0,                   // 二段跳初速（=JUMP×0.8，随基准同步提高；下方初始化赋值）
  WALL_SLIDE: 0.65, WALL_JUMP_X: 2.4, WALL_JUMP_Y: -4.4,
  DASH_MULT: 1.75, DASH_TIME: 21,  // dash 移速倍率；最大时长 21 帧(0.35s) = 原 1.5 倍速跑完 56px 距离所需时间
  CHG1: 6, CHG2: 60,
  BULLET: 6.1,
  INV: 30, WALL_LOCK: 6,
  MAX_HP: 28,
};
P.JUMP2 = P.JUMP * 0.8;  // 二段跳初速：一段跳的 0.8 倍（随 JUMP 基准同步提高）
const DMG = { 0: 1, 1: 3, 2: 6 };

// ==================== 子弹 Sprite 资源 ====================
// 子弹类型 → 状态 → 资源。每种子弹有 flying(循环)/hit(瞬时)/out(枪口瞬时) 三个状态。
// 显示缩放：以资源真实尺寸为基准，映射到游戏里的显示尺寸（displayScale）。
// 帧数据来自 {type}-{state}_frames.json 的 frames[]，加载时按 strip 排版规则重算为 strip 图里的源裁剪坐标。
const BULLET_TYPE = {
  small:  { power: 0, baseW: 16, baseH: 11, displayScale: 1.0 },
  middle: { power: 1, baseW: 24, baseH: 16, displayScale: 1.0 },
  big:    { power: 2, baseW: 39, baseH: 26, displayScale: 1.0 },
};
const BULLET_SPRITES = {};  // key: `${type}-${state}` -> { img, frames, fps, loaded }

// 资源配置表：子弹类型 → 状态列表
const BULLET_STATES = {
  small:  { states: ['flying', 'hit'],             type: 'small-bullet' },
  middle: { states: ['flying', 'hit', 'out'],      type: 'middle-bullet' },
  big:    { states: ['flying', 'hit', 'out'],      type: 'big-bullet' },
};

// 加载所有子弹的 strip 图 + frames.json
function loadBulletSprites() {
  for (const key of Object.keys(BULLET_STATES)) {
    const { type, states } = BULLET_STATES[key];
    for (const state of states) {
      const base = `Assets/Assets-Clean/${type}-${state}`;
      const entry = { img: new Image(), frames: [], fps: 10, loaded: false };
      BULLET_SPRITES[`${key}-${state}`] = entry;
      // 加载帧数据
      fetch(`${base}_frames.json`)
        .then(r => r.json())
        .then(data => {
          // _frames.json 里的 frames[] 坐标是相对原图(clean.png)的绝对位置，
          // 但实际渲染用的是 strip.png（等宽条带），需要按 strip 排版规则重算每帧在 strip 里的源裁剪坐标。
          // strip 规则(与 sprite-build.js 一致)：等宽 fw=max(w)，条带高 fh=max(h)，每帧水平/垂直居中。
          const rawFrames = data.frames || [];
          if (rawFrames.length > 0) {
            const fw = Math.max(...rawFrames.map(f => f.w));
            const fh = Math.max(...rawFrames.map(f => f.h));
            entry.frames = rawFrames.map((f, i) => ({
              x: i * fw + Math.round((fw - f.w) / 2),  // strip 里水平居中后的 x
              y: Math.round((fh - f.h) / 2),           // strip 里垂直居中后的 y
              w: f.w,
              h: f.h,
            }));
          }
          entry.fps = data.fps || 10;
        })
        .catch(() => { entry.frames = []; });
      entry.img.onload = () => { entry.loaded = true; };
      entry.img.src = `${base}_strip.png`;
    }
  }
  // 通用受击特效（Zero 近战命中专用）：Assets/Assets-Clean/hit2_strip.png + hit2_frames.json
  {
    const base = 'Assets/Assets-Clean/hit2';
    const entry = { img: new Image(), frames: [], fps: 10, loaded: false };
    BULLET_SPRITES['melee-hit'] = entry;
    fetch(`${base}_frames.json`)
      .then(r => r.json())
      .then(data => {
        const rawFrames = data.frames || [];
        if (rawFrames.length > 0) {
          const fw = Math.max(...rawFrames.map(f => f.w));
          const fh = Math.max(...rawFrames.map(f => f.h));
          entry.frames = rawFrames.map((f, i) => ({
            x: i * fw + Math.round((fw - f.w) / 2),  // strip 里水平居中后的 x
            y: Math.round((fh - f.h) / 2),           // strip 里垂直居中后的 y
            w: f.w,
            h: f.h,
          }));
        }
        entry.fps = data.fps || 10;
      })
      .catch(() => { entry.frames = []; });
    entry.img.onload = () => { entry.loaded = true; };
    entry.img.src = `${base}_strip.png`;
  }
}
loadBulletSprites();

// ==================== 角色 Sprite 资源 ====================
// 角色动画状态 → 资源文件前缀（与 idle-*.json/png 对应）
// 缩放基准：以站立帧高度为基准，等比放大到碰撞盒高度 PH(80px)。
const PLAYER_ANIMS = {
  stand:     'idle-stand',
  shoot:     'idle-shoot',
  running:   'idle-running',
  jump:      'idle-jump',
  dash:      'idle-dash',
  climb:     'idle-climb',
  crouch:    'idle-crouch',
  runShoot:  'idle-running&shoot',
  jumpShoot: 'idle-jump&shoot',
  dashShoot: 'idle-dash&shoot',
};
const PLAYER_SPRITES = {};  // key -> { img, frames, fps, loaded, maxW, maxH }
// 玩家素材直接以「原始像素」作为世界坐标，不再额外放大（缩放统一由渲染层 VIEW_SCALE 负责）
const SPRITE_SCALE = 1.0;

// 各状态碰撞盒规格（素材原始像素，即世界坐标）。
// 碰撞盒 A（站立）= 站立素材最大宽高；碰撞盒 B（定制）= 宽取 dash 素材最大宽，高取 crouch 素材最大高。
// 具体宽高在素材加载完成后由 updateHitboxTable() 根据实际 maxW/maxH 计算。
const HITBOX = {
  stand:   { w: 0, h: 0 },  // 碰撞盒 A（站立）：30×35
  jump:    { w: 0, h: 0 },  // 跳跃：与站立相同（碰撞盒 A）
  dash:    { w: 0, h: 0 },  // 碰撞盒 B（定制）：38×27（宽=dash，高=crouch）
  crouch:  { w: 0, h: 0 },  // 下蹲：碰撞盒 B
};

// 根据已加载的素材 maxW/maxH 计算各状态碰撞盒
function updateHitboxTable() {
  const stand = PLAYER_SPRITES.stand;
  const dash = PLAYER_SPRITES.dash;
  const crouch = PLAYER_SPRITES.crouch;
  // 碰撞盒 A：站立素材最大宽高
  const standW = (stand && stand.maxW ? stand.maxW : 30) * SPRITE_SCALE;
  const standH = (stand && stand.maxH ? stand.maxH : 35) * SPRITE_SCALE;
  // 碰撞盒 B：宽 = dash 素材最大宽，高 = crouch 素材最大高
  const dashW = (dash && dash.maxW ? dash.maxW : 38) * SPRITE_SCALE;
  const crouchH = (crouch && crouch.maxH ? crouch.maxH : 27) * SPRITE_SCALE;

  HITBOX.stand.w = standW;
  HITBOX.stand.h = standH;
  HITBOX.jump.w = standW;          // 跳跃碰撞盒 = 站立（碰撞盒 A）
  HITBOX.jump.h = standH;
  HITBOX.dash.w = dashW;           // 碰撞盒 B 宽 = dash 素材最大宽
  HITBOX.dash.h = crouchH;         // 碰撞盒 B 高 = crouch 素材最大高
  HITBOX.crouch.w = dashW;         // 下蹲用碰撞盒 B（与 dash 同宽）
  HITBOX.crouch.h = crouchH;

  // 同步 P 常量（站立宽/高），供编辑器出生点/子弹口等引用
  P.PW = Math.round(standW);
  P.PH = Math.round(standH);
  P.PC = Math.round(standH / 2);

  // 若玩家已创建且当前处于站立状态（非下蹲/非冲刺），同步其碰撞盒到新站立值
  if (typeof player !== 'undefined' && !player.crouch && !player.isDash) {
    const cx = player.x + player.w / 2;
    const bottom = player.y + player.h;
    player.w = HITBOX.stand.w;
    player.h = HITBOX.stand.h;
    player.x = cx - HITBOX.stand.w / 2;
    player.y = bottom - HITBOX.stand.h;
  }
}

// 玩家默认站立碰撞盒宽高（素材加载完成前用默认值，加载后由 updateHitboxTable 覆盖）
P.PW = 30; P.PH = 35; P.PC = 17;

function loadPlayerSprites() {
  for (const key of Object.keys(PLAYER_ANIMS)) {
    const base = `Assets/Assets-Clean/${PLAYER_ANIMS[key]}`;
    const entry = { img: new Image(), frames: [], fps: 10, loaded: false, maxW: 0, maxH: 0 };
    PLAYER_SPRITES[key] = entry;
    fetch(`${base}_frames.json`)
      .then(r => r.json())
      .then(data => {
        const rawFrames = data.frames || [];
        if (rawFrames.length > 0) {
          const fw = Math.max(...rawFrames.map(f => f.w));
          const fh = Math.max(...rawFrames.map(f => f.h));
          entry.maxW = fw; entry.maxH = fh;
          entry.frames = rawFrames.map((f, i) => ({
            x: i * fw + Math.round((fw - f.w) / 2),
            y: Math.round((fh - f.h) / 2),
            w: f.w,
            h: f.h,
          }));
        }
        entry.fps = data.fps || 10;
        updateHitboxTable();  // 素材加载完成后重算碰撞盒
      })
      .catch(() => { entry.frames = []; });
    entry.img.onload = () => { entry.loaded = true; };
    entry.img.src = `${base}_strip.png`;
  }
}
loadPlayerSprites();

// ==================== 近战挥砍刀光资源（Zero） ====================
const BLADE = { img: new Image(), loaded: false };
BLADE.img.onload = () => { BLADE.loaded = true; };
BLADE.img.src = 'Assets/blade.png';

// blade1-1 / blade1-2 / blade1-3：Zero 三段斩击各自的序列帧刀光（资源方向为角色面朝右，朝左时水平镜像）
// 加载 Assets-Clean 下的 strip + frames.json，坐标按 strip 规则重算（x = 帧序号×帧宽 + 水平居中偏移，y = 垂直居中偏移）
// 第 1 段 → blade1-1；第 2 段 → blade1-2（空中挥砍固定第 2 段，同样用它）；第 3 段 → blade1-3
function loadBladeStrip(key) {
  const entry = { img: new Image(), frames: [], fw: 1, fh: 1, fps: 10, loaded: false };
  entry.img.onload = () => { entry.loaded = true; };
  fetch(`Assets/Assets-Clean/${key}_frames.json`)
    .then(r => r.json())
    .then(data => {
      const rawFrames = data.frames || [];
      entry.fps = data.fps || 10;
      if (rawFrames.length > 0) {
        const fw = Math.max(...rawFrames.map(f => f.w));
        const fh = Math.max(...rawFrames.map(f => f.h));
        entry.fw = fw;
        entry.fh = fh;
        entry.frames = rawFrames.map((f, i) => ({
          x: i * fw + Math.round((fw - f.w) / 2),  // strip 里水平居中后的 x
          y: Math.round((fh - f.h) / 2),           // strip 里垂直居中后的 y
          w: f.w,
          h: f.h,
        }));
      }
    })
    .catch(() => { entry.frames = []; });
  entry.img.src = `Assets/Assets-Clean/${key}_strip.png`;
  return entry;
}
// 三段斩击刀光资源：索引 0/1/2 对应第 1/2/3 段
const BLADE1 = [loadBladeStrip('blade1-1'), loadBladeStrip('blade1-2'), loadBladeStrip('blade1-3')];
// 上劈刀光资源：up-blade（7 帧斜上挥砍，右对齐绘制）
const UP_BLADE = loadBladeStrip('up-blade');
// 升龙斩刀光资源：up-shoryu（6 帧升龙弧光，素材为角色面朝左侧的动画，左对齐绘制）
const UP_SHORYU = loadBladeStrip('up-shoryu');
// 圆月斩刀光资源：air-blade（8 帧空中圆月斩，素材为角色面朝右侧，左侧镜像对称）
const AIR_BLADE = loadBladeStrip('air-blade');
// 滞空斩刀光资源：blast-blade（5 帧第一部分）+ blast-blade2（3 帧第二部分）
const BLAST_BLADE = loadBladeStrip('blast-blade');
const BLAST_BLADE2 = loadBladeStrip('blast-blade2');
// 下劈斩刀光资源：down-blade（7 帧循环，向下前方斜劈）
const DOWN_BLADE = loadBladeStrip('down-blade');
// 冲刺斩刀光资源：dash-blade2（8 帧序列帧，向右冲刺斩，向左镜像）
const DASH_BLADE = loadBladeStrip('dash-blade2');
// 旋风斩刀光资源：storm-blade（4 帧环绕旋风刀光，中心对齐角色）
const STORM_BLADE = loadBladeStrip('storm-blade');
// 斩击波资源：storm-blade2（单帧 360° 斩击波，去白底透明整图，无 strip）
function loadStormBlade2() {
  const entry = { img: new Image(), frames: [], fw: 1, fh: 1, fps: 10, loaded: false };
  entry.img.onload = () => { entry.loaded = true; };
  fetch('Assets/Assets-Clean/storm-blade2_frames.json')
    .then(r => r.json())
    .then(data => {
      const rawFrames = data.frames || [];
      entry.fps = data.fps || 10;
      if (rawFrames.length > 0) {
        entry.fw = rawFrames[0].w;
        entry.fh = rawFrames[0].h;
        // 单帧整图：坐标直接用 frames.json 里的（x=0,y=0,w,h）
        entry.frames = rawFrames.map(f => ({ x: f.x, y: f.y, w: f.w, h: f.h }));
      }
    })
    .catch(() => { entry.frames = []; });
  entry.img.src = 'Assets/Assets-Clean/storm-blade2_clean.png';
  return entry;
}
const STORM_BLADE2 = loadStormBlade2();
// 根据玩家当前挥砍段数取对应刀光资源（meleeCurStage 1/2/3，空中固定 2 → blade1-2）
function bladeEntryFor(p) {
  const idx = Math.max(0, Math.min(p.meleeCurStage - 1, BLADE1.length - 1));
  return BLADE1[idx];
}

// 根据玩家状态返回当前应播放的动画 key
function playerAnimKey(p, mx) {
  const shooting = p.shootHold > 0;  // 蓄力发射后进入射击状态；蓄力中(isChg)视为非射击状态
  const moving = mx !== 0;
  const airborne = !p.grounded || p.landing;   // 落地收尾期间仍算空中，继续播 jump/jumpShoot 尾段

  // 冲刺斩 / 下劈斩：持续读取 dash 动画（第二帧定格，见动画状态机）
  if (p.dashAtkT > 0 || p.downT > 0) {
    return 'dash';
  }
  // 地面冲刺优先（高于下蹲）：仅 isDash（地面冲刺）播 dash；dashAir（空中冲刺跳）走 jump 分支
  if (p.isDash) {
    return shooting ? 'dashShoot' : 'dash';
  }
  if (p.crouch) return 'crouch';   // 下蹲（非冲刺时）
  // 冲刺结束锁：2 帧内强制地面动画，忽略 airborne 判定，避免碰撞盒切换临界帧闪 jump
  if (p.dashEndLock > 0) {
    if (moving) return shooting ? 'runShoot' : 'running';
    return shooting ? 'shoot' : 'stand';
  }
  if (airborne) {
    if (p.wallSlide) return 'climb';  // 只有正在贴墙滑行（按住方向键）才播 climb，松开方向键自由下落走 jump
    return shooting ? 'jumpShoot' : 'jump';
  }
  if (moving) return shooting ? 'runShoot' : 'running';
  return shooting ? 'shoot' : 'stand';
}

// 根据 power 取子弹类型 key
function bulletKeyByPower(power) {
  if (power === 2) return 'big';
  if (power === 1) return 'middle';
  return 'small';
}

// ==================== 摄像机 ====================
const camera = { x: 0, y: 0, targetX: 0, zoom: 0.7 };   // 默认镜头缩放 70%（视野更大）

function updateCamera() {
  // 玩家在画面中央（摄像机坐标也是素材像素，视口范围需换算成素材像素尺度）
  const targetCX = player.x + player.w / 2;
  const targetCY = player.y + player.h / 2;
  const viewW = VW / (camera.zoom * VIEW_SCALE);   // 视口宽度换算为素材像素（随 zoom 变化）
  const viewH = VH / (camera.zoom * VIEW_SCALE);   // 视口高度换算为素材像素（随 zoom 变化）
  let idealX = targetCX - viewW / 2;
  let idealY = targetCY - viewH / 2;
  // 边界限制：以已放置砖块的包围盒为准（而非网格声明尺寸），
  // 镜头永不平移到砖块范围之外，避免露出无砖块的空白背景
  const bw = MAP_BOUNDS.maxX - MAP_BOUNDS.minX;
  const bh = MAP_BOUNDS.maxY - MAP_BOUNDS.minY;
  if (bw <= viewW) {
    idealX = MAP_BOUNDS.minX + (bw - viewW) / 2;  // 地图比视口窄：居中
  } else {
    idealX = Math.max(MAP_BOUNDS.minX, Math.min(MAP_BOUNDS.maxX - viewW, idealX));
  }
  if (bh <= viewH) {
    idealY = MAP_BOUNDS.minY + (bh - viewH) / 2;  // 地图比视口矮：居中
  } else {
    idealY = Math.max(MAP_BOUNDS.minY, Math.min(MAP_BOUNDS.maxY - viewH, idealY));
  }
  // 平滑跟随
  camera.x += (idealX - camera.x) * 0.12;
  camera.y += (idealY - camera.y) * 0.12;
}

// ==================== 大关卡 (100×16 Tile = 1400×224 素材像素) ====================
let LW = 100, LH = 16;
let MAP_W = LW * TILE; // 3200px

// 地图实际砖块边界（素材像素）：以已放置的砖块包围盒为准，而非网格声明尺寸。
// 因为关卡数据里网格常有留白（如左侧/底部空行），镜头边界必须跟着真实砖块走。
let MAP_BOUNDS = { minX: 0, maxX: MAP_W, minY: 0, maxY: LH * TILE };

// 扫描地图重算砖块包围盒。在地图初始化/加载/扩展/编辑放置删除砖块后调用。
function updateMapBounds() {
  let minCol = LW, maxCol = -1, minRow = LH, maxRow = -1;
  for (let r = 0; r < LH; r++) {
    for (let c = 0; c < LW; c++) {
      if (map[r * LW + c] !== 0) {
        if (c < minCol) minCol = c;
        if (c > maxCol) maxCol = c;
        if (r < minRow) minRow = r;
        if (r > maxRow) maxRow = r;
      }
    }
  }
  if (maxCol < 0) {
    // 地图上没有任何砖块：退化为网格边界
    MAP_BOUNDS = { minX: 0, maxX: LW * TILE, minY: 0, maxY: LH * TILE };
  } else {
    MAP_BOUNDS = {
      minX: minCol * TILE,
      maxX: (maxCol + 1) * TILE,
      minY: minRow * TILE,
      maxY: (maxRow + 1) * TILE,
    };
  }
}

// 动态扩展地图：当在边界外放置砖块时自动扩大
function expandMap(newCol, newRow) {
  const oldLW = LW, oldLH = LH;
  let newLW = LW, newLH = LH;
  let colOffset = 0, rowOffset = 0;

  if (newCol < 0) { colOffset = -newCol; newLW += colOffset; }
  if (newCol >= LW) { newLW = newCol + 1; }
  if (newRow < 0) { rowOffset = -newRow; newLH += rowOffset; }
  if (newRow >= LH) { newLH = newRow + 1; }

  if (newLW === LW && newLH === LH) return; // 无需扩展

  const newMap = new Array(newLH * newLW).fill(0);
  for (let r = 0; r < oldLH; r++) {
    for (let c = 0; c < oldLW; c++) {
      newMap[(r + rowOffset) * newLW + (c + colOffset)] = map[r * oldLW + c];
    }
  }
  map = newMap;
  LW = newLW;
  LH = newLH;
  MAP_W = LW * TILE;
  updateMapBounds();

  // 同步偏移所有敌人的坐标
  const px = colOffset * TILE;
  const py = rowOffset * TILE;
  for (const en of enemies) {
    en.x += px;
    en.y += py;
    en.baseY += py;
    if (en.pMin != null) { en.pMin += px; en.pMax += px; }
  }

  // 调整摄像机，保持画面内容不跳动
  camera.x += px;
  camera.y += py;
}

// ---- 关卡数据加载器 ----

//   1. 外部 level.json (fetch 加载，需要本地服务器)
//   2. 内联默认数据 (fallback)

let levelData = null;

function parseTileRule(rule, mapArray, lw, lh) {
  const val = rule.value ?? 1;
  const colStart = Array.isArray(rule.col) ? rule.col[0] : rule.col;
  const colEnd   = Array.isArray(rule.col) ? rule.col[1] : rule.col;
  const rowStart = Array.isArray(rule.row) ? rule.row[0] : rule.row;
  const rowEnd   = Array.isArray(rule.row) ? rule.row[1] : rule.row;

  for (let r = rowStart; r <= rowEnd; r++) {
    for (let c = colStart; c <= colEnd; c++) {
      if (r >= 0 && r < lh && c >= 0 && c < lw) {
        mapArray[r * lw + c] = val;
      }
    }
  }
}

function buildMapFromData(data) {
  const m = new Array(data.height * data.width).fill(0);
  for (const rule of data.tiles) {
    if (rule.comment) continue; // 跳过注释行
    parseTileRule(rule, m, data.width, data.height);
  }
  return m;
}

function spawnEnemiesFromData(data) {
  const result = [];
  for (const entry of data.enemies) {
    if (entry.comment) continue;
    result.push(mkEnemy(entry.type, entry.x, entry.y, entry.patrolMin, entry.patrolMax));
  }
  return result;
}

function loadLevel(jsonData) {
  levelData = jsonData;
  // 重建 map
  LW = jsonData.width;
  LH = jsonData.height;
  map = buildMapFromData(jsonData);
  MAP_W = LW * TILE;
  updateMapBounds();
  // 敌人改为自动生成，不再从关卡数据读取
  enemies = [];
  // 读取玩家出生点
  if (jsonData.playerSpawn) {
    player.x = jsonData.playerSpawn.x;
    player.y = jsonData.playerSpawn.y;
  }
}

function tile(x, y) {
  const c = Math.floor(x / TILE), r = Math.floor(y / TILE);
  if (c < 0 || c >= LW || r < 0 || r >= LH) return 1;
  return map[r * LW + c];
}

function overlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }

// 通用碰撞：支持矩形 {x,y,w,h} 与圆形 {cx,cy,r} 任意组合
function collide(a, b) {
  const A = a.r !== undefined, B = b.r !== undefined;
  if (A && B) { const dx = a.cx - b.cx, dy = a.cy - b.cy, rr = a.r + b.r; return dx * dx + dy * dy <= rr * rr; }
  if (A) return circleRect(a, b);
  if (B) return circleRect(b, a);
  return overlap(a, b);
}
// 圆形 vs 矩形：取圆到矩形最近点的距离平方比较
function circleRect(c, r) {
  const nx = Math.max(r.x, Math.min(c.cx, r.x + r.w));
  const ny = Math.max(r.y, Math.min(c.cy, r.y + r.h));
  const dx = c.cx - nx, dy = c.cy - ny;
  return dx * dx + dy * dy <= c.r * c.r;
}
// 怪物命中形状：带 r 的（浮游眼）为圆形 {cx,cy,r}，其余为矩形 {x,y,w,h}
function enShape(en) {
  const t = ET[en.type];
  return t && t.r ? { cx: en.x + en.w / 2, cy: en.y + en.h / 2, r: t.r } : { x: en.x, y: en.y, w: en.w, h: en.h };
}

// 在地图范围内随机找一个可生成位置（不重叠砖块/玩家/已有敌人）
function findSpawnPos(w, h) {
  const x0 = MAP_BOUNDS.minX, x1 = MAP_BOUNDS.maxX - w;
  const y0 = MAP_BOUNDS.minY, y1 = MAP_BOUNDS.maxY - h;
  if (x1 <= x0 || y1 <= y0) return null;
  for (let tries = 0; tries < 40; tries++) {
    const x = x0 + Math.random() * (x1 - x0);
    const y = y0 + Math.random() * (y1 - y0);
    const rect = { x, y, w, h };
    // 不与砖块重叠
    let clash = false;
    for (let r = 0; r < LH; r++) for (let c = 0; c < LW; c++) {
      if (map[r * LW + c] === 0) continue;
      if (overlap(rect, { x: c * TILE, y: r * TILE, w: TILE, h: TILE })) { clash = true; break; }
    }
    if (clash) continue;
    // 不与玩家重叠
    if (overlap(rect, { x: player.x, y: player.y, w: player.w, h: player.h })) continue;
    // 不与已有敌人重叠
    let enClash = false;
    for (const en of enemies) {
      if (collide(rect, enShape(en))) { enClash = true; break; }
    }
    if (enClash) continue;
    return { x, y };
  }
  return null;
}

// ==================== 怪物 AI ====================
// 受击击退：给怪物施加方向性弹开速度，持续 knockT 帧并逐渐衰减。
// 击退期间怪物 AI 暂停、物理跳过（由 ai/enPhys 开头的 knockT>0 分支接管位移）。
// 参数：dirX/dirY 为方向（可取 ±1 或 0），power 为初始速度（素材像素/帧）。
// 约定强度：X 子弹 1.5（水平）、Zero 水平挥砍 2.0、Zero 上攻击 2.5（向上）。
function knockEnemy(en, dirX, dirY, power) {
  en.knockT = 8;
  en.knockVx = dirX * power;
  en.knockVy = dirY * power;
}

function ai(en) {
  const t = ET[en.type];
  const dx = player.x - en.x, dy = player.y - en.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (en.hurtT > 0) en.hurtT--;
  if (en.meleeLock > 0) en.meleeLock--;
  // 受击击退期间：AI 完全暂停，由击退速度接管位移并逐渐衰减（8 帧内弹开一段距离）
  if (en.knockT > 0) {
    en.knockT--;
    en.x += en.knockVx;
    en.y += en.knockVy;
    en.knockVx *= 0.85;
    en.knockVy *= 0.85;
    if (en.knockT <= 0) { en.knockVx = 0; en.knockVy = 0; }
    en.x = Math.max(0, Math.min(MAP_W - en.w, en.x));
    return;
  }

  if (!t.boss) {
    const inRange = dist < 110;
    if (en.type === 'bee') {
      // 机械蜂：水平追击 + 垂直正弦浮动（锁定 baseY）
      en.fp += (t.fspd || 0.04);
      en.y = en.baseY + Math.sin(en.fp) * (t.amp || 10);
      if (inRange) {
        en.x += (dx > 0 ? 1 : -1) * t.spd;
        en.facing = dx > 0 ? 1 : -1;
      }
    } else if (t.amp) {
      // 浮游眼：始终朝玩家直线方向缓慢移动（水平+垂直都追，不锁定上下）
      const d = dist || 1;
      en.x += (dx / d) * t.spd;
      en.y += (dy / d) * t.spd;
      en.facing = dx > 0 ? 1 : -1;
    } else {
      if (inRange && dist < 70) {
        en.facing = dx > 0 ? 1 : -1;
        en.vx = en.facing * t.spd * 1.3;
      } else {
        en.vx = en.facing * t.spd;
        if (en.x <= en.pMin) { en.facing = 1; en.vx = t.spd; }
        if (en.x >= en.pMax) { en.facing = -1; en.vx = -t.spd; }
      }
    }
  }

  // Boss
  if (t.boss) {
    const phase2 = en.hp < en.maxHp * 0.5;
    en.bossAtk++;

    if (en.bossJump) {
      en.vy += GRAVITY;
      en.y += en.vy;
      const br = { x: en.x, y: en.y + en.vy, w: en.w, h: en.h };
      for (let r = 0; r < LH; r++) for (let c = 0; c < LW; c++) {
        if (map[r * LW + c] === 0) continue;
        if (overlap(br, { x: c * TILE, y: r * TILE, w: TILE, h: TILE }) && en.vy > 0) {
          en.y = r * TILE - en.h; en.vy = 0; en.bossJump = false; en.grounded = true;
          spawnPart(en.x + en.w / 2, en.y + en.h, 12, '#cc44ff');
        }
      }
      if (en.y > VH / (camera.zoom * VIEW_SCALE) + 40) { en.y = 50; en.vy = 0; en.bossJump = false; }
    } else {
      en.facing = dx > 0 ? 1 : -1;
      const spd = phase2 ? t.spd * 1.4 : t.spd;
      en.vx = en.facing * spd;
      en.x += en.vx;

      const interval = phase2 ? 100 : 160;
      if (en.bossAtk >= interval && en.grounded) {
        en.bossAtk = 0;
        en.bossJump = true;
        en.vy = phase2 ? -6.5 : -5.2;
        en.grounded = false;
        en.vx = en.facing * spd * 2;
        en.x += en.vx;
        spawnPart(en.x + en.w / 2, en.y + en.h, 8, '#cc44ff');
      }
    }

    en.bossWeb++;
    if (en.bossWeb >= (phase2 ? 30 : 50)) {
      en.bossWeb = 0;
      const ex = en.x + en.w / 2, ey = en.y + en.h / 2;
      const adx = player.x + player.w / 2 - ex, ady = player.y + player.h / 2 - ey;
      const ad = Math.sqrt(adx * adx + ady * ady) || 1;
      spawnEBullet(ex, ey, (adx / ad) * 1.5, (ady / ad) * 1.5);
    }
  }

  en.x = Math.max(0, Math.min(MAP_W - en.w, en.x));
}

// ==================== 怪物物理 ====================
function enPhys(en) {
  const t = ET[en.type];
  if (en.knockT > 0) return;  // 受击击退期间跳过物理（位移由 ai 的击退分支接管）
  if (en.type === 'bee' || t.amp) return;
  if (!t.boss || !en.bossJump) { en.vy += GRAVITY; if (en.vy > MAX_FALL) en.vy = MAX_FALL; }

  en.x += en.vx;
  const xr = { x: en.x, y: en.y, w: en.w, h: en.h };
  for (let r = 0; r < LH; r++) for (let c = 0; c < LW; c++) {
    if (map[r * LW + c] === 0) continue;
    const tl = { x: c * TILE, y: r * TILE, w: TILE, h: TILE };
    if (overlap(xr, tl)) {
      if (en.vx > 0) en.x = tl.x - en.w; else if (en.vx < 0) en.x = tl.x + tl.w;
      en.vx = 0;
    }
  }
  en.y += en.vy;
  const yr = { x: en.x, y: en.y, w: en.w, h: en.h };
  en.grounded = false;
  for (let r = 0; r < LH; r++) for (let c = 0; c < LW; c++) {
    if (map[r * LW + c] === 0) continue;
    const tl = { x: c * TILE, y: r * TILE, w: TILE, h: TILE };
    if (overlap(yr, tl)) {
      if (en.vy > 0) { en.y = tl.y - en.h; en.vy = 0; en.grounded = true; }
      else if (en.vy < 0) { en.y = tl.y + tl.h; en.vy = 0; }
    }
  }
}

// ==================== 伤害 ====================
function dmgEnemy(en, d) {
  const hx = en.x + en.w / 2, hy = en.y + en.h / 2;
  en.hp -= d; en.hurtT = 2; // 受击闪白 2 帧（约 33ms），快速一闪后恢复原色

  if (en.hp <= 0) {
    spawnPart(en.x + en.w / 2, en.y + en.h / 2, ET[en.type].boss ? 40 : 20, ET[en.type].col);
    return true;
  }
  return false;
}
function dmgPlayer(d) {
  if (player.invT > 0) return;
  player.hp -= d; player.invT = P.INV;
  spawnPart(player.x + player.w / 2, player.y + player.h / 2, 8, '#f44');

}

function wallCheck(rect) {
  let l = false, r = false;
  const m = 3;
  const cl = { x: rect.x - 1, y: rect.y + m, w: 2, h: rect.h - m * 2 };
  const cr = { x: rect.x + rect.w - 1, y: rect.y + m, w: 2, h: rect.h - m * 2 };
  for (let rr = 0; rr < LH; rr++) for (let cc = 0; cc < LW; cc++) {
    if (map[rr * LW + cc] === 0) continue;
    const t = { x: cc * TILE, y: rr * TILE, w: TILE, h: TILE };
    if (overlap(cl, t)) l = true;
    if (overlap(cr, t)) r = true;
  }
  return { l, r };
}

// ==================== 下蹲 / 冲刺碰撞盒 ====================
// 把玩家碰撞盒宽度/高度切换到指定值，保持脚底(y+h)不变、水平中心(cx)不变
function setPlayerBox(w, h) {
  const cx = player.x + player.w / 2;
  const bottom = player.y + player.h;
  player.w = w;
  player.h = h;
  player.x = cx - w / 2;
  player.y = bottom - h;
}

// 检测将碰撞盒切换到指定宽高（保持脚底 bottom 与水平中心 cx，与 setPlayerBox 一致）后，
// 新碰撞盒是否与地形重叠。返回 true 表示无冲突（可切换），false 表示冲突（禁止切换）。
function boxFitsTerrain(w, h) {
  const cx = player.x + player.w / 2;
  const bottom = player.y + player.h;
  const rect = { x: cx - w / 2, y: bottom - h, w, h };
  for (let r = 0; r < LH; r++) for (let c = 0; c < LW; c++) {
    if (map[r * LW + c] === 0) continue;
    if (overlap(rect, { x: c * TILE, y: r * TILE, w: TILE, h: TILE })) return false;
  }
  return true;
}

// 检测角色碰撞盒正下方是否有实体地形支撑（true 表示脚下有地面）
function hasGroundBelow() {
  const probe = { x: player.x, y: player.y + player.h, w: player.w, h: 1 };
  for (let r = 0; r < LH; r++) for (let c = 0; c < LW; c++) {
    if (map[r * LW + c] === 0) continue;
    if (overlap(probe, { x: c * TILE, y: r * TILE, w: TILE, h: TILE })) return true;
  }
  return false;
}

// 检测当前位置站起(站立碰撞盒)是否会被头顶实体卡住，true 表示能站起
function canStandUp() {
  const bottom = player.y + player.h;
  const standRect = { x: player.x, y: bottom - HITBOX.stand.h, w: HITBOX.stand.w, h: HITBOX.stand.h };
  for (let r = 0; r < LH; r++) for (let c = 0; c < LW; c++) {
    if (map[r * LW + c] === 0) continue;
    if (overlap(standRect, { x: c * TILE, y: r * TILE, w: TILE, h: TILE })) return false;
  }
  return true;
}

// 统一的下蹲/站起状态切换。forced=true 表示强制蹲下(锁移动)
function setCrouch(on, forced) {
  if (on) {
    if (!player.crouch) {
      // 站起→下蹲切换碰撞盒 B 前检测冲突，冲突则拒绝下蹲
      if (!boxFitsTerrain(HITBOX.crouch.w, HITBOX.crouch.h)) return;
      setPlayerBox(HITBOX.crouch.w, HITBOX.crouch.h);
    }
    player.crouch = true;
    player.forcedCrouch = forced;
  } else {
    if (player.forcedCrouch) return;  // 强制蹲下时不能手动站起
    if (!canStandUp()) return;        // 顶头则继续蹲着
    if (player.crouch) setPlayerBox(HITBOX.stand.w, HITBOX.stand.h);
    player.crouch = false;
  }
}

// dash 结束：恢复高度或转为强制蹲下
function endDash() {
  player.isDash = false;
  player.vx = 0;
  player.dashEndLock = 2;   // 冲刺结束锁：2 帧内强制地面动画，避免碰撞盒切换临界帧误入 airborne 闪 jump
  if (!player.crouch && !player.forcedCrouch) {
    if (canStandUp()) setPlayerBox(HITBOX.stand.w, HITBOX.stand.h);
    else setCrouch(true, true);
  }
}

// ==================== 近战挥砍（Zero） ====================
// 攻击范围：上攻击沿用 blade.png 逆时针旋转 175°；水平挥砍按段数使用
// blade1-1 / blade1-2 / blade1-3 序列帧（空中固定第 2 段 → blade1-2）。
// 三段大小倍率（以基准大小 1.0 为参照）：第一段 0.75、第二段 0.8、
// 第三段 2.0 → 当前再 ×0.9 = 1.8。
// 位置：第二段与角色相对居中（水平中心对齐角色中心），其余段保持向面朝方向偏移。
function meleeStageMult(stage) {
  if (stage === 1) return 0.75;
  if (stage === 2) return 0.8;
  return 1.8;
}

// 三段挥砍逐帧切换时长表（单位：帧）。每段总时长 18 帧：
// 第 1/3 段：6 帧动画，每帧 3 帧切换（3×6=18）
// 第 2 段：7 帧动画，第 2/6/7 帧每 2 帧切换，其余 3 帧（3+2+3+3+3+2+2=18）
const MELEE_FRAME_DURS = {
  1: [3, 3, 3, 3, 3, 3],
  2: [3, 2, 3, 3, 3, 2, 2],
  3: [3, 3, 3, 3, 3, 3],
};

// 根据挥砍剩余帧 p.melee 与帧切换时长表，返回当前应显示的动画帧索引。
// durs 缺省时使用当前段对应表（水平挥砍）；上劈传入 MELEE_FRAME_DURS[2]（7 帧/18 帧）
function meleeFrameIndex(p, total, durs) {
  if (!durs) durs = MELEE_FRAME_DURS[p.meleeCurStage] || MELEE_FRAME_DURS[1];
  const elapsed = MELEE_ACTIVE - p.melee;  // 已播放帧数 0..17
  let acc = 0;
  for (let i = 0; i < Math.min(total, durs.length); i++) {
    acc += durs[i];
    if (elapsed < acc) return i;
  }
  return Math.min(total - 1, durs.length - 1);
}

// 滞空斩时间轴：总 37 帧 = blast-blade(15) + 停滞(10) + blast-blade2(12)
// 返回当前阶段资源与帧；停滞阶段返回 blast-blade 最后一帧（保持画面）
function floatBladeInfo(p) {
  const T1 = 15, TSTALL = MELEE_FLOAT_STALL, T2 = 12;
  const total = T1 + TSTALL + T2;
  const elapsed = total - p.floatT;  // 已播放帧数
  if (elapsed < T1) {
    // 第一部分：blast-blade
    const entry = BLAST_BLADE;
    if (entry.loaded && entry.frames.length > 0) {
      let acc = 0, idx = 0;
      for (let i = 0; i < entry.frames.length; i++) { acc += MELEE_FLOAT_DURS1[i]; if (elapsed < acc) { idx = i; break; } if (i === entry.frames.length - 1) idx = i; }
      return { entry, f: entry.frames[idx], stage: 1 };
    }
  } else if (elapsed < T1 + TSTALL) {
    // 停滞：保持 blast-blade 最后一帧
    const entry = BLAST_BLADE;
    if (entry.loaded && entry.frames.length > 0) {
      return { entry, f: entry.frames[entry.frames.length - 1], stage: 1 };
    }
  } else {
    // 第二部分：blast-blade2
    const entry = BLAST_BLADE2;
    if (entry.loaded && entry.frames.length > 0) {
      const e2 = elapsed - T1 - TSTALL;  // 0..11
      let acc = 0, idx = 0;
      for (let i = 0; i < entry.frames.length; i++) { acc += MELEE_FLOAT_DURS2[i]; if (e2 < acc) { idx = i; break; } if (i === entry.frames.length - 1) idx = i; }
      return { entry, f: entry.frames[idx], stage: 2 };
    }
  }
  return null;
}

function meleeRect(stage) {
  const p = player;
  // 冲刺斩：判定框覆盖角色前方（dash-blade2 8 帧循环，顺时针旋转 90°，向右冲刺斩，向左镜像）
  if (p.dashAtkT > 0) {
    const db = DASH_BLADE;
    if (db.loaded && db.frames.length > 0) {
      const total = db.frames.length;
      const f = db.frames[Math.floor((MELEE_DASH_T - p.dashAtkT) / 3) % total];
      const ds = P.PH / db.fh * 2.4;
      const dw = f.w * ds, dh = f.h * ds;
      const cx = p.x + p.w / 2;
      const cy = p.y + p.h / 2;
      // 顺时针旋转 90°：刀光从竖向变横向，AABB 宽高互换
      const rw = dh / 2, rh = dw / 2;
      const ox = p.dashAtkDir * (dw / 2);
      return { x: cx + ox - rw, y: cy - rh, w: rw * 2, h: rh * 2 };
    }
  }
  // 下劈斩：判定框跟随 down-blade 刀光（7 帧循环，逆时针旋转 45°，左下方下劈），
  // 右下方镜像。锚点位于角色前方下方。
  if (p.downT > 0) {
    const db = DOWN_BLADE;
    if (db.loaded && db.frames.length > 0) {
      const ds = P.PH / db.fh * 0.75 * 1.2;
      // 循环播放：elapsed 用 downT 递减推导（downT 从 999 递减，用帧循环）
      const total = db.frames.length;
      const fIdx = Math.floor((999 - p.downT) / MELEE_DOWN_DUR) % total;
      const f = db.frames[fIdx];
      const dw = f.w * ds, dh = f.h * ds;
      const cx = p.x + p.w / 2;
      const cy = p.y + p.h / 2;
      // 逆时针 45° 旋转后 AABB 近似（宽高互换取对角）
      const rot = Math.SQRT1_2;  // cos45
      const rw = (dw + dh) * rot * 0.5;
      const rh = (dw + dh) * rot * 0.5;
      const ox = p.downDir * rw;
      const oy = rh * 0.8;
      return { x: cx + ox - rw, y: cy + oy - rh, w: rw * 2, h: rh * 2 };
    }
  }
  // 滞空斩：判定框跟随当前阶段刀光（blast-blade / 停滞 / blast-blade2），
  // 锚点居中偏前（面朝方向），与 drawMeleeEffectFloat 完全一致。
  if (p.floatT > 0) {
    const info = floatBladeInfo(p);
    if (info) {
      const { entry, f } = info;
      const fs = P.PH / entry.fh * 1.5 * (info.stage === 2 ? 1.1 : 0.8);
      const dw = f.w * fs, dh = f.h * fs;
      const cx = p.x + p.w / 2;
      const cy = p.y + p.h / 2;
      const refW = entry.fw * fs;
      const anchorX = cx + p.facing * (refW * 0.2 + p.w);
      return { x: anchorX - dw / 2, y: cy - dh / 2, w: dw, h: dh };
    }
  }
  // 旋风斩：判定框覆盖角色周围（storm-blade 环绕刀光，中心对齐角色），
  // 与 drawMeleeEffectStorm 的中心对齐一致。
  if (p.stormT > 0) {
    const sb = STORM_BLADE;
    if (sb.loaded && sb.frames.length > 0) {
      const ss = P.PH / sb.fh * 1.5 * 1.1;  // 缩小一半（原 2.2 → 1.1）
      const total = sb.frames.length;
      const f = sb.frames[meleeFrameIndex(p, total, MELEE_STORM_DURS)];
      const sw = f.w * ss, sh = f.h * ss;
      const cx = p.x + p.w / 2;
      const cy = p.y + p.h / 2;
      return { x: cx - sw / 2, y: cy - sh / 2, w: sw, h: sh };
    }
  }
  // 升龙斩：判定框跟随 up-shoryu 序列帧（6 帧，左对齐，与 drawMeleeEffectShoryu 完全一致）
  if (p.shoryuT > 0) {
    const up = UP_SHORYU;
    if (up.loaded && up.frames.length > 0) {
      const us = P.PH / up.fh * 1.5 * 1.5;  // 放大到 1.5 倍
      const total = up.frames.length;
      const f = up.frames[meleeFrameIndex(p, total, MELEE_SHORYU_DURS)];
      const uw = f.w * us, uh = f.h * us;
      const cx = p.x + p.w / 2;
      const cy = p.y + p.h / 2;
      // 左对齐：刀光左边缘贴锚点；锚点位于角色中心偏上、偏前（面朝方向）
      const refW = up.fw * us;
      const anchorX = cx + p.facing * (refW * 0.2 + p.w);
      const anchorY = cy - P.PH * 0.55;
      const rx = p.facing > 0 ? anchorX - uw : anchorX;
      return { x: rx, y: anchorY - uh / 2, w: uw, h: uh };
    }
  }
  // 空中圆月斩：用 air-blade 序列帧（8 帧，面朝右侧），锚点居中（圆月斩环绕角色），
  // 与 drawMeleeEffectAir 完全一致。面朝左时水平镜像。
  if (p.airAtk) {
    const ab = AIR_BLADE;
    if (ab.loaded && ab.frames.length > 0) {
      const as = P.PH / ab.fh * 1.8 * 1.8 * 0.8;
      const total = ab.frames.length;
      const f = ab.frames[meleeFrameIndex(p, total, MELEE_AIR_DURS)];
      const dw = f.w * as, dh = f.h * as;
      const cx = p.x + p.w / 2;
      const cy = p.y + p.h / 2;
      return { x: cx - dw / 2, y: cy - dh / 2, w: dw, h: dh };
    }
  }
  const entry = !p.upAtk ? bladeEntryFor(p) : null;
  const useBlade = entry && entry.loaded && entry.frames.length > 0;
  if (useBlade) {
    // 判定框跟随当前挥砍动画帧的真实形状：用每帧去空白边距后的尺寸 f.w/f.h（而非
    // strip 排版最大帧 entry.fw/fh），缩放/锚点/右对齐与 drawMeleeEffectHoriz 完全一致，
    // 使判定框每一帧都与视觉刀光贴合。
    const s = P.PH / entry.fh * 1.5 * meleeStageMult(p.meleeCurStage);
    const total = entry.frames.length;
    const f = entry.frames[meleeFrameIndex(p, total)];
    const dispW = f.w * s;
    const dispH = f.h * s;
    const cx = p.x + p.w / 2;
    const cy = p.y + p.h / 2;
    // 锚点偏移系数（以最大帧宽 refW 为基准的固定值，防抖）：
    // 第二段水平中心对齐角色中心；第三段向角色方向回移 1/4 帧宽（0.75 → 0.5）；
    // 其余段向前偏移 3/4 帧宽
    const refW = entry.fw * s;
    const offRatio = p.meleeCurStage === 2 ? (dispW / refW) / 2 : (p.meleeCurStage === 3 ? 0.5 : 0.75);
    const anchorX = cx + p.meleeDir * (refW * offRatio);
    const rx = p.meleeDir > 0 ? anchorX - dispW : anchorX;
    return { x: rx, y: cy - dispH / 2, w: dispW, h: dispH };
  }

  // 上攻击或资源未加载时：沿用 blade.png 旧逻辑（取消段数放大）
  const bw = (BLADE.loaded && BLADE.img.naturalWidth) ? BLADE.img.naturalWidth : 1;
  const bh = (BLADE.loaded && BLADE.img.naturalHeight) ? BLADE.img.naturalHeight : 1;
  const targetH = P.PH;
  const s = targetH / bw;
  const dispW = bh * s;
  const dispH = targetH;
  const cx = p.x + p.w / 2;
  const cy = p.y + p.h / 2;
  // 矩形：从角色前方开始，垂直方向居中
  // 上攻击：刀光以头顶上方为锚点、尖端朝上。长度方向（dispW）近似竖直、厚度方向（dispH）近似水平
  if (p.upAtk) {
  // 上劈刀光：使用 up-blade 序列帧（7 帧，18 帧动画），向面朝方向前方展开
  const up = UP_BLADE;
  if (up.loaded && up.frames.length > 0) {
    const us = P.PH / up.fh * 1.5 * 1.5;  // 放大到 1.5 倍
    const total = up.frames.length;
    const f = up.frames[meleeFrameIndex(p, total, MELEE_FRAME_DURS[2])];
    const uw = f.w * us, uh = f.h * us;
    // 右对齐：刀光右边缘（尖端）贴锚点；锚点位于角色中心偏上、偏右（面朝方向）
    const refW = up.fw * us;
    const anchorX = cx + p.facing * (refW * 0.2 + p.w);
    const anchorY = cy - P.PH * 0.55;
    const rx = p.facing > 0 ? anchorX - uw : anchorX;
    return { x: rx, y: anchorY - uh / 2, w: uw, h: uh };
  }
  const anchorY = cy - P.PH * 0.6;
    return { x: cx - dispH / 2, y: anchorY - dispW / 2, w: dispH, h: dispW };
  }
  const rx = p.meleeDir > 0 ? cx : cx - dispW;
  return { x: rx, y: cy - dispH / 2, w: dispW, h: dispH };
}

// 挥砍触发帧：仅播放特效（伤害判定交给动画期间每帧的 doMeleeHit）
function doMelee(stage) {
  const p = player;
  const cx = p.x + p.w / 2, cy = p.y + p.h / 2;
  spawnPart(cx + p.meleeDir * 10, cy - 4, 6, '#8cf');
}

// 挥砍动画期间逐帧判定（仅 Zero）。命中冷却 meleeLock>0 的怪物跳过；
// 命中帧 + 5 帧无伤害 = 6 帧一次，12 帧动画内最多命中 2 次（第 1/7 帧）。
// 命中触发 hitstop：仅角色与被攻击的敌人定格，其余世界照常（同帧多目标合并冻结）。
function doMeleeHit(stage) {
  const p = player;
  let dmg;
  if (p.dashAtkT > 0) {
    dmg = MELEE_DASH_DMG;
  } else if (p.downT > 0) {
    dmg = MELEE_DOWN_DMG;
  } else if (p.floatT > 0) {
    dmg = MELEE_FLOAT_DMG;
  } else if (p.stormT > 0) {
    dmg = MELEE_STORM_DMG;
  } else if (p.shoryuT > 0) {
    dmg = MELEE_SHORYU_DMG;
  } else if (p.upAtk) {
    dmg = MELEE_UP_DMG;
  } else {
    const idx = stage - 1;
    if (idx < 0 || idx >= MELEE_STAGES.length) return;
    dmg = MELEE_STAGES[idx].dmg;
  }
  const rect = meleeRect(stage);
  let hitAny = false;
  for (let j = enemies.length - 1; j >= 0; j--) {
    const en = enemies[j];
    if (collide(rect, enShape(en))) {
      if (en.meleeLock > 0) continue;   // 命中冷却中，本次不生效
      if (dmgEnemy(en, dmg)) enemies.splice(j, 1);
      else {
        // 击退：冲刺斩沿冲刺方向弹开（3.0），下劈斩斜向弹开（向下前方），滞空斩水平弹开（2.5），升龙向上弹开（3.0），上攻击向上弹开（2.5），水平挥砍沿挥砍方向弹开（2.0）
        if (p.dashAtkT > 0) knockEnemy(en, p.dashAtkDir, 0, 3.0);
        else if (p.downT > 0) knockEnemy(en, p.downDir, 1, 3.0);
        else if (p.floatT > 0) knockEnemy(en, p.meleeDir, 0, 2.5);
        else if (p.stormT > 0) knockEnemy(en, 0, -1, 1.2);
        else if (p.shoryuT > 0) knockEnemy(en, 0, -1, 3.0);
        else if (p.upAtk) knockEnemy(en, 0, -1, 2.5);
        else knockEnemy(en, p.meleeDir, 0, 2.0);
        hitstopTargets.push(en);   // 记录本次停顿的冻结目标（仅存活的受击怪物）
      }
      en.meleeLock = 6;
      // Zero 专属受击特效（通用 hit 动画，画在怪物上层）
      spawnMeleeHitEffect(en.x + en.w / 2, en.y + en.h / 2, p.meleeDir);
      hitAny = true;
    }
  }
  if (hitAny) hitstop = HITSTOP;
}

// ==================== 主循环 ====================
function update() {
  // 编辑模式下暂停游戏逻辑
  if (editMode) return;
  // hitstop：仅冻结角色与被攻击的敌人（定格受击瞬间），其余世界照常运行（仅 Zero 近战命中触发）
  if (hitstop > 0) {
    hitstop--;
    if (hitstop === 0) hitstopTargets.length = 0;  // 停顿结束，解除冻结目标
    updateWorld();
    return;
  }

  const p = player;
  if (p.invT > 0) p.invT--;
  if (p.wjLock > 0) p.wjLock--;
  if (p.dashEndLock > 0) p.dashEndLock--;

  const jD = keys['j'] || keys['J'];
  const kR = keys['k'] || keys['K'];
  const lR = keys['l'] || keys['L'];
  const sR = keys['s'] || keys['S'];
  const wR = keys['w'] || keys['W'];   // 上方向攻击键（地面按住 W + 攻击 = 上攻击）
  if (!kR) p.kCon = false;
  const kD = kR && !p.kCon;
  if (!lR) p.lCon = false;
  const lD = lR && !p.lCon;
  let mx = 0;
  if (keys['a'] || keys['A']) mx = -1;
  if (keys['d'] || keys['D']) mx += 1;
  if ((keys['a'] || keys['A']) && (keys['d'] || keys['D'])) mx = 0;
  // 本帧已执行跳跃的标志：冲刺跳（Dash1/Dash2）先触发后，同帧跳跃块不得再落入
  // 二段跳分支覆盖初速度，否则冲刺跳实际高度会变成二段跳的 0.8 倍
  let jumpDone = false;

  // 墙面
  const pr = { x: p.x, y: p.y, w: p.w, h: p.h };
  const ws = wallCheck(pr);
  const wasWall = p.onWall;
  p.onWall = 0; p.wallSlide = false;
  if (!p.grounded) {
    if (ws.l) p.onWall = -1; if (ws.r) p.onWall = 1;
    if (p.onWall !== 0 && p.vy > 0) {
      const press = (p.onWall === -1 && mx === -1) || (p.onWall === 1 && mx === 1);
      if (press) { p.vy = Math.min(p.vy, P.WALL_SLIDE); p.wallSlide = true; p.floatAtkUsed = false; p.shoryuAtkUsed = false; p.jRePress = true; }
    }
  }

  // 攻击：X = 射击蓄力；Zero = 近战挥砍三段连击
  if (CHARS[curChar].melee) {
    // === Zero 近战 ===
    // 冷却 / 连击重置 / 第三段硬直倒计时
    if (p.meleeCd > 0) p.meleeCd--;
    if (p.meleeReset > 0) { p.meleeReset--; if (p.meleeReset === 0) p.meleeCombo = 0; }
    if (p.meleeFinalLock > 0) p.meleeFinalLock--;
    // 挥砍渐隐（滞空斩/下劈斩/冲刺斩期间 p.melee 保持 > 0，由 floatT/downT/dashAtkT 控制总时长）
    if (p.melee > 0 && p.floatT <= 0 && p.downT <= 0 && p.dashAtkT <= 0) p.melee--;
    // 冲刺斩倒计时：归 0 结束冲刺斩（或撞墙提前结束）
    if (p.dashAtkT > 0) {
      p.dashAtkT--;
      if (p.dashAtkT === 0) { p.melee = 0; p.invT = 8; }
    }
    // 升龙斩击倒计时（与 melee 同步结束升龙状态）
    if (p.shoryuT > 0) p.shoryuT--;
    // 旋风斩倒计时：动画播完瞬间（stormT 从 1 归 0）发射左右两个斩击波
    if (p.stormT > 0) {
      p.stormT--;
      if (p.stormT === 0) {
        // 斩击波朝左右两侧同时发射，与角色面朝方向无关。
        // 资源是「波前朝右」的斩击波：右飞原样(mirror=1)、左飞镜像(mirror=-1)。
        spawnStormWave(1, 1);   // 右飞：dir=+1，波前朝右
        spawnStormWave(-1, -1); // 左飞：dir=-1，波前朝左（镜像）
      }
    }
    // 滞空斩倒计时：归 0 结束滞空状态（角色恢复自由落体）
    if (p.floatT > 0) {
      p.floatT--;
      if (p.floatT === 0) p.melee = 0;  // 收尾：清空挥砍残留，结束刀光
    }
    // 下劈斩：由碰撞检测结束（downT 从 999 递减，撞障碍物时清零）；兜底防飞出边界无限无敌
    if (p.downT > 0) {
      p.downT--;
      if (p.downT === 0) { p.melee = 0; p.invT = 8; }
    }

    if (jPressed && jD && p.meleeCd === 0 && p.meleeFinalLock === 0) {
      jPressed = false;  // 消费按下沿：长按不连挥，每次挥砍都需要重新按攻击键
      let stage;
      // 冲刺斩判定：仅地面冲刺（isDash）状态下按 J 触发（还原：去掉空中冲刺触发）
      if (p.isDash && p.grounded) {
        // 冲刺斩：以冲刺动画第二帧姿态继续向前冲刺斩击，距离 2 倍普通冲刺
        p.upAtk = false;
        p.airAtk = false;
        p.dashAtkDir = p.dashDir;
        p.dashAtkT = MELEE_DASH_T;   // 21 帧 = 普通冲刺 DASH_TIME（原 42 已缩短一半）
        p.meleeCd = MELEE_DASH_T;
        p.meleeDir = p.dashDir;
        p.melee = MELEE_ACTIVE;
        p.meleeCurStage = 0;
        p.invT = MELEE_DASH_T;       // 冲刺斩期间无敌
        p.isDash = false;            // 退出普通冲刺，由冲刺斩接管（保持冲刺速度）
        p.animF = 1; p.animT = 0;    // 冲刺动画第二帧
        stage = 0;
      } else if (sR && p.grounded) {
        // 旋风斩：原地旋风刀光（storm-blade 4 帧），动画播完发射左右斩击波
        p.upAtk = false;
        p.airAtk = false;
        // 若处于下蹲，旋风斩瞬间站起（恢复站立碰撞盒，非强制蹲下时）
        if (p.crouch && !p.forcedCrouch) { setPlayerBox(HITBOX.stand.w, HITBOX.stand.h); p.crouch = false; }
        p.stormT = MELEE_ACTIVE;
        p.meleeCd = MELEE_STORM_CD;
        p.meleeDir = p.facing;
        p.melee = MELEE_ACTIVE;
        p.shootHold = 8;
        p.meleeCurStage = 0;  // 标记为旋风斩（非三段连击）
        doMelee(0);
        if (p.grounded && !p.landing && mx === 0) { p.animF = 1; p.animT = 0; }
      } else {
        // 上攻击判定：仅地面按住 W 时触发（空中 W 无效，按普通攻击处理）
        p.upAtk = p.grounded && wR;
        p.airAtk = false;
        if (p.upAtk) {
          // 上劈：独立单段动作，不参与地面三段连击；每次间隔 20 帧（MELEE_UP_CD）
          stage = 0;
          p.meleeCd = MELEE_UP_CD;
        } else if (!p.grounded) {
          // 空中攻击：下劈斩（sR）→ 圆月斩（其余，不含 W+J 的滞空/升龙，后者由独立派生块处理）
          if (sR) {
            // 下劈斩：向面朝方向下方 45° 冲刺，直到撞地面/墙结束。锁定触发时朝向。
            p.airAtk = false;
            p.downDir = p.facing;
            p.downT = 999;  // 由碰撞检测结束（不会自然耗尽，除非撞障碍物）
            p.meleeCd = MELEE_FLOAT_CD;
            p.melee = MELEE_ACTIVE;
            p.meleeCurStage = 0;
            p.invT = 999;   // 下劈斩期间无敌
            p.grounded = false;
            p.animF = 0; p.animT = 0;  // 重置动画，播放 dash 第二帧
            stage = 0;
          } else if (!wR) {
            // 空中攻击（圆月斩）：用 air-blade 资源替代跳跃斩击，固定第 2 段（伤害 3），
            // 不推进连击段数；使用独立 0.5s 间隔 CD
            stage = 2;
            p.airAtk = true;
            p.meleeCd = MELEE_AIR_CD;
          } else if (wR) {
            // 滞空斩：空中按住 W + 按 J 立即触发（攻击块由 jPressed 进入，此处无需重复判定）；
            // 全程悬浮不下降；每次跳跃限一次（floatAtkUsed）。可被升龙斩/跳跃打断（见下方）。
            if (!p.floatAtkUsed) {
              p.airAtk = false;
              p.meleeDir = p.facing;  // 锁定朝向（修复面朝左动画方向错）
              p.floatT = 15 + MELEE_FLOAT_STALL + 12;  // 15 + 0 + 12 = 27 帧
              p.meleeCd = MELEE_FLOAT_CD;
              p.melee = MELEE_ACTIVE;
              p.meleeCurStage = 0;
              p.floatAtkUsed = true;
              stage = 0;
            } else if (p.shoryuAtkUsed) {
              // 滞空已用过 且 升龙也已用过（升龙可用时由独立派生块蓄力，不在此回退）：
              // 回退圆月斩，保证空中 W+J 始终有攻击可放
              stage = 2;
              p.airAtk = true;
              p.meleeCd = MELEE_AIR_CD;
            } else {
              stage = -1;  // 本帧不触发挥砍（升龙仍可用，交由派生块蓄力），跳过尾部逻辑
            }
          }
        } else {
          // 地面攻击：连击推进（重置窗口内继续下一段，否则第 1 段；3 段后回到第 1 段）
          stage = (p.meleeCombo >= 3) ? 1 : p.meleeCombo + 1;
          p.meleeCombo = stage;
          p.meleeReset = MELEE_RESET;
          p.meleeCd = MELEE_CD;
          // 第三段后硬直
          if (stage === 3) p.meleeFinalLock = MELEE_FINAL_LOCK;
          // 第三段上攻击：角色向上跃起（0.8 倍跳跃高度），斩击随角色一起上升。
          // 跃起计为一次跳跃（jumpCount=1），空中仍可再接二段跳。
          if (p.upAtk && stage === 3) {
            p.vy = P.JUMP2;
            p.grounded = false;
            p.jumpCount = 1;
            p.landing = false;
            p.animF = 0; p.animT = 0;
          }
        }
        if (stage < 0) { /* 空中 W+J 已由独立派生块处理，跳过尾部挥砍 */ }
        else {
        p.meleeCurStage = stage;  // 记录本次挥砍段数，供绘制/范围显示
        // 挥砍朝向锁定：贴墙滑行时朝墙反方向（与 X 贴墙射击一致），否则跟随 facing
        p.meleeDir = (p.wallSlide && p.onWall !== 0) ? -p.onWall : p.facing;
        p.melee = MELEE_ACTIVE;
        p.shootHold = 8;  // 挥砍进入短暂攻击动画
        // 执行挥砍判定
        doMelee(stage);
        if (p.grounded && !p.landing && mx === 0) { p.animF = 1; p.animT = 0; }
        }
      }
    }
  } else {
    // === X 射击蓄力 ===
    jPressed = false;  // X 不消费按下沿，清零避免切回 Zero 时残留误触发
    if (jD) {
      if (!p.isChg) {
        p.isChg = true; p.chgT = 0;
        let sd = p.facing; if (p.wallSlide) sd = -p.onWall;
        spawnBullet(p.x + (sd > 0 ? p.w : 0), p.y, sd, 0);
        p.shootHold = 15;  // 普通射击：发射子弹瞬间进入射击动画（保留 0.25s）
        // 仅站立不动射击(shoot)重置帧到第二帧；空中(jumpShoot)/移动射击(runShoot/dashShoot)不重置，
        // 保持与移动动画的帧同步（由 KEEP_FRAME_PAIRS 保证切换时保留当前帧索引）
        if (p.grounded && !p.landing && mx === 0) { p.animF = 1; p.animT = 0; }
      } else {
        p.chgT++;
        if (p.chgT >= P.CHG2 && p.chgT === P.CHG2) spawnPart(p.x + p.w / 2, p.y + p.h / 2, 3, '#f44');
      }
    } else {
      if (p.isChg) {
        let pw = 0;
        if (p.chgT >= P.CHG2) pw = 2;
        else if (p.chgT > P.CHG1) pw = 1;
        if (pw > 0) {
          let sd = p.facing; if (p.wallSlide) sd = -p.onWall;
          spawnBullet(p.x + (sd > 0 ? p.w : 0), p.y, sd, pw);
          p.shootHold = 15;  // 蓄力发射：松手发射蓄力弹时进入射击动画（保留 0.25s）
          // 仅站立不动射击(shoot)重置帧到第二帧；空中(jumpShoot)/移动射击(runShoot/dashShoot)不重置，
          // 保持与移动动画的帧同步（由 KEEP_FRAME_PAIRS 保证切换时保留当前帧索引）
          if (p.grounded && !p.landing && mx === 0) { p.animF = 1; p.animT = 0; }
        }
        p.isChg = false; p.chgT = 0;
      }
    }
  }

  // W+J 升龙派生块（地面 + 空中均可施放）：
  //   - 地面：上劈（upAtk）中继续按住 W+J 蓄力 ≥0.1s 触发（保留原行为）
  //   - 空中：按住 W+J 蓄力 ≥0.1s 触发（需求 2 新增）
  // 升龙每次长按只触发一次：触发后（空中段）shoryuAtkUsed=true，松手前不重复触发；
  //   地面段（upAtk）触发升龙时【不】置 shoryuAtkUsed，故地面放升龙后仍可在空中再放一次。
  //   地面升龙后空中再升龙【必须松开 J 重新按住】：升龙触发置 jRePress=false，持续按住 J 不累计蓄力；
  //       须松开 J（jRePress 复位 true）后重新按住 W+J 蓄力才触发。空中段因 shoryuAtkUsed 已锁，至多再放一次。
  // 升龙跃起不修改 jumpCount，避免重置二段跳次数。
  // 升龙触发会打断滞空斩（若 floatT>0 则立即中止）。
  // 重置点：起跳 / 落地 / 贴墙滑行（floatAtkUsed、shoryuAtkUsed 均重置）。
  if (CHARS[curChar].melee && wR && p.meleeCd === 0 && p.meleeFinalLock === 0 && p.shoryuT <= 0 && (!p.grounded || p.upAtk)) {
    if (jD) {
      // 长按 J → 累计蓄力（升龙未用过且达阈值才触发，否则仅蓄力）
      // 地面段（upAtk）不锁 shoryuAtkUsed（地面放升龙后仍可在空中再放一次）；空中段（!grounded）才锁。
      // "必须松开 J 再重新按"语义：地面升龙触发后 jRePress=false，持续按住 J 不会累计蓄力；
      //   仅当玩家松开过 J（jRePress 复位 true）后重新按住，才允许空中再蓄力升龙。
      if (p.jRePress) {
        p.jHoldT++;
      } else {
        p.jHoldT = 0;   // 地面升龙后尚未松开过 J，禁止蓄力（必须松手重按）
      }
      const groundShoryu = !!p.upAtk;  // 记录触发时是否地面段（upAtk），避免被下方改写干扰
      const shoryuOk = groundShoryu ? true : !p.shoryuAtkUsed;
      if (shoryuOk && p.jHoldT >= MELEE_SHORYU_CHARGE) {
        p.jHoldT = 0;   // 触发后重置蓄力
        // 升龙触发：打断滞空斩（若有）
        if (p.floatT > 0) { p.floatT = 0; p.melee = 0; p.meleeCurStage = 0; }
        // 升龙：独立动作，向面朝方向上方 80° 跃起（高度随跳高同步提高）
        p.upAtk = false;
        p.shoryuT = MELEE_ACTIVE;   // 升龙斩击持续（与 melee 同步递减）
        p.melee = MELEE_ACTIVE;     // 复用挥砍逐帧判定/渐隐
        p.meleeDir = p.facing;
        p.meleeCd = MELEE_SHORYU_CD;
        p.vy = MELEE_SHORYU_VY;
        p.vx = p.facing * MELEE_SHORYU_VX;
        p.grounded = false;
        // 注意：升龙跃起不修改 jumpCount，避免重置二段跳次数（白送一次二段跳）
        // 仅空中段锁 shoryuAtkUsed；地面段（groundShoryu）保持 false，故空中可再放一次
        if (!groundShoryu) p.shoryuAtkUsed = true;
        p.jRePress = false;  // 触发后要求松开 J 再按，才能再次升龙（地面/空中均适用）
        p.isDash = false; p.dashAir = false;
        p.landing = false;
        p.animF = 0; p.animT = 0;
        spawnPart(p.x + p.w / 2, p.y + p.h / 2, 8, '#f88');
        doMelee(0);
      }
    } else {
      p.jHoldT = 0;    // 松开 J → 放弃升龙蓄力（shoryuAtkUsed 保持）
      p.jRePress = true;  // 松开过 J，允许下次重新按住再蓄力
    }
  } else {
    p.jHoldT = 0;
  }

  // Dash 1
  if (p.isDash) {
    p.dashT--;
    p.vx = p.dashDir * P.SPEED * P.DASH_MULT;
    let cancel = false;
    if (p.dashT <= 0) cancel = true;
    const hFwd = (p.dashDir === 1 && mx === 1) || (p.dashDir === -1 && mx === -1);
    if (!lR && !hFwd) cancel = true;
    if (mx !== 0 && mx !== p.dashDir) cancel = true;
    // 冲刺过程中脚下无地面支撑则立即结束冲刺（掉落），避免悬空冲
    if (!hasGroundBelow()) cancel = true;
    if (cancel) { endDash(); p.dashReady = !!lR; }
    if (kD) {
      p.vy = P.JUMP; p.grounded = false; p.jumpCount = 1;
      if (p.floatT > 0) { p.floatT = 0; p.melee = 0; p.meleeCurStage = 0; }  // 跳跃打断滞空斩
      jumpDone = true;   // 阻止同帧跳跃块再走二段跳覆盖初速度（冲刺跳高度=普通跳）
      p.vx = mx !== 0 ? mx * P.SPEED * P.DASH_MULT : 0;
      p.isDash = false; p.dashReady = false; p.dashAir = true; p.kCon = true;
      // 空中冲刺跳恢复跳跃碰撞盒（=站立盒 A）：dashAir 动画走 jump 分支，碰撞盒须同步，不能停留在 dash 的低矮 B 盒
      // （含下蹲冲刺跳场景：只要不是强制蹲下，跳起后都站直为站立盒）
      if (!p.forcedCrouch) { setPlayerBox(HITBOX.stand.w, HITBOX.stand.h); p.crouch = false; }
      spawnPart(p.x + p.w / 2, p.y + p.h, 5, '#aaf');
    }
  }
  // Dash 2
  if (p.dashReady) {
    if (!lR) p.dashReady = false;
    if (kR && p.grounded && !p.kCon) {
      p.vy = P.JUMP; p.grounded = false; p.jumpCount = 1;
      if (p.floatT > 0) { p.floatT = 0; p.melee = 0; p.meleeCurStage = 0; }  // 跳跃打断滞空斩
      jumpDone = true;   // 阻止同帧跳跃块再走二段跳覆盖初速度（冲刺跳高度=普通跳）
      if (mx !== 0) p.vx = mx * P.SPEED * P.DASH_MULT;
      p.dashReady = false; p.dashAir = true; p.kCon = true;
      spawnPart(p.x + p.w / 2, p.y + p.h, 5, '#aaf');
    }
  }
  // 移动
  if (p.dashAtkT > 0) {
    // 冲刺斩：保持冲刺斩独立速度向前斩击（锁定触发时 dashAtkDir），提速 1.5 倍且与普通冲刺解耦
    p.vx = p.dashAtkDir * P.SPEED * MELEE_DASH_MULT;
  } else if (p.downT > 0) {
    // 下劈斩：向面朝方向下方 45° 冲刺（锁定触发时朝向 downDir）
    const sp = MELEE_DOWN_SPEED * 0.707;  // cos45 = sin45 ≈ 0.707
    p.vx = p.downDir * sp;
    p.vy = sp;
  } else if (p.floatT > 0) {
    // 滞空斩：全程悬浮，锁定水平位移
    p.vx = 0;
  } else if (p.shoryuT > 0 && p.vy < 0) {
    // 升龙上升阶段：锁定水平位移（保持 80° 仰角轨迹），达到最大高度(vy>=0)后解锁自由移动
    p.vx = p.facing * MELEE_SHORYU_VX;
  } else if (!p.isDash && !p.dashAir) {
    if (p.wjLock > 0) { p.vx = p.wjDir * P.WALL_JUMP_X; }
    else {
      if (mx !== 0) p.facing = mx;   // 面向始终跟随方向键（下蹲时也允许左右选择朝向）
      if (p.crouch || p.forcedCrouch) { p.vx = 0; }   // 下蹲时锁死位移，只允许 dash
      else if (mx !== 0) { p.vx = mx * P.SPEED; }
      else p.vx = 0;
    }
  }
  // Dash
  if (lD && p.grounded && !p.isDash && !p.dashReady) {
    // 站立→dash 切换碰撞盒 B 前检测冲突：若新碰撞盒与地形重叠则禁止本次 dash
    const dashBlocked = !p.crouch && !boxFitsTerrain(HITBOX.dash.w, HITBOX.dash.h);
    if (!dashBlocked) {
      p.isDash = true; p.dashDir = p.facing; p.lCon = true;
      const ds = P.SPEED * P.DASH_MULT;
      p.dashT = P.DASH_TIME;   // 时间限制（帧数固定），不再按距离换算
      p.vx = p.dashDir * ds;
      if (!p.crouch) setPlayerBox(HITBOX.dash.w, HITBOX.dash.h);   // dash 期间压低碰撞盒（宽=dash，高=crouch）
      spawnPart(p.x + p.w / 2, p.y + p.h / 2, 8, '#aaf');
    }
  }
  // 跳跃（含二段跳）：地面起跳 jumpCount=1；空中再跳 jumpCount=2；墙跳不消耗二段跳次数
  if (kD) {
    if (p.grounded && !p.isDash && !p.dashReady) {
      // 起跳前若处于下蹲，先恢复站立碰撞盒（跳跃碰撞盒=站立）
      if (p.crouch && !p.forcedCrouch && canStandUp()) {
        setPlayerBox(HITBOX.stand.w, HITBOX.stand.h);
        p.crouch = false;
      }
      p.vy = P.JUMP; p.grounded = false; p.kCon = true; p.jumpCount = 1;
      if (p.floatT > 0) { p.floatT = 0; p.melee = 0; p.meleeCurStage = 0; }  // 跳跃打断滞空斩
      p.floatAtkUsed = false; p.shoryuAtkUsed = false; p.jRePress = true;  // 新跳段：重置滞空/升龙次数、允许重新蓄力
      // 若仍在落地尾段播放中（landing=true）就再次起跳，舍弃剩余尾段，重新从起跳段(索引0)播放跳跃动画
      if (p.landing || p.animKey === 'jump' || p.animKey === 'jumpShoot') {
        p.landing = false;
        p.animF = 0; p.animT = 0;
      }
      if (lR) { if (mx !== 0) p.vx = mx * P.SPEED * P.DASH_MULT; p.dashReady = false; p.dashAir = true; spawnPart(p.x + p.w / 2, p.y + p.h, 5, '#aaf'); }
      else spawnPart(p.x + p.w / 2, p.y + p.h, 5, '#fff');
    } else if (p.onWall !== 0) {
      // 墙跳：不消耗二段跳次数（jumpCount 保持不变，墙跳后空中仍可二段跳）
      p.vy = P.WALL_JUMP_Y; p.facing = -p.onWall;
      p.wjLock = P.WALL_LOCK; p.wjDir = -p.onWall; p.kCon = true;
      if (lR) { p.vx = -p.onWall * P.WALL_JUMP_X * P.DASH_MULT; p.dashAir = true; spawnPart(p.x + p.w / 2, p.y + p.h / 2, 6, '#aaf'); }
      else { p.vx = -p.onWall * P.WALL_JUMP_X; spawnPart(p.x + p.w / 2, p.y + p.h / 2, 6, '#8cf'); }
    } else if (p.jumpCount < 2 && !jumpDone && !(p.shoryuT > 0 && p.vy < 0) && p.floatT <= 0) {
      // 二段跳：空中再次起跳，高度为原跳高的 0.8（升龙上升阶段/滞空斩期间禁止打断）
      p.vy = P.JUMP2; p.kCon = true; p.jumpCount = 2;
      if (p.floatT > 0) { p.floatT = 0; p.melee = 0; p.meleeCurStage = 0; }  // 跳跃打断滞空斩
      p.floatAtkUsed = false; p.shoryuAtkUsed = false; p.jRePress = true;  // 二段跳新跳段：每段各可触发一次、允许重新蓄力
      // 重新从起跳段播放跳跃动画
      if (p.landing || p.animKey === 'jump' || p.animKey === 'jumpShoot') {
        p.landing = false;
        p.animF = 0; p.animT = 0;
      }
      if (lR) { if (mx !== 0) p.vx = mx * P.SPEED * P.DASH_MULT; p.dashReady = false; p.dashAir = true; spawnPart(p.x + p.w / 2, p.y + p.h, 5, '#aaf'); }
      else spawnPart(p.x + p.w / 2, p.y + p.h, 5, '#fff');
    }
  }
  // Dash air：空中冲刺跳，方向键控制水平移动
  if (p.dashAir && !p.grounded && !p.onWall && !p.isDash && p.wjLock <= 0) {
    p.vx = mx !== 0 ? mx * P.SPEED * P.DASH_MULT : 0;
    if (mx !== 0) p.facing = mx;   // 面朝方向跟随方向键（与普通跳跃一致）
  }
  // 重力（滞空斩期间悬浮、下劈斩/冲刺斩期间速度已由移动块固定，均不受重力影响）
  if (p.floatT > 0) { p.vy = 0; }
  else if (p.downT > 0) { /* 速度由移动块固定，不受重力 */ }
  else if (p.dashAtkT > 0) { p.vy = 0; }
  else if (!p.isDash) { p.vy += GRAVITY; if (p.vy > MAX_FALL) p.vy = MAX_FALL; }

  // 碰撞
  p.x += p.vx;
  const xr = { x: p.x, y: p.y, w: p.w, h: p.h };
  for (let r = 0; r < LH; r++) for (let c = 0; c < LW; c++) {
    if (map[r * LW + c] === 0) continue;
    const t = { x: c * TILE, y: r * TILE, w: TILE, h: TILE };
    if (overlap(xr, t)) {
      if (p.vx > 0) p.x = t.x - p.w; else if (p.vx < 0) p.x = t.x + t.w;
      if (p.isDash) { endDash(); p.dashReady = lR; spawnPart(p.x + p.w / 2, p.y + p.h / 2, 6, '#888'); }
      if (p.downT > 0) { p.downT = 0; p.melee = 0; p.invT = 8; }  // 下劈斩撞墙结束，短暂无敌收尾
      if (p.dashAtkT > 0) { p.dashAtkT = 0; p.melee = 0; p.invT = 8; }  // 冲刺斩撞墙结束
      p.vx = 0;
    }
  }
  p.y += p.vy;
  const yr = { x: p.x, y: p.y, w: p.w, h: p.h };
  const wasGnd = p.grounded;
  p.grounded = false;
  for (let r = 0; r < LH; r++) for (let c = 0; c < LW; c++) {
    if (map[r * LW + c] === 0) continue;
    const t = { x: c * TILE, y: r * TILE, w: TILE, h: TILE };
    if (overlap(yr, t)) {
      if (p.vy > 0) { p.y = t.y - p.h; p.vy = 0; p.grounded = true; if (p.downT > 0) { p.downT = 0; p.melee = 0; p.invT = 8; } }
      else if (p.vy < 0) { p.y = t.y + t.h; p.vy = 0; }
    }
  }
  // 地面冲刺（isDash / 冲刺斩 dashAtkT）期间 vy 保持 0、不受重力，脚底贴地但 overlap 严格大于判定为 false，
  // 导致 grounded 无法恢复。这里单独用脚下探测补回 grounded，保证冲刺斩触发条件（isDash && grounded）成立。
  if ((p.isDash || p.dashAtkT > 0) && !p.grounded && hasGroundBelow()) {
    p.grounded = true;
  }
  if ((p.grounded && !wasGnd) || (p.onWall !== 0 && wasWall === 0)) p.dashAir = false;
  // 落地重置二段跳次数
  if (p.grounded && !wasGnd) { p.jumpCount = 0; if (lR) p.lCon = true; p.floatAtkUsed = false; p.shoryuAtkUsed = false; p.jRePress = true; }
  // 落地：若当前处于跳跃动画，标记进入落地收尾阶段（播放尾段 3 帧）
  if (p.grounded && !wasGnd && (p.animKey === 'jump' || p.animKey === 'jumpShoot')) {
    p.landing = true;
  }
  // 兜底清理：落地收尾期间若角色又离地（如高速冲刺跳擦过地面后立即腾空），
  // 强制清除 landing，避免空中误播落地尾段（半空闪落地动画）
  if (!p.grounded && p.landing) {
    p.landing = false;
  }

  // 世界边界（无底部边界限制，角色可自由掉落）

  // 摄像机
  updateCamera();

  // 下蹲：按住 S 蹲下，松开站起（dash/跳跃/旋风斩期间不处理）
  if (sR && p.grounded && !p.isDash && !p.dashAir && p.stormT <= 0) {
    setCrouch(true, false);
  } else if (!sR && !p.forcedCrouch) {
    setCrouch(false, false);
  }

  // 强制蹲下：每帧检测能否站起，能则恢复
  if (p.forcedCrouch) {
    if (canStandUp()) {
      setPlayerBox(HITBOX.stand.w, HITBOX.stand.h);
      p.crouch = false;
      p.forcedCrouch = false;
    }
  }

  // 怪物
  // 挥砍逐帧命中判定（仅 Zero）：动画期间每帧判定，命中冷却 6 帧，同帧多目标合并一次停顿
  if (CHARS[curChar].melee && p.melee > 0) doMeleeHit(p.meleeCurStage);

  // 世界更新：怪物/子弹/粒子/特效/残影照常运行
  // （hitstop 时仅玩家与受击敌人冻结，其余由 updateWorld 继续推进）
  updateWorld();

  if (keys[' ']) { reset(); keys[' '] = false; }

  // 角色动画状态机
  const animKey = playerAnimKey(p, mx);
  // 兜底清理：一旦动画脱离跳跃/跳跃射击（如下蹲、站立等），残留的 landing 标志立即失效，
  // 避免「落地后立即下蹲→松开站起」时 landing 残留导致误入 airborne 分支闪 jump
  if (animKey !== 'jump' && animKey !== 'jumpShoot' && p.landing) {
    p.landing = false;
  }
  if (animKey !== p.animKey) {
    // 同帧数动画对切换时保留当前帧索引，保证逐帧对应，避免切换瞬间帧索引重置造成错帧闪现
    const KEEP_FRAME_PAIRS = [
      ['jump', 'jumpShoot'],
      ['running', 'runShoot'],
      ['dash', 'dashShoot'],
    ];
    let keepFrame = false;
    for (const [a, b] of KEEP_FRAME_PAIRS) {
      if ((p.animKey === a && animKey === b) || (p.animKey === b && animKey === a)) {
        keepFrame = true;
        break;
      }
    }
    const prevKey = p.animKey;
    p.animKey = animKey;
    p.animT = 0;
    if (!keepFrame) {
      // shoot 动画从第二帧(索引1)开始倒放；其余动画从第一帧(索引0)开始
      p.animF = (animKey === 'shoot') ? 1 : 0;
      // 从贴墙滑行(climb)松开方向键自由下落时，直接定格在跳跃的空中帧(索引3)，不从头播起跳段
      if (prevKey === 'climb' && (animKey === 'jump' || animKey === 'jumpShoot')) {
        p.animF = 3;
      }
    }
  }
  const animEntry = PLAYER_SPRITES[p.animKey];
  const nf = animEntry ? animEntry.frames.length : 0;
  const frameDur = animEntry ? Math.round(60 / animEntry.fps / 1.5) : 4;
  if (nf > 0) {
    p.animT++;
    // 冲刺/冲刺射击：播放到第二帧后定格；攀爬：播放到最后一帧后定格（滑行姿态）
    const holdLast = (animKey === 'dash' || animKey === 'dashShoot' || animKey === 'climb');
    // 跳跃/跳跃射击：三段式——先播前4帧(索引0~3)→空中定格在第4帧(索引3)→落地播尾段(索引4~6)后切回
    const isJump = (animKey === 'jump' || animKey === 'jumpShoot');
    // 站立射击：从第二帧(索引1)倒放到第一帧(索引0)后定格，不循环
    const isShoot = (animKey === 'shoot');
    if (p.dashAtkT > 0 || p.downT > 0) {
      // 冲刺斩 / 下劈斩：持续定格在 dash 动画第二帧（索引 1）
      if (p.animF !== 1) p.animF = 1;
    } else if (holdLast && p.animF >= nf - 1) {
      // 定格在最后一帧
    } else if (isShoot && p.animF <= 0) {
      // 倒放到第一帧后定格
    } else if (isJump && !p.landing && p.animF >= 3) {
      // 空中定格在第4帧
    } else if (p.animT >= frameDur) {
      p.animT = 0;
      if (isShoot) {
        p.animF--;
      } else {
        p.animF++;
      }
      if (isJump && p.landing && p.animF >= nf) {
        // 落地尾段播完，切回站立
        p.animF = 0;
        p.landing = false;
      } else if (!isJump && !isShoot) {
        p.animF = p.animF % nf;
      }
    }
  }

  // 残影生成：冲刺/空中冲刺跳期间，每隔 3 帧记录一次当前精灵快照（用新模型资源）
  if ((p.isDash || p.dashAir) && p.animT % 3 === 0) {
    afterimages.push({ animKey: p.animKey, animF: p.animF, x: p.x, y: p.y, w: p.w, h: p.h, facing: p.facing, life: 12 });
  }

  // 射击动画持续计时：放在动画状态机之后递减，确保「本帧射击→本帧动画立即是射击形态」，
  // 避免 shootHold 在动画判定前归零造成 jump/jumpShoot、dash/dashShoot 间的一帧错位闪切
  if (p.shootHold > 0) p.shootHold--;
}

// ==================== 世界更新（怪物/子弹/粒子/特效/残影） ====================
// 正常帧与 hitstop 帧共用：hitstop 时玩家与被攻击的敌人冻结（定格受击瞬间），
// 其余单位/物体（其他怪物/子弹/粒子/特效/摄像机外逻辑）照常运行。
function updateWorld() {
  const p = player;
  const pr = { x: p.x, y: p.y, w: p.w, h: p.h };
  // 冻结判定：hitstop 期间被 Zero 近战命中的敌人，AI/物理/碰撞全部跳过，保持受击定格
  const frozen = en => hitstop > 0 && hitstopTargets.indexOf(en) !== -1;

  // 自动生成怪物：每秒 1 个，地图范围内随机可生成位置，全图上限 ENEMY_MAX
  spawnTimer++;
  if (spawnTimer >= ENEMY_SPAWN_CD) {
    spawnTimer = 0;
    if (enemies.length < ENEMY_MAX) {
      const type = ENEMY_SPAWN_TYPES[(Math.random() * ENEMY_SPAWN_TYPES.length) | 0];
      const pos = findSpawnPos(ET[type].w, ET[type].h);
      if (pos) enemies.push(mkEnemy(type, pos.x, pos.y));
    }
  }

  // 怪物 AI/物理：冻结目标跳过（受击定格），其余照常
  for (const en of enemies) {
    if (frozen(en)) continue;
    ai(en); enPhys(en);
  }

  // 玩家子弹 vs 怪物/墙
  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx; b.life--; b.animT++;
    const br = { x: b.x - b.w / 2, y: b.y - b.h / 2, w: b.w, h: b.h };
    let hit = false;
    // 记录最靠子弹发射侧的接触表面 x（兜底为子弹前边缘）
    let hitSurfaceX = b.dir > 0 ? -Infinity : Infinity;
    let hitY = b.y;
    // 打瓦片：接触边 = 瓦片靠近子弹那一侧的表面
    for (let r = 0; r < LH; r++) for (let c = 0; c < LW; c++) {
      if (map[r * LW + c] === 0) continue;
      const tl = { x: c * TILE, y: r * TILE, w: TILE, h: TILE };
      if (overlap(br, tl)) {
        hit = true; spawnPart(b.x, b.y, b.power === 2 ? 8 : 3, b.color);
        const sx = b.dir > 0 ? tl.x : tl.x + tl.w;
        if (b.dir > 0) { if (sx > hitSurfaceX) hitSurfaceX = sx; }
        else           { if (sx < hitSurfaceX) hitSurfaceX = sx; }
      }
    }
    // 打敌人：接触边 = 敌人靠近子弹那一侧的表面（冻结目标不参与碰撞，保持定格）
    for (let j = enemies.length - 1; j >= 0; j--) {
      const en = enemies[j];
      if (frozen(en)) continue;
      if (collide(br, enShape(en))) {
        hit = true;
        if (dmgEnemy(en, b.dmg)) enemies.splice(j, 1);
        else knockEnemy(en, b.dir, 0, 1.5);  // X 子弹命中：沿子弹方向水平轻微击退
        const sx = b.dir > 0 ? en.x : en.x + en.w;
        if (b.dir > 0) { if (sx > hitSurfaceX) hitSurfaceX = sx; }
        else           { if (sx < hitSurfaceX) hitSurfaceX = sx; }
      }
    }
    // 命中特效：以接触表面为中线（一半在目标内、一半在目标外）
    if (hit) spawnHitEffect(hitSurfaceX, hitY, b.dir, b.type);  // 命中特效（不延迟移除）
    if (hit || b.life <= 0 || b.x < camera.x - 22 || b.x > camera.x + VW / (camera.zoom * VIEW_SCALE) + 22) bullets.splice(i, 1);
  }

  // 敌人子弹 vs 玩家：hitstop 期间玩家冻结，跳过命中判定（子弹照常飞行/落地）
  for (let i = eBullets.length - 1; i >= 0; i--) {
    const b = eBullets[i];
    b.x += b.vx; b.y += b.vy; b.life--;
    const br = { x: b.x - b.w / 2, y: b.y - b.h / 2, w: b.w, h: b.h };
    if (hitstop <= 0 && overlap(br, pr) && p.invT <= 0) { dmgPlayer(2); spawnPart(b.x, b.y, 4, '#f4f'); eBullets.splice(i, 1); continue; }
    let hw = false;
    for (let r = 0; r < LH; r++) for (let c = 0; c < LW; c++) {
      if (map[r * LW + c] === 0) continue;
      if (overlap(br, { x: c * TILE, y: r * TILE, w: TILE, h: TILE })) hw = true;
    }
    if (hw || b.life <= 0 || b.x < camera.x - 22 || b.x > camera.x + VW / (camera.zoom * VIEW_SCALE) + 22 || b.y < -22 || b.y > VH / (camera.zoom * VIEW_SCALE) + 22) eBullets.splice(i, 1);
  }

  // 玩家碰怪物：hitstop 期间玩家冻结，跳过伤害判定
  if (hitstop <= 0 && p.invT <= 0) {
    for (const en of enemies) {
      if (frozen(en)) continue;
      if (collide(pr, enShape(en))) {
        dmgPlayer(ET[en.type].boss ? 3 : 1);
      }
    }
  }

  // 粒子
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i]; pt.x += pt.vx; pt.y += pt.vy; pt.vy += 0.04; pt.life--;
    if (pt.life <= 0) particles.splice(i, 1);
  }
  // 枪口发射特效（out）：播放一遍后移除
  for (let i = muzzleEffects.length - 1; i >= 0; i--) {
    const m = muzzleEffects[i];
    const entry = BULLET_SPRITES[`${m.key}-out`];
    const totalFrames = entry ? entry.frames.length : 0;
    const frameDur = entry ? Math.round(60 / entry.fps) : 6;
    m.animT++;
    if (totalFrames === 0 || m.animT >= totalFrames * frameDur) muzzleEffects.splice(i, 1);
  }
  // 命中特效（hit）：播放一遍后移除
  for (let i = hitEffects.length - 1; i >= 0; i--) {
    const h = hitEffects[i];
    const entry = BULLET_SPRITES[`${h.key}-hit`];
    const totalFrames = entry ? entry.frames.length : 0;
    const frameDur = entry ? Math.round(60 / entry.fps) : 6;
    h.animT += 2;  // 播放速度翻倍（帧切换速度 ×2）
    if (totalFrames === 0 || h.animT >= totalFrames * frameDur) hitEffects.splice(i, 1);
  }
  // Zero 近战受击特效：播放一遍后移除
  for (let i = meleeHitEffects.length - 1; i >= 0; i--) {
    const h = meleeHitEffects[i];
    const entry = BULLET_SPRITES['melee-hit'];
    const totalFrames = entry ? entry.frames.length : 0;
    const frameDur = entry ? Math.round(60 / entry.fps) : 6;
    h.animT += 2;  // 播放速度翻倍（帧切换速度 ×2）
    if (totalFrames === 0 || h.animT >= totalFrames * frameDur) meleeHitEffects.splice(i, 1);
  }
  // 旋风斩斩击波：水平飞行，撞怪（伤害）/撞墙/超时/出屏消失
  for (let i = stormWaves.length - 1; i >= 0; i--) {
    const w = stormWaves[i];
    w.x += w.vx;
    w.life--;
    w.animT++;
    // 斩击波左边缘对齐锚点：右飞(dir=1)内容在锚点右侧，左飞(dir=-1)内容在锚点左侧
    const wr = { x: w.dir > 0 ? w.x : w.x - w.w, y: w.y - w.h / 2, w: w.w, h: w.h };
    let gone = w.life <= 0;
    // 撞墙
    for (let r = 0; r < LH; r++) for (let c = 0; c < LW; c++) {
      if (map[r * LW + c] === 0) continue;
      if (overlap(wr, { x: c * TILE, y: r * TILE, w: TILE, h: TILE })) { gone = true; break; }
    }
    // 撞怪（冻结目标不参与）
    if (!gone) {
      for (let j = enemies.length - 1; j >= 0; j--) {
        const en = enemies[j];
        if (frozen(en)) continue;
        if (collide(wr, enShape(en))) {
          if (dmgEnemy(en, STORM_WAVE_DMG)) enemies.splice(j, 1);
          else knockEnemy(en, w.dir, 0, 1.5);
          gone = true;
          break;
        }
      }
    }
    // 出屏（水平方向超视野一定距离消失）
    if (!gone) {
      const viewW = VW / (camera.zoom * VIEW_SCALE);
      if (w.x < camera.x - 200 || w.x > camera.x + viewW + 200) gone = true;
    }
    if (gone) { spawnPart(w.x, w.y, 6, '#f88'); stormWaves.splice(i, 1); }
  }
  // 残影寿命递减（新残影的生成在下方动画状态机更新之后）
  for (let i = afterimages.length - 1; i >= 0; i--) { afterimages[i].life--; if (afterimages[i].life <= 0) afterimages.splice(i, 1); }
}

// ==================== 渲染 (所有世界坐标 - camera.x) ====================
function drawTile(x, y) {
  // 砖块内描边按 TILE 相对比例绘制，适配素材像素尺度（TILE=14）
  const b = Math.max(1, Math.round(TILE / 32));          // 基础描边宽度（素材像素下≈0.5→1）
  ctx.fillStyle = '#2a4a2a'; ctx.fillRect(x, y, TILE, TILE);
  ctx.fillStyle = '#3a5a3a'; ctx.fillRect(x + b, y + b, TILE - b * 2, TILE - b * 2);
  ctx.fillStyle = '#4a6a3a'; ctx.fillRect(x + b, y + b, TILE - b * 2, TILE - b * 2 - b);
  ctx.fillStyle = '#5a8a3a'; ctx.fillRect(x + b, y + b, TILE - b * 2, Math.max(1, Math.round(3 * TILE / 32)));
  ctx.strokeStyle = '#1a3a1a'; ctx.lineWidth = 1; ctx.strokeRect(x, y, TILE, TILE);
}

// 碰撞盒可视化：半透明显示所有实体物体的碰撞盒
function drawHitboxes() {
  // 地砖/地形碰撞盒（白色，只绘制可见范围）
  const invZ = 1 / camera.zoom;
  const startCol = Math.max(0, Math.floor(camera.x / TILE) - 1);
  const endCol = Math.min(LW, Math.ceil((camera.x + VW * invZ / VIEW_SCALE) / TILE) + 1);
  const startRow = Math.max(0, Math.floor(camera.y / TILE) - 1);
  const endRow = Math.min(LH, Math.ceil((camera.y + VH * invZ / VIEW_SCALE) / TILE) + 1);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.18)';
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.6)';
  ctx.lineWidth = 1;
  for (let r = startRow; r < endRow; r++) {
    for (let c = startCol; c < endCol; c++) {
      if (map[r * LW + c] === 0) continue;
      ctx.fillRect(c * TILE, r * TILE, TILE, TILE);
      ctx.strokeRect(c * TILE, r * TILE, TILE, TILE);
    }
  }

  // 玩家碰撞盒（青绿色）
  const p = player;
  ctx.fillStyle = 'rgba(0, 255, 200, 0.25)';
  ctx.strokeStyle = 'rgba(0, 255, 200, 0.8)';
  ctx.fillRect(p.x, p.y, p.w, p.h);
  ctx.strokeRect(p.x, p.y, p.w, p.h);

  // 敌人碰撞盒（红色）：圆形怪物（浮游眼）画圆，其余画矩形
  ctx.fillStyle = 'rgba(255, 60, 60, 0.25)';
  ctx.strokeStyle = 'rgba(255, 60, 60, 0.8)';
  for (const en of enemies) {
    const s = enShape(en);
    if (s.r !== undefined) {
      ctx.beginPath();
      ctx.arc(s.cx, s.cy, s.r, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();
    } else {
      ctx.fillRect(s.x, s.y, s.w, s.h);
      ctx.strokeRect(s.x, s.y, s.w, s.h);
    }
  }

  // 子弹碰撞盒（黄色）
  ctx.fillStyle = 'rgba(255, 255, 0, 0.25)';
  ctx.strokeStyle = 'rgba(255, 255, 0, 0.8)';
  for (const b of bullets) {
    ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
    ctx.strokeRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
  }
  for (const b of eBullets) {
    ctx.fillRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
    ctx.strokeRect(b.x - b.w / 2, b.y - b.h / 2, b.w, b.h);
  }
}

function drawX(cx, cy, f) {
  // 手绘小人（素材像素尺度）：原世界坐标 ÷2.286 后按素材像素重画
  const p = player;
  const lo = p.grounded && Math.abs(p.vx) > 0.2 ? Math.sin(p.animT * 0.8) * 1 : 0;
  ctx.fillStyle = '#24a'; ctx.fillRect(cx - 5, cy - 15, 11, 21);
  ctx.fillStyle = '#36c'; ctx.fillRect(cx - 4, cy - 14, 9, 9);
  ctx.fillStyle = '#24a'; ctx.fillRect(cx - 5, cy - 17, 10, 4);
  ctx.fillStyle = '#35b'; ctx.fillRect(cx - 4, cy - 16, 8, 2);
  ctx.fillStyle = '#c33'; ctx.fillRect(cx - 1, cy - 18, 3, 3);
  ctx.fillStyle = '#f55'; ctx.fillRect(cx - 1, cy - 18, 2, 2);
  ctx.fillStyle = '#fff';
  const ex = cx + f * 2; ctx.fillRect(ex - 1, cy - 14, 3, 2);
  ctx.fillStyle = '#111'; ctx.fillRect(ex + f * 1, cy - 13, 1, 1);
  ctx.fillStyle = '#35b'; const ax = cx + f * 6;
  ctx.fillRect(ax - 1, cy - 7, 4, 3);
  ctx.fillStyle = '#45c'; ctx.fillRect(ax + (f > 0 ? 2 : -2), cy - 6, 2, 1);
  ctx.fillStyle = '#ca3'; ctx.fillRect(cx - 5, cy + 4, 11, 2);
  ctx.fillStyle = '#138'; ctx.fillRect(cx - 4, cy + 6 + lo, 3, 7); ctx.fillRect(cx + 1, cy + 6 - lo, 3, 7);
  ctx.fillStyle = '#c33'; ctx.fillRect(cx - 4, cy + 12 + lo, 4, 2); ctx.fillRect(cx + 1, cy + 12 - lo, 4, 2);
}

// 用精灵绘制角色。所有动画统一按素材原尺寸 × SPRITE_SCALE 显示（不跟随碰撞盒缩放）。
// 水平对齐规则（均以「面朝右」为基准，面朝左时镜像）：
//  - 左对齐类：jump / jumpShoot / climb / dashShoot → 模型贴碰撞盒左侧，多余部分向面朝方向伸出
//  - runShoot「身体居中」：身体部分（=running 最大宽）居中于碰撞盒，枪向面朝方向伸出
//  - 其余（stand/shoot/running/dash/crouch）：模型整体水平居中
// 垂直对齐规则：
//  - 上下居中类：jump / jumpShoot / climb
//  - 其余：下对齐（脚底对齐碰撞盒底部）
function drawPlayerSprite(p, cx, cy) {
  const entry = PLAYER_SPRITES[p.animKey];
  if (!entry || !entry.loaded || entry.frames.length === 0) {
    drawX(cx, cy, p.facing);  // 回退到手绘小人
    return;
  }
  const fi = Math.min(p.animF, entry.frames.length - 1);
  const f = entry.frames[fi];

  const scale = SPRITE_SCALE;
  const dw = f.w * scale;
  const dh = f.h * scale;

  // ---- 水平对齐：计算「面朝右基准下」模型左边缘相对碰撞盒左(p.x)的偏移 offsetL ----
  const leftAlignAnims = { jump: 1, jumpShoot: 1, climb: 1, dashShoot: 1 };
  let offsetL;
  if (leftAlignAnims[p.animKey]) {
    offsetL = 0;  // 左对齐：模型左边缘贴碰撞盒左
  } else if (p.animKey === 'runShoot') {
    // 身体居中：身体部分（running 最大宽）居中，枪向面朝方向伸出
    const run = PLAYER_SPRITES.running;
    const bodyW = (run && run.maxW ? run.maxW : 34) * SPRITE_SCALE;
    offsetL = (p.w - bodyW) / 2;
  } else {
    offsetL = (p.w - dw) / 2;  // 居中
  }

  // ---- 垂直对齐 ----
  const vCenterAnims = { jump: 1, jumpShoot: 1, climb: 1 };
  let drawY;
  if (vCenterAnims[p.animKey]) {
    drawY = p.y + p.h / 2 - dh / 2;  // 上下居中
  } else {
    drawY = p.y + p.h - dh;          // 下对齐（脚底对齐）
  }

  // ---- 渲染朝向 rdir：climb 贴墙时面朝「朝外」方向（背对墙），其余用 facing ----
  // climb 素材默认面朝右、手在左（背对墙）；贴左墙(onWall=-1)时面朝右、手贴左墙
  const rdir = (p.animKey === 'climb') ? (-p.onWall) : p.facing;

  // ---- 模型水平位置：面朝右→左边缘=p.x+offsetL；面朝左→镜像到右侧 ----
  const modelLeft = (rdir > 0) ? (p.x + offsetL) : (p.x + p.w - offsetL - dw);

  // 素材默认面向右（rdir<0 才翻）
  const flip = rdir < 0;
  ctx.save();
  if (flip) {
    ctx.translate(modelLeft + dw / 2, drawY + dh / 2);
    ctx.scale(-1, 1);
    ctx.drawImage(entry.img, f.x, f.y, f.w, f.h, -dw / 2, -dh / 2, dw, dh);
  } else {
    ctx.drawImage(entry.img, f.x, f.y, f.w, f.h, modelLeft, drawY, dw, dh);
  }
  ctx.restore();
}

function drawPlayer() {
  const p = player;
  // 受击无敌闪烁（下劈斩/冲刺斩的无敌不闪烁，正常绘制）
  if (p.invT > 0 && p.downT <= 0 && p.dashAtkT <= 0 && Math.floor(p.invT / 3) % 2 === 0) return;
  const cx = Math.floor(p.x + p.w / 2);
  const cy = Math.floor(p.y + p.h / 2);
  ctx.save();
  for (const a of afterimages) {
    ctx.globalAlpha = (a.life / 12) * 0.35;
    const acx = Math.floor(a.x + a.w / 2);
    const acy = Math.floor(a.y + a.h / 2);
    drawPlayerSprite(a, acx, acy);  // 用新模型资源绘制残影快照
  }
  ctx.globalAlpha = 1; drawPlayerSprite(p, cx, cy);
  ctx.restore();
  if (p.isChg && p.chgT > P.CHG1) {
    const r = 10 + (p.chgT >= P.CHG2 ? 4 : 0);
    const al = 0.4 + Math.sin(Date.now() / 100) * 0.2;
    ctx.strokeStyle = p.chgT >= P.CHG2 ? `rgba(255,60,60,${al})` : `rgba(255,180,60,${al})`;
    ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy - 2, r, 0, Math.PI * 2); ctx.stroke(); ctx.lineWidth = 1;
  }
  // 近战挥砍可视化（Zero）
  if (p.melee > 0) {
    drawMeleeEffect(p, cx, cy);
  }
}

// 绘制近战挥砍刀光
// - 地面向上挥砍（upAtk）：保留 blade.png，逆时针旋转 175°
// - 地面/空中水平挥砍：按段数使用 blade1-1/1-2/1-3 序列帧，资源默认朝右，朝左时水平镜像；三段大小统一
function drawMeleeEffect(p, cx, cy) {
  if (p.dashAtkT > 0) {
    drawMeleeEffectDash(p, cx, cy);
  } else if (p.downT > 0) {
    drawMeleeEffectDown(p, cx, cy);
  } else if (p.floatT > 0) {
    drawMeleeEffectFloat(p, cx, cy);
  } else if (p.stormT > 0) {
    drawMeleeEffectStorm(p, cx, cy);
  } else if (p.shoryuT > 0) {
    drawMeleeEffectShoryu(p, cx, cy);
  } else if (p.airAtk) {
    drawMeleeEffectAir(p, cx, cy);
  } else if (p.upAtk) {
    drawMeleeEffectUp(p, cx, cy);
  } else {
    drawMeleeEffectHoriz(p, cx, cy);
  }
}

// 冲刺斩刀光：使用 dash-blade 单帧（去白透明），顺时针旋转 90°（向右冲刺斩），向左水平镜像。
function drawMeleeEffectDash(p, cx, cy) {
  const db = DASH_BLADE;
  if (db.loaded && db.frames.length > 0) {
    const total = db.frames.length;
    const f = db.frames[Math.floor((MELEE_DASH_T - p.dashAtkT) / 3) % total];
    const ds = P.PH / db.fh * 2.4;
    const dispW = f.w * ds, dispH = f.h * ds;
    // 锚点：角色前方（跟随冲刺方向）
    const ox = p.dashAtkDir * (dispW / 2);
    ctx.save();
    ctx.globalAlpha = 1;
    ctx.translate(cx + ox, cy);
    // 先水平镜像（左方向），再顺时针旋转 90°（竖向刀光转横向）
    ctx.scale(p.dashAtkDir > 0 ? 1 : -1, 1);
    ctx.rotate(Math.PI / 2);
    ctx.drawImage(db.img, f.x, f.y, f.w, f.h, -dispW / 2, -dispH / 2, dispW, dispH);
    ctx.restore();
    ctx.lineWidth = 1;
    return;
  }

  // fallback：资源未加载时回退到水平挥砍刀光
  drawMeleeEffectHoriz(p, cx, cy);
}

// 下劈斩刀光：使用 down-blade 序列帧（7 帧循环），逆时针旋转 45°（左下方下劈动画）。
// 素材为向左下方下劈：downDir=-1 原样，downDir=1 水平镜像（向右下方）。
function drawMeleeEffectDown(p, cx, cy) {
  const db = DOWN_BLADE;
  if (db.loaded && db.frames.length > 0) {
    const ds = P.PH / db.fh * 0.75 * 1.2;
    const total = db.frames.length;
    const fIdx = Math.floor((999 - p.downT) / MELEE_DOWN_DUR) % total;
    const f = db.frames[fIdx];
    const dispW = f.w * ds, dispH = f.h * ds;
    // 锚点：角色前方下方（跟随 45° 冲刺方向）
    const ox = p.downDir * dispW * 0.3;
    const oy = dispH * 0.4;
    ctx.save();
    ctx.globalAlpha = 1;
    ctx.translate(cx + ox, cy + oy);
    // 左下（downDir=-1）：逆时针 45°；右下（downDir=1）：逆时针 135°（不镜像）
    ctx.rotate(p.downDir > 0 ? -Math.PI * 3 / 4 : -Math.PI / 4);
    ctx.drawImage(db.img, f.x, f.y, f.w, f.h, -dispW / 2, -dispH / 2, dispW, dispH);
    ctx.restore();
    ctx.lineWidth = 1;
    return;
  }

  // fallback：资源未加载时回退到圆月斩
  drawMeleeEffectAir(p, cx, cy);
}

// 滞空斩刀光：第一部分 blast-blade（5 帧）→ 停滞 10 帧（保持最后一帧）→ 第二部分 blast-blade2（3 帧）。
// 锚点居中偏前（面朝方向），资源面朝右，面朝左水平镜像。
function drawMeleeEffectFloat(p, cx, cy) {
  const info = floatBladeInfo(p);
  if (info) {
    const { entry, f } = info;
    const progress = Math.min(1, p.melee / MELEE_ACTIVE);
    const alpha = progress;
    const fs = P.PH / entry.fh * 1.5 * (info.stage === 2 ? 1.1 : 0.8);
    const dispW = f.w * fs, dispH = f.h * fs;
    const refW = entry.fw * fs;
    const anchorX = cx + p.facing * (refW * 0.2 + p.w);
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.translate(anchorX, cy);
    // 面朝右原样（1），面朝左水平镜像（-1）
