<canvas id="game"></canvas>

    <div class="stamina"><label><span>体力</span></label><div class="bar"><i id="staminafill"></i></div></div>
  </div><div class="stats"><span class="pill" id="stage">奶油荒原</span></div></div>
  <div class="objective" id="objective"><strong id="objectiveTitle"></strong><div id="objectiveDetail"></div>
    <button id="challengeBoss" type="button" hidden>Enter · 挑战领主</button>
    <button id="cyclePractice" type="button" hidden>B · 切换练习</button>
  </div>
  <div id="boss"><label id="bossname"></label><div class="bar"><i id="bossfill"></i></div><div class="bar poise-track"><i id="poisefill"></i></div></div>

  <div class="action-deck" aria-label="基础操作"><div><kbd>J</kbd><b>轻击</b></div><div class="after-opening"><kbd>K</kbd><b>跳跃</b></div><div class="after-opening"><kbd>L</kbd><b>重击</b></div><div class="after-opening"><kbd>空格</kbd><b>闪避</b></div></div>
  <div class="bottom">
    <div id="equipment" hidden><div class="equipment-title"><strong id="stanceName">银叉刺剑</strong><button id="openArmory">R 换武器</button></div><div id="comboCue" hidden></div><div class="loadout" id="loadout"></div><div class="crew" id="crew"></div><button class="crew-button" id="cycleFusion" hidden>C 换搭档</button></div>
    <button id="ult" class="ult" hidden><strong id="ultname">合体</strong><label id="ulttext">0%</label><div class="bar"><i id="ultfill"></i></div><small id="ulthint"></small></button>
  </div>
</div>

<div id="joystick"><i></i></div><div id="mobile"><button id="lightTouch">轻击</button><button id="heavyTouch">重击</button><button id="jumpTouch">跳跃</button><button id="dashTouch">闪避</button><button id="ultTouch">合体</button></div>
<section id="title" class="overlay visible"><div class="title-layout"><div class="title-copy"><h1>甜界逃生</h1><p>挥起餐具，打出一条逃生路。</p><button class="button" id="start">Enter　开始</button><button class="button secondary" id="trainingStart">T　练习</button></div><div class="title-art"><canvas id="art" width="620" height="620"></canvas></div></div></section>
<section id="choice" class="overlay"><div class="panel"><div class="eyebrow" id="choiceTag"></div><h2 id="choiceTitle"></h2><p id="choiceSub"></p><div class="cards" id="cards"></div></div></section>
<section id="pauseScreen" class="overlay"><div class="panel"><div class="eyebrow">TAKE A BREATHER</div><h2>先喘口气。</h2><p>甜品们暂时停下了追杀。</p><button class="button" id="resume">继续逃生</button><button class="button secondary" id="restartPause">重新开始</button></div></section>
<section id="helpScreen" class="overlay"><div class="panel"><h2>操作</h2><div class="info-grid">
<article><h3>移动与出招</h3><p>方向键或 WASD 移动。J 轻击，K 跳跃，L 重击。跳起来按 L 会落斩。</p></article>
<article><h3>看清攻击范围</h3><p>薄荷色前摇可用轻击打断。橙色攻击按空格躲开，再回身打。</p></article>
<article><h3>武器与同伴</h3><p>R 换武器。打碎糖笼后走近同伴即可救援。共鸣满时按 Q 合体，有多个搭档时按 C 切换。</p></article>
</div><button class="button" id="closeHelp">返回</button></div></section>
<section id="armory" class="overlay"><div class="panel"><h2>换武器</h2><p>方向键选择 · Enter 装备 · R 返回</p><div class="form-grid" id="formCards"></div><button class="button" id="closeArmory">返回战斗</button></div></section><section id="end" class="overlay"><div class="panel"><div class="eyebrow" id="endTag"></div><h2 id="endTitle"></h2><p id="endSummary"></p><button class="button" id="again">再来一局</button></div></section>
