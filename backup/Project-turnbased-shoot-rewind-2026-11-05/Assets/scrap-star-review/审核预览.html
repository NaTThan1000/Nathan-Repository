<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Scrap Star 素材审核</title><style>
body{margin:0;background:#101b21;color:#e3eff0;font:16px system-ui;line-height:1.6}main{max-width:1200px;margin:auto;padding:24px}h1,h2{color:#83e1e9}section{padding:20px 0;border-bottom:1px solid #456}.note{background:#3a3020;padding:14px;border-radius:6px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}.card{background:#182b32;padding:14px;border:1px solid #435e67;border-radius:8px}.card h3{margin:0 0 8px}canvas{display:block;width:100%;max-width:300px;height:auto;background:#24373c;border:1px solid #566;image-rendering:pixelated}img.atlas{display:block;max-width:100%;background:#24373c;border:1px solid #566}button,select{font:inherit;padding:6px;margin:4px 5px 4px 0;background:#25444c;color:white;border:1px solid #65aab0;border-radius:4px}.sub{color:#c9d8d9}a{color:#9ce6ee}.strip{display:flex;flex-wrap:wrap;gap:10px}.tile{background:#24373c;border:1px solid #566;max-width:100%}
</style></head><body><main><h1>Scrap Star 素材审核</h1><p class="note">每项只展示本次选定的一套素材；不展示概念效果图或备用版本。角色动作与子弹分别审核，暂不拼接。预览仅截取原图，未改变素材；素材尚未接入试玩。</p><div id="app"></div><script>
'use strict';const app=document.getElementById('app');
function section(title,desc){const s=document.createElement('section'),h=document.createElement('h2'),p=document.createElement('p');h.textContent=title;p.className='sub';p.textContent=desc;s.append(h,p);app.append(s);return s}
function image(src){const i=new Image();i.src=src;return i}
function card(parent,title){const d=document.createElement('div'),h=document.createElement('h3');d.className='card';h.textContent=title;d.append(h);parent.append(d);return d}
function animation(parent,title,src,ranges,groups,baseY=510,scale=.47){const box=card(parent,title),cn=document.createElement('canvas');cn.width=300;cn.height=340;const ctx=cn.getContext('2d'),im=image(src),select=document.createElement('select'),prev=document.createElement('button'),play=document.createElement('button'),next=document.createElement('button'),caption=document.createElement('span');for(const key of Object.keys(groups)){const o=document.createElement('option');o.value=key;o.textContent=key;select.append(o)}prev.textContent='上一帧';play.textContent='播放';next.textContent='下一帧';let n=0,running=false,last=0;function draw(){const indices=groups[select.value],idx=indices[n],range=ranges[idx],x0=Math.max(0,range[0]-5),x1=Math.min(im.naturalWidth,range[1]+(range[3]?1:6));ctx.clearRect(0,0,300,340);if(im.complete&&im.naturalWidth){ctx.imageSmoothingEnabled=false;ctx.drawImage(im,x0,0,x1-x0,im.naturalHeight,150-(range[2]!==undefined?range[2]-x0:(x1-x0)/2)*scale,240-baseY*scale,(x1-x0)*scale,im.naturalHeight*scale)}caption.textContent=` ${select.value} ${n+1}/${indices.length}`;play.disabled=indices.length<2;}
prev.onclick=()=>{running=false;play.textContent='播放';n=(n+groups[select.value].length-1)%groups[select.value].length;draw()};next.onclick=()=>{running=false;play.textContent='播放';n=(n+1)%groups[select.value].length;draw()};select.onchange=()=>{running=false;play.textContent='播放';n=0;draw()};play.onclick=()=>{running=!running;play.textContent=running?'暂停':'播放'};im.onload=draw;box.append(cn,select,prev,play,next,caption);function tick(t){if(running&&t-last>180){n=(n+1)%groups[select.value].length;last=t;draw()}requestAnimationFrame(tick)}requestAnimationFrame(tick);}
function strip(parent,title,src,ranges,groups,baseline=510){const c=card(parent,title);for(const [name,indices] of Object.entries(groups)){animation(c,name,src,ranges,{[name]:indices},baseline)}}
function atlas(parent,title,src,note){const c=card(parent,title),im=image(src),p=document.createElement('p');im.className='atlas';im.alt=title;p.textContent=note;c.append(p,im)}
function crop(parent,title,src,rect,note){const c=card(parent,title),cn=document.createElement('canvas'),im=image(src),p=document.createElement('p');cn.width=rect[2];cn.height=rect[3];p.textContent=note;im.onload=()=>cn.getContext('2d').drawImage(im,rect[0],rect[1],rect[2],rect[3],0,0,rect[2],rect[3]);c.append(p,cn)}
const frontHitMark=image('动作拆分/向上/受击.png');
function splitFrames(parent,title,frames,baseY=510,defaultScale=.47){const box=card(parent,title),cn=document.createElement('canvas');cn.width=300;cn.height=340;const ctx=cn.getContext('2d'),pictures=frames.map(f=>image(f.src)),prev=document.createElement('button'),next=document.createElement('button'),play=document.createElement('button'),label=document.createElement('span');let frame=0,running=false,last=null;prev.textContent='上一帧';next.textContent='下一帧';play.textContent='播放';play.disabled=frames.length===1;function draw(){const im=pictures[frame],f=frames[frame];ctx.clearRect(0,0,300,340);if(im.complete&&im.naturalWidth){ctx.imageSmoothingEnabled=false;const breath=f.breath||1,scale=f.scale||defaultScale,baseline=f.baseY||baseY,anchorY=240,top=anchorY-baseline*scale*breath+(f.offsetY||0)*scale;const left=150-im.naturalWidth*scale/2;ctx.drawImage(im,0,0,im.naturalWidth,im.naturalHeight,left,top,im.naturalWidth*scale,im.naturalHeight*scale*breath);if(f.frontHitMark&&frontHitMark.complete&&frontHitMark.naturalWidth){for(const x of [30,224])ctx.drawImage(frontHitMark,x,237,46,74,left+x*scale,top+(237-26)*scale,46*scale,74*scale)}}label.textContent=` ${f.label||''} ${frame+1}/${frames.length}`};for(const pic of pictures)pic.onload=draw;prev.onclick=()=>{running=false;last=null;play.textContent='播放';frame=(frame+frames.length-1)%frames.length;draw()};next.onclick=()=>{running=false;last=null;play.textContent='播放';frame=(frame+1)%frames.length;draw()};play.onclick=()=>{running=!running;last=null;play.textContent=running?'暂停':'播放';draw()};box.append(cn,prev,play,next,label);function tick(t){if(running){if(last===null)last=t;if(t-last>=frames[frame].ms){frame=(frame+1)%frames.length;last=t;draw()}}requestAnimationFrame(tick)}requestAnimationFrame(tick)}
const hero=section('一、主角','正面和背面使用原来的动作帧。每段动作前播放一遍待机呼吸；正面喷气由身体遮挡，背面喷气从背包末端喷出；失败姿势尚未修正。');const hg=document.createElement('div');hg.className='grid';hero.append(hg);
// 高度不含喷焰；每个方向的移动使用同一缩放，射击和受击单独校准。
const heroMeasurements={'向下':{top:190,bottom:499,height:310,jumpTop:183,shot:[327,517],hit:[300,498]},'向上':{top:217,bottom:487,height:271,jumpTop:167,shot:[295,501],hit:[263,487]},'向左':{top:242,bottom:487,height:246,jumpTop:200,shot:[252,487],hit:[246,487]},'向右':{top:241,bottom:492,height:252,jumpTop:196,shot:[262,495],hit:[253,492]}};const targetHeight=246*.47;
function motionFrame(dir,n){return '动作拆分/'+dir+'/移动-'+n+((dir==='向下'||dir==='向上')?'.svg':'.png')}
for(const dir of ['向下','向上','向左','向右']){const c=card(hg,dir),p='动作拆分/'+dir+'/',ext='.png',m=heroMeasurements[dir],scale=targetHeight/m.height,idle=()=>[{src:p+'待机'+ext,ms:1000,label:'待机'},{src:p+'待机'+ext,ms:1000,breath:0.98,label:'待机呼吸'}],jumpOffset=m.top-m.jumpTop-(42*.47)/scale,move=[{src:motionFrame(dir,1),ms:100,label:'移动 1'},{src:motionFrame(dir,2),ms:100,offsetY:jumpOffset,label:'移动 2'},{src:motionFrame(dir,3),ms:100,label:'移动 3'}];splitFrames(c,'待机（每秒1帧）',idle(),m.bottom,scale);splitFrames(c,'喷气移动（含待机过渡）',[...idle(),...move],m.bottom,scale);splitFrames(c,'射击（含待机过渡）',[...idle(),{src:p+'射击'+ext,ms:150,label:'射击',scale:targetHeight/m.shot[0],baseY:m.shot[1]}],m.bottom,scale);splitFrames(c,'受击（含待机过渡）',[...idle(),{src:p+'受击'+ext,ms:150,label:'受击',scale:targetHeight/m.hit[0],baseY:m.hit[1],frontHitMark:dir==='向下'}],m.bottom,scale)}splitFrames(hg,'失败（原素材，姿势待修）',[1,2,3,4,5,6].map(n=>({src:'动作拆分/失败/失败-'+n+'.png',ms:100,label:'失败'})),510);
function crateReview(parent){const box=card(parent,'可破坏箱子：受击阶段'),cn=document.createElement('canvas');cn.width=300;cn.height=340;const ctx=cn.getContext('2d'),im=image('crate-break.png'),hit=document.createElement('button'),reset=document.createElement('button'),label=document.createElement('p'),ranges=[[57,309],[398,657],[743,1005],[1076,1393],[1473,1768],[1867,2095]];hit.textContent='攻击一次';reset.textContent='重置';let hits=0,breaking=false,start=0,phase=0;function draw(){ctx.clearRect(0,0,300,340);let f=hits===0?0:hits<3?1:hits===3?2:breaking?3+phase:-1;label.textContent=hits<4?`已攻击 ${hits} 次；显示第 ${f+1} 帧`:(breaking?`第四次攻击：破裂第 ${f+1} 帧`:'已破坏');if(f>=0&&im.complete&&im.naturalWidth){const [a,b]=ranges[f],w=b-a+11;ctx.drawImage(im,a-5,0,w,724,150-w*.4/2,40,w*.4,724*.4)}}im.onload=draw;hit.onclick=()=>{if(hits>=4)return;hits++;if(hits===4){breaking=true;start=performance.now();phase=0;hit.disabled=true}draw()};reset.onclick=()=>{hits=0;breaking=false;phase=0;hit.disabled=false;draw()};box.append(cn,hit,reset,label);function tick(t){if(breaking){phase=Math.floor((t-start)/120);if(phase>=3){breaking=false;phase=2}draw()}requestAnimationFrame(tick)}requestAnimationFrame(tick)}
function remoteBulletReview(parent){const box=card(parent,'远程机器人独立子弹'),cn=document.createElement('canvas');cn.width=360;cn.height=220;const ctx=cn.getContext('2d'),im=image('remote-projectile.svg'),button=document.createElement('button'),text=document.createElement('p');button.textContent='播放独立子弹';text.textContent='从原射击帧分离，独立飞行；机器人本体不随子弹移动。';let start=null;button.onclick=()=>{start=performance.now()};box.append(cn,button,text);function tick(t){ctx.clearRect(0,0,360,220);if(im.complete&&im.naturalWidth){const dt=start===null?0:Math.min(1200,t-start);ctx.drawImage(im,0,0,110,125,20+dt*.2,55,88,100)}requestAnimationFrame(tick)}requestAnimationFrame(tick)}
function bulletLifecycle(parent){const box=card(parent,'同一金色子弹：飞行→命中／射程结束'),cn=document.createElement('canvas');cn.width=360;cn.height=220;const ctx=cn.getContext('2d'),fly=image('bullets-four-directions.png'),fx=image('impact-expiration-orange.png'),impact=document.createElement('button'),expire=document.createElement('button'),label=document.createElement('p');impact.textContent='播放：飞行→命中';expire.textContent='播放：飞行→射程结束';let mode='命中',start=null;function begin(m){mode=m;start=performance.now()}impact.onclick=()=>begin('命中');expire.onclick=()=>begin('射程结束');box.append(cn,impact,expire,label);function tick(t){ctx.clearRect(0,0,360,220);const elapsed=start===null?0:t-start;if(elapsed<800&&fly.complete&&fly.naturalWidth){const f=Math.floor(elapsed/100)%3,x=[275,645,1013][f];ctx.drawImage(fly,x,740,250,220,20+elapsed/4,66,100,88);label.textContent='飞行：采用上方金色子弹的同一弹体'}else if(elapsed<1280&&fx.complete&&fx.naturalWidth){let n=Math.min(3,Math.floor((elapsed-800)/120));const index=mode==='命中'?[2,3,4,5][n]:[4,4,5,5][n],y=mode==='命中'?0:444;ctx.drawImage(fx,index*295,y,295,443,210,20,120,180);label.textContent=mode+'：仅播放火花／碎片，不切换成另一种弹体'}else{label.textContent='播放完成'}requestAnimationFrame(tick)}requestAnimationFrame(tick)}
const enemy=section('二、试玩怪物','各一种近战与远程外观。不同动作分组预览，不自动把待机、攻击和死亡拼成一段。');const eg=document.createElement('div');eg.className='grid';enemy.append(eg);animation(eg,'近战机器人','enemy-melee.png',[[42,246],[296,508],[565,770],[811,1034],[1059,1327],[1379,1581],[1631,1859],[1880,2145]],{'移动':[0,1,2],'攻击':[3,4],'受击':[5],'死亡':[6,7]},470);animation(eg,'远程机器人','enemy-ranged.png',[[50,257],[307,506],[556,758],[815,1017,916,true],[1074,1267,1172,true],[1382,1591],[1654,1842],[1896,2123]],{'悬浮':[0,1,2],'射击':[3,4],'受击':[5],'死亡':[6,7]},470);
const room=section('三、房间与地形','门只以这一套部件为准，图中包含四方向及开闭状态。实际试玩房间须按 13×7 铺设并校准格子。');atlas(room,'地板、墙和门：唯一选用的部件图','room-modules.svg','左上角为单格地板；四个门洞内部只有渐隐阴影，没有地面纹理。');const rg=document.createElement('div');rg.className='grid';room.append(rg);crop(rg,'废弃设施障碍','objects-effects-draft.png',[0,0,250,260],'一格障碍候选；最终占格待接入核对。');crateReview(rg);
const effects=section('四、子弹与特效','素材单独呈现；不使用角色与子弹的合成动画。');atlas(effects,'四方向子弹：上、下、左、右','bullets-four-directions.png','每行一个方向，尾迹与飞行方向相反。');bulletLifecycle(effects);remoteBulletReview(effects);const fx=document.createElement('div');fx.className='grid';effects.append(fx);crop(fx,'可移动与危险提示格','objects-effects-draft.png',[1020,60,380,215],'蓝色为可移动范围，红色为危险范围。');crop(fx,'回溯特效','objects-effects-draft.png',[40,810,1450,210],'从左至右为回溯动画候选。');
const ui=section('五、UI','文字和数值动态显示；心形最多两排各六，AP／MP 各预留十格，道具区域预留。');crop(ui,'UI 图标与信息面板','ui-draft.png',[0,0,1774,530],'包含生命、AP／MP、攻击、射程、资源和帮助等。');crop(ui,'结束回合按钮与道具区域','ui-draft.png',[20,710,1700,165],'按钮框与底部区域；文字动态显示。');const ug=document.createElement('div');ug.className='grid';ui.append(ug);crop(ug,'回合提示框','ui-turn-and-status.png',[90,40,1570,260],'蓝色为玩家回合，红色为怪物回合；文字动态显示。');
</script></main></body></html>
